*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;

h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:flex;flex-direction:column;gap:8px;min-height:100%}
#top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
#top .title{font-family:var(--f-display);font-weight:700;font-size:18px}
#top .sp{flex:1}
#now{display:flex;flex-wrap:wrap;gap:4px 18px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent,#1f7a8c);border-radius:10px;padding:7px 12px;font-size:13px;line-height:1.35}
#now b{font-weight:700}
#now .nx{color:var(--muted,#6b6354)}
#now:empty{display:none}
.pill{display:inline-flex;gap:6px;align-items:center;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-weight:600;white-space:nowrap}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid var(--ink)}
.dot.off{opacity:.2}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-weight:600;text-align:left}

.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{border-color:var(--danger);color:var(--danger)}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:8px;flex:1;min-height:0}
#mapwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:0}
#map{width:100%;height:auto;display:block;max-height:calc(100vh - 80px)}
#side{display:flex;flex-direction:column;gap:8px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.card h3{font-size:15px;margin-bottom:6px}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:3px 8px;background:var(--bg);font-size:12px}
.pchip.act{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.grp{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.grp>b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:5px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px;background:var(--bg)}
.small{font-size:12px;color:var(--muted)}
#log{max-height:200px;overflow:auto;font-size:12px;display:flex;flex-direction:column;gap:2px}
#log div{border-bottom:1px dashed var(--line);padding-bottom:2px}
.ov{position:fixed;inset:0;background:rgba(10,15,20,.6);display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}
.ov.solid{background:var(--bg)}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.modal h2{font-size:21px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t td,table.t th{border:1px solid var(--line);padding:3px 6px;text-align:center}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.chars .btn{display:flex;flex-direction:column;gap:2px}
.crd{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--bg);display:flex;gap:8px;align-items:center;justify-content:space-between}

.win{color:var(--good);font-weight:800}.lose{color:var(--danger);font-weight:800}

    let sum=0;const flagLocs=Object.keys(G.flags).filter(l=>G.flags[l]===q.i&&numOf(l)===n);
    let stand=q.loc!=='Z'&&q.loc!=='L'&&numOf(q.loc)===n&&!['jail','dozor','battle','start'].includes(G.type[q.loc]);
    for(const l of flagLocs){

      let x=PAYT[n];if(stand&&q.loc===l){x*=2;stand=false}

    G.lastWeather=w;log('Погода: '+w.n+'.');
    G.apMod=0;

      for(const l of Object.keys(G.flags)){if(numOf(l)!==n)continue;const o=G.players[G.flags[l]];if(o.ch==='nami'){log('Флаг Нами устоял (иммунитет).');continue}delete G.flags[l];o.fl++;log('Флаг '+o.name+' на '+locName(l)+' смыт.')}}
    if(w.k==='buster'){const n=d(12);log('Бросок 1d12: '+n+'. Локации №'+n+' бомбардируются!');
      for(const l of Object.keys(G.flags)){if(numOf(l)!==n)continue;const o=G.players[G.flags[l]];if(o.ch==='nami')continue;delete G.flags[l];o.fl++;log('Флаг '+o.name+' на '+locName(l)+' сгорел.')}
      for(const q of G.players){if(q.ch==='nami'||q.loc==='Z'||q.loc==='L'||numOf(q.loc)!==n)continue;q.jail=2;log(q.name+' отправлен в тюрьму бомбардировкой.')}}
    if(w.k==='storm')for(const q of G.players){
      if(q.ch==='nami'||q.loc==='Z'||q.loc==='L')continue;
      const opts=nbrsOf(q).filter(x=>x!=='Z'&&x!=='L'&&G.type[x]&&!['dozor','battle','jail'].includes(G.type[x]));
      if(opts.length){const t=opts[d(opts.length)-1];q.prev=q.loc;q.loc=t;q.sea=seaOf(t);log(q.name+' унесён штормом на '+locName(t)+'.')}
    }
  }
  searchStep(cb);
}

function setZun(cell){

// ---------- Laftel search ----------
function ownersKey(){return G.players.map(p=>p.pon.length).join(',')+'|'+G.players.map(p=>p.pon.join('+')).join(';')}
function searchStep(cb){
  const S=G.search;
  if(G.laftel){cb();return}
  const total=G.players.reduce((a,p)=>a+p.pon.length,0);
  if(S.phase==='idle'){
    if(total<4||S.veto===ownersKey()){cb();return}
    const owners=G.players.filter(p=>p.pon.length);
    const next=i=>{
      if(i>=owners.length){S.phase='rolling';log('Все владельцы понеглифов согласились. Начинается поиск Лафтейла.');doSearchRoll();cb();return}
      ask('consent',{who:owners[i].i,title:'Поиск Лафтейла',text:'Все 4 роад-понеглифа найдены. Согласны запустить вычисление координат? Любой владелец может отказаться.',
        opts:[{label:'Согласен',run:()=>next(i+1)},{label:'Отказываюсь (вето)',run:()=>{S.veto=ownersKey();log(owners[i].name+' наложил вето на поиск Лафтейла.');cb()}}]});
    };
    next(0);
  }else if(S.phase==='rolling'){doSearchRoll();cb()}
  else cb();
}
function doSearchRoll(){
  const S=G.search,order=['E','W','N','S'];
  if(S.rolls.length>=4)return;
  const sea=order[S.rolls.length];
  let sum=0;for(let i=0;i<4;i++)sum+=Math.ceil(d(6)/2);
  const id=sea+sum;S.rolls.push(id);
  log('Роад-понеглифы указывают на '+locName(id)+'.');
  if(S.rolls.length===4){
    const pt=s=>MAPD.nodes[s];
    const [E,W,N,Sx]=S.rolls.map(pt);
    function inter(a,b,c,dd){
      const x1=a[0],y1=a[1],x2=b[0],y2=b[1],x3=c[0],y3=c[1],x4=dd[0],y4=dd[1];
      const den=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
      if(Math.abs(den)<1e-6)return[(x1+x2+x3+x4)/4,(y1+y2+y3+y4)/4];
      const px=((x1*y2-y1*x2)*(x3-x4)-(x1-x2)*(x3*y4-y3*x4))/den,py=((x1*y2-y1*x2)*(y3-y4)-(y1-y2)*(x3*y4-y3*x4))/den;
      return[Math.max(60,Math.min(1528,px)),Math.max(60,Math.min(1063,py))];
    }
    const [x,y]=inter(E,W,N,Sx);
    G.laftel={x:Math.round(x),y:Math.round(y),anch:S.rolls.slice()};
    for(const a of S.rolls)link('L',a);
    log('Нитки пересеклись: появился остров Лафтейл!');
    S.phase='done';
  }
}
function checkLaftelArrival(p){
  const need=p.ch==='robin'?3:4;
  if(p.pon.length>=need){win(p,'собрал все роад-понеглифы и добрался до Лафтейла');}
}
function win(p,why){G.winner=p.i;G.pending=null;log(pname(p)+' '+why+' и становится Королём Пиратов!')}
// ---------- tasks ----------
function giveTask(p,cat,def,loc){
  const t={cat,def,loc:loc||null,base:Object.assign({},p.cnt),seas:new Set([p.sea]),startSea:p.sea,target:null,done:false,takeAp:G.ap,turnNo:G.turnNo};
  if(def.k==='world'){do{t.target=d(12)}while(t.target===1);log(p.name+': выпало '+t.target+' — нужны 2 флага на локациях №'+t.target+' в двух морях и доход с них.')}
  return t;
}
function taskDone(p,t){
  const f=t.def,c=p.cnt,b=t.base;
  switch(f.k){
    case'winAny':case'winP':case'winB':case'winD':case'moves':return c[f.k]-b[f.k]>=f.n;
    case'flags':return flagCount(p)>=f.n;
    case'hold_atk':return p.atk.length>=f.n;
    case'hold_tre':return p.tre.length>=f.n;
    case'othersea':return p.loc!=='Z'&&p.loc!=='L'&&seaOf(p.loc)!==t.startSea;
    case'visitLoc':return p.loc===f.loc;
    case'visitNum':return p.loc!=='Z'&&p.loc!=='L'&&numOf(p.loc)===t.target;
    case'visitLow':return p.loc!=='Z'&&p.loc!=='L'&&numOf(p.loc)<=3&&seaOf(p.loc)!==t.startSea;
    case'seas':return t.seas.size>=f.n;
  }
  return !!t.done;
}
function checkTasks(){
  for(const p of G.players){
    if(G.pending)return;
    if(p.task&&taskDone(p,p.task))completeTask(p,'task');
    if(G.winner!=null)return;
    if(p.ltask&&taskDone(p,p.ltask))completeTask(p,'ltask');
    if(G.winner!=null)return;
  }
}
function giveCards(p,kind,n){
  for(let i=0;i<n;i++)drawFor(p,kind,c=>{if(!c)return;if(p[kind].length<10){p[kind].push(c);log(p.name+' получает '+(kind==='atk'?'карту атаки '+c.v:'пассивку «'+PAS[c.key].n+'»')+'.')}else{G.discard.push(c);log(p.name+': рука полна, карта ушла в сброс.')}});
}
function applyOpt(p,o,def){
  if(o.r){p.berries+=o.r;log(p.name+' получает +'+o.r+' Берри.')}
  if(o.atk)giveCards(p,'atk',o.atk);
  if(o.pas)giveCards(p,'pas',o.pas);
}
function taskReward(p,def){
  const o=def.o||[];
  if(o.length<=1){if(o[0])applyOpt(p,o[0],def);return}
  ask('pick',{who:p.i,title:'Награда за «'+def.t+'»: выберите',opts:o.map(x=>({label:x.lab,run:()=>applyOpt(p,x,def)}))});
}
function cancelTask(p,why){
  const t=p.task;if(!t)return;p.task=null;G.decks.tev.push(t.def);
  log(p.name+': задание «'+t.def.t+'» отменено ('+why+'), карта вернулась в колоду.');
}
function taskEvent(p,kind,info){
  const t=p.task;if(!t)return;
  if(kind==='pvpWin'){if(t.def.k==='conquer')t.armed=true;return}
  if(kind==='npcWin'){if(t.def.k==='npcNoPas'&&!info.pasUsed)t.done=true;return}
  if(t.cat!=='ev'||t.def.k!==kind)return;
  const f=t.def;
  if(kind==='bossWin'){
    if(f.lv&&!f.lv.includes(info.lv))return;
    if(f.noPas&&info.pasUsed)return;
    if(f.flawless&&info.lost>0)return;
    t.done=true;
  }else if(kind==='pvpInit'){
    if(info.rounds>=1)t.done=true;
  }
}
function marchCheck(p){
  const t=p.task;if(!t||t.cat!=='ev'||t.def.k!=='march'||!G.tm)return;
  if(t.turnNo===G.turnNo&&t.takeAp===G.apMax&&G.ap===0&&G.tm.buy===0&&G.tm.pvp===0&&p.cnt.moves-G.tm.mv0===G.apMax){t.done=true;completeTask(p,'task')}
}
function completeTask(p,slot){
  const t=p[slot];p[slot]=null;
  const dk=t.cat==='ev'?'tev':t.cat==='pon'?'tpon':'tlaf';
  G.decks[dk].push(t.def);
  if(t.cat==='ev'){log(pname(p)+' выполнил задание «'+t.def.t+'».');taskReward(p,t.def)}
  else if(t.cat==='pon'){
    delete G.ponAt[t.loc];p.pon.push(t.loc);
    log(pname(p)+' выполнил «'+t.def.t+'» и получил роад-понеглиф!');
  }else{win(p,'выполнил задание Лафтейла «'+t.def.t+'»')}
}
// ---------- duels ----------
function prepKey(side){return side.p?side.p.i:-1}
function validPrep(p,pr){
  if(!pr)return false;
  const ids=new Set();
  const per=p.ch==='zoro'?2:1;
  if(pr.slots.length>3)return false;
  for(const sl of pr.slots){if(sl.length>per)return false;for(const id of sl){if(ids.has(id))return false;ids.add(id);if(!p.atk.find(c=>c.cid===id))return false}}
  const pids=new Set();let reg=0,tp=0;
  for(const id of pr.pas){if(pids.has(id))return false;pids.add(id);const c=p.pas.find(c=>c.cid===id)||p.tre.find(c=>c.cid===id&&TRE[c.key].pas&&activeC(c));if(!c)return false;if(c.kind==='pas')reg++;else tp++}
  return reg<=2&&tp<=1;
}
function randomPrep(p){
  const hand=shuffle(p.atk.slice());
  const per=p.ch==='zoro'?2:1;
  const slots=[];
  for(let i=0;i<3;i++){const sl=[];for(let j=0;j<per;j++){if(hand.length&&rnd()<.9)sl.push(hand.pop().cid)}slots.push(sl)}
  const pas=shuffle(p.pas.slice()).slice(0,Math.floor(rnd()*3)).map(c=>c.cid);
  const tp=p.tre.filter(c=>TRE[c.key].pas&&activeC(c));
  if(tp.length&&rnd()<.5)pas.push(tp[0].cid);
  return{slots,pas};
}
function sideFromPrep(p,pr){
  const slots=pr.slots.map(sl=>sl.map(id=>p.atk.find(c=>c.cid===id)));
  const pas=pr.pas.map(id=>p.pas.find(c=>c.cid===id)||p.tre.find(c=>c.cid===id));
  const s=stats(p);
  return{p,A:s.A,U:s.U,slots,pas,ch:p.ch,name:p.name};
}
function runDuel(S1,S2){
  const S=[S1,S2];
  const st=S.map((s,i)=>{
    const opp=S[1-i];
    let keys=s.pas.map(c=>c.key);
    if(opp.ch==='hancock'&&s.p)keys=[];
    const has=k=>keys.includes(k);
    let tA=0,tU=0;for(const c of s.pas)if(TRE[c.key]&&TRE[c.key].pas&&keys.includes(c.key)){tA+=TRE[c.key].pas.a;tU+=TRE[c.key].pas.u}
    return{s,keys,has,tA,tU,carry:0,annul:false,marco:false,rumble:false,wins:0,placed:keys.slice()};
  });
  for(const x of st){if(x.has('rumble')&&x.s.p&&x.s.p.berries>=5){x.rumble=true}}
  const rounds=[],used=[[],[]];
  for(let r=0;r<3&&st[0].wins<2&&st[1].wins<2;r++){
    const cur=st.map((x,i)=>{
      const opp=st[1-i];
      let cards=(x.s.slots[r]||[]).slice();
      let ann=false;
      if(cards.length&&opp.has('barto')&&!x.annul){x.annul=true;cards.shift();ann=true}
      used[i].push(...(x.s.slots[r]||[]));
      let val=0;
      for(const c of cards){val+=c.v;if(x.s.ch==='luffy')val+=3;if(x.has('mihawk')&&c.v>=7)val+=4}
      const roll=x.keys.includes('jinwoo')?d(20):d(12);
      let pa=0;if(x.has('will'))pa+=2;if(x.rumble)pa+=3;
      const att=x.s.A+val+roll+pa+x.tA+x.carry;
      let ev=x.s.U+x.tU+(x.has('chopper')?2:0);
      if(x.keys.includes('fist')&&!opp.has('will'))ev+=10;
      return{val,roll,att,ev,ann,cs:(x.s.slots[r]||[]).map(c=>c.v),carry:x.carry,pa};
    });
    st.forEach(x=>x.carry=0);
    let sc=[cur[0].att-cur[1].ev,cur[1].att-cur[0].ev];
    const abs=[0,0];
    for(let i=0;i<2;i++){if(st[i].has('impact')){abs[i]=3;sc[1-i]-=3;}}
    for(let i=0;i<2;i++)if(abs[i])st[i].carry=abs[i];
    const nat=[false,false];
    for(let i=0;i<2;i++){if(st[i].keys.includes('natsu')&&!st[i].natsuUsed&&sc[i]<=sc[1-i]){st[i].natsuUsed=true;sc[i]+=20;nat[i]=true}}
    let out;
    if(sc[0]>sc[1])out=0;else if(sc[1]>sc[0])out=1;else{
      const m0=st[0].has('meito'),m1=st[1].has('meito');
      out=m0&&!m1?0:m1&&!m0?1:-1;
    }
    let marco=false;
    if(out>=0){const l=1-out;if(st[l].keys.includes('marco')&&!st[l].marco){st[l].marco=true;out=-1;marco=true}}
    if(out>=0)st[out].wins++;
    rounds.push({cur,sc,out,marco,abs,nat});
  }
  let winner=-1;if(st[0].wins>=2)winner=0;else if(st[1].wins>=2)winner=1;
  return{rounds,winner,st,used,w:[st[0].wins,st[1].wins]};
}
function applyDuelCards(res){
  // списать открытые карты атаки, Рамбл Болл, потерю карт-сокровищ при проигрыше
  [0,1].forEach(i=>{
    const x=res.st[i],p=x.s.p;if(!p)return;
    for(const c of res.used[i])discardCard(p,c);
    if(x.rumble){p.berries-=5}
    for(const c of x.s.pas.slice()){
      if(c.kind==='pas'){discardCard(p,c);continue}
      if(TRE[c.key].once){discardCard(p,c);continue}
    }
  });
}
function reqPrep(p,title,opp,cb){
  ask('prep',{who:p.i,title,opp,cb,opts:[{label:'Случайная расстановка (авто)',run:()=>cb(randomPrep(p))}]});
}
function startPvp(ch,df){
  const p=G.players[ch],q=G.players[df];
  const cb=()=>{
    G.duels++;

      const a=sideFromPrep(p,pp);
      reqPrep(q,'Дуэль: расстановка защитника (против '+pname(p)+')',p,qp=>{
        const b=sideFromPrep(q,qp);

        applyDuelCards(res);

        log('Дуэль '+p.name+' vs '+q.name+': '+res.w[0]+':'+res.w[1]+'. '+desc+'.');
        ask('duelResult',{who:ch,res,names:[p.name,q.name],title:'Итог дуэли',opts:[{label:'Продолжить',run:()=>afterPvp(p,q,res)}]});
      });
    });

  // Coupe de Burst

      {label:'Сыграть «Coupe de Burst»',run:()=>{discardCard(q,cb2);log(q.name+' отменил дуэль картой Coupe de Burst.');retreat(q,()=>{})}},
      {label:'Принять дуэль',run:cb}]});
  }else cb();

function afterPvp(p,q,res){
  const w=res.winner;
  taskEvent(p,'pvpInit',{rounds:res.w[0]});
  if(w===-1){
    log('Ничья: '+p.name+' уходит на соседнюю локацию.');
    retreat(p,()=>{});return;
  }
  const W=w===0?p:q,L=w===0?q:p;
  W.cnt.winP++;W.cnt.winAny++;
  taskEvent(W,'pvpWin',{});
  if(W.ltask&&W.ltask.def.k==='duelP'&&W.ltask.paid&&W.loc==='L')W.ltask.done=true;
  W.berries+=20;
  const buggy=res.st[w===0?1:0].keys.includes('buggy');
  const finish=()=>{
    retreat(L,()=>{if(L===p)G.endAfter=true});
  };
  if(buggy){log('Клоун Багги: '+W.name+' получает только 20 Берри.');finish();return}
  const hasP=L.pon.length>0,hasT=L.tre.length>0;
  const takeRandom=()=>{
    const pool=[...L.atk.map(c=>['atk',c]),...L.pas.map(c=>['pas',c])];
    if(!pool.length){finish();return}
    const [k,c]=pool[d(pool.length)-1];
    L[k].splice(L[k].indexOf(c),1);
    if(W[k].length<10){W[k].push(c);log(W.name+' вслепую забирает карту у '+L.name+'.')}else G.discard.push(c);
    finish();
  };
  const takeTre=()=>{
    const c=L.tre[d(L.tre.length)-1];L.tre.splice(L.tre.indexOf(c),1);
    if(W.tre.length<3){W.tre.push(c);log(W.name+' забирает карту сокровищ у '+L.name+'.')}else{G.discard.push(c);log(W.name+' забирает карту сокровищ, но слотов нет: она в сбросе.')}
    finish();
  };
  const takePon=()=>{
    const x=L.pon.pop();W.pon.push(x);
    G.ponAt[x]=undefined;delete G.ponAt[x];
    log(W.name+' забирает роад-понеглиф у '+L.name+'.');finish();
  };
  if(hasP||hasT){
    const o=[];
    if(hasP)o.push({label:'Забрать роад-понеглиф',run:takePon});
    if(hasT)o.push({label:'Забрать случайную карту сокровищ',run:takeTre});
    ask('loot',{who:W.i,title:'Трофей победителя',text:'Выберите, что забрать у '+L.name+'.',opts:o});
  }else takeRandom();
}
// retreat: choose neighbour for player p
function retreat(p,cb){
  let cands=nbrsOf(p).filter(x=>x!=='L'||true);
  const bad=x=>x!=='Z'&&x!=='L'&&(G.type[x]==='dozor'||G.type[x]==='battle');
  let good=cands.filter(x=>!bad(x)&&x!=='L');
  if(!good.length){
    // ближайшая нейтральная
    const seen=new Set([p.loc]);let fr=[p.loc];
    for(let k=0;k<6&&!good.length;k++){
      const nx=[];
      for(const a of fr)for(const b of (ADJ[a]||[])){if(seen.has(b))continue;seen.add(b);nx.push(b);if(!bad(b)&&b!=='L'&&b!==(G.zun&&G.zun.cell))good.push(b)}
      fr=nx;
    }
  }
  if(!good.length){cb&&cb();return}
  const o=good.map(x=>({label:locName(x)+(G.type[x]?' ('+TYPES[G.type[x]].n+')':x==='Z'?'':' (неизвестно)'),loc:x,run:()=>{
    log(p.name+' отступает на '+locName(x)+'.');
    arrive(p,x,{quiet:true},cb);
  }}));
  ask('retreat',{who:p.i,title:'Отступление: '+p.name,text:'Выберите соседнюю локацию.',opts:o,pick:good});
}
function startNpcFight(p,type,cb,fromJail){
  const deck=G.bossD[type];
  const b=deck.shift();deck.push(b);
  const npcOpp={ch:'npc',name:b.n};
  G.duels++;
  const origin=p.prev;
  reqPrep(p,'Бой: '+b.n+' (ур. '+b.lv+', А'+b.a+' / У'+b.u+')',{name:b.n,npc:true,A:b.a,U:b.u},pp=>{

      if(w===0){

        taskEvent(p,'npcWin',{pasUsed});
        if(p.ltask&&p.ltask.def.k==='lvl5'&&p.ltask.paid&&b.lv===5)p.ltask.done=true;
        const sks=SPECIAL_PAY[type][b.lv]||[];
        for(const sk of sks){const i=G.specials.findIndex(c=>c.key===sk);if(i>=0&&p.tre.length<3){const c=G.specials.splice(i,1)[0];p.tre.push(c);log(p.name+' получает особую карту «'+TRE[sk].n+'»!');break}}
        if(b.lv<=2&&type==='pirate'){const sh=p.tre.find(c=>c.key==='shears'&&activeC(c));if(sh){discardCard(p,sh);p.bA+=2;log(p.name+' применил Ножницы Похитителя Теней: +2 к атаке навсегда.')}}
        cb&&cb();
      }else if(w===1){
        if(type==='pirate'){
          p.skip=1;log(p.name+' проиграл боссу, отступает и пропустит следующий ход.');
          G.endAfter=true;
          if(origin&&origin!==p.loc&&(origin==='Z'||origin==='L'||MAPD.nodes[origin])){p.loc=origin;if(origin!=='Z'&&origin!=='L')p.sea=seaOf(origin)}
          cb&&cb();
        }else{
          const e=p.tre.find(c=>c.key==='escape');
          const arrest=()=>{p.jail=2;G.endAfter=true;log(p.name+' арестован дозором: 2 хода в тюрьме.');cb&&cb()};
          const BRIBE=15;
          const bribeOrArrest=()=>{
            if(p.berries>=BRIBE)ask('arrest',{who:p.i,title:'Арест',text:'Вы проиграли дозорному. Можно заплатить взятку '+BRIBE+' Берри (0 ОД) и остаться на свободе, либо принять арест: 2 хода в тюрьме.',opts:[
              {label:'Заплатить взятку '+BRIBE+' Берри',run:()=>{pay(p,BRIBE);log(p.name+' дал взятку '+BRIBE+' Берри и избежал ареста.');cb&&cb()}},
              {label:'Принять арест',run:arrest}]});
            else arrest();
          };
          if(e&&!hasTre(p,'key'))ask('escape',{who:p.i,title:'Арест',text:'Сыграть «Побег» сразу после поражения?',opts:[
            {label:'Сыграть «Побег»',run:()=>{discardCard(p,e);log(p.name+' избежал ареста.');retreat(p,cb)}},{label:'Нет, принять арест',run:bribeOrArrest}]});
          else if(hasTre(p,'key')){log('Ключ от Импел Даун: арест не действует.');cb&&cb()}
          else bribeOrArrest();
        }
      }else{log('Ничья с «'+b.n+'».');cb&&cb()}
    }}]});
  });
}
// ---------- treasure / actions ----------
function uniqueFight(p,c){
  const T=TRE[c.key],b=T.cond;

    const a=sideFromPrep(p,pp);
    const bs={p:null,A:b.a,U:b.u,slots:[],pas:[],ch:'npc',name:b.n};
    const res=runDuel(a,bs);
    applyDuelCards(res);
    log('Дуэль за карту «'+T.n+'»: '+res.w[0]+':'+res.w[1]+'.');
    ask('duelResult',{who:p.i,res,names:[p.name,b.n],title:'Итог дуэли за карту',opts:[{label:'Продолжить',run:()=>{
      if(res.winner===0){c.active=true;p.cnt.winAny++;log(p.name+' побеждает персонажа «'+b.n+'»: карта «'+T.n+'» активна.')}
      else if(res.winner===1&&T.lossObt){discardCard(p,c);log(p.name+' проиграл: карта «'+T.n+'» уходит в сброс.')}
      else log('Карта «'+T.n+'» остаётся неактивной.');
    }}]});
  });
}
function useTre(p,c){

    o.push({label:'Отмена',run:()=>{G.ap+=T.ap||0}});

  }else if(c.key==='ancient'){

    o.push({label:'Отмена',run:()=>{}});
    ask('pickloc',{who:p.i,title:'Древняя вивр-карта',text:'В какое море?',opts:o,pick:o.filter(x=>x.loc).map(x=>x.loc)});
  }else if(c.key==='dandan'){
    const cand=Object.keys(G.type).filter(l=>G.type[l]!=='start'&&G.type[l]!=='base');
    const o=cand.map(l=>({label:locName(l)+' ('+TYPES[G.type[l]].n+')',loc:l,run:()=>{
      discardCard(p,c);G.type[l]='base';log(p.name+' превращает '+locName(l)+' в обычную базу (Дэн-Дэн Муси).');
      const near=bfsNear(l,x=>G.type[x]==='base');
      for(const q of G.players)if(q.loc===l&&near){q.loc=near;q.sea=seaOf(near);log(q.name+' перенесён на '+locName(near)+'.')}
      if(G.flags[l]!=null){const ow=G.players[G.flags[l]];delete G.flags[l];if(near&&G.flags[near]==null&&!ownFlagNum(ow,near)){G.flags[near]=ow.i}else ow.fl++}
    }}));
    o.push({label:'Отмена',run:()=>{}});
    ask('pickloc',{who:p.i,title:'Золотой Дэн-Дэн Муси',text:'Выберите локацию.',opts:o,pick:cand});
  }else if(c.key==='poseidon'){
    const cand=Object.keys(G.type).filter(l=>G.type[l]!=='start');
    const o1=cand.map(l=>({label:locName(l)+' ('+TYPES[G.type[l]].n+')',loc:l,run:()=>{
      const o2=cand.filter(x=>x!==l).map(x=>({label:locName(x)+' ('+TYPES[G.type[x]].n+')',loc:x,run:()=>{
        const t=G.type[l];G.type[l]=G.type[x];G.type[x]=t;c.used=true;p.poseidonUsed=true;log(p.name+' меняет местами фишки '+locName(l)+' и '+locName(x)+'.');
      }}));
      o2.push({label:'Отмена',run:()=>{}});
      ask('pickloc',{who:p.i,title:'Посейдон: вторая локация',opts:o2,pick:cand.filter(x=>x!==l)});
    }}));
    o1.push({label:'Отмена',run:()=>{}});
    ask('pickloc',{who:p.i,title:'Древнее оружие Посейдон',text:'Первая локация.',opts:o1,pick:cand});
  }else if(c.key==='scav'){
    const pool=G.discard.filter(x=>(x.kind==='atk'&&p.atk.length<10)||(x.kind==='pas'&&p.pas.length<10)||(x.kind==='tre'&&p.tre.length<3));
    const uniq=[];const seen={};
    for(const x of pool){const k=x.kind+(x.v||x.key);if(!seen[k]){seen[k]=1;uniq.push(x)}}
    const o=uniq.map(x=>({label:cname(x),run:()=>{discardCard(p,c);G.discard.splice(G.discard.indexOf(x),1);p[x.kind].push(x);log(p.name+' достаёт из сброса: '+cname(x)+'.')}}));
    o.push({label:'Отмена',run:()=>{G.ap+=1}});
    ask('pick',{who:p.i,title:'Мусорщики',text:'Выберите карту из открытого сброса.',opts:o});
  }else if(c.key==='laxus'){
    discardCard(p,c);log(p.name+' вызывает громовой дождь (Лаксус): все игроки на стартовых локациях.');
    for(const q of G.players){q.prev=q.loc;q.loc=q.sea+'1'}
  }else if(c.key==='key'){
    const cand=Object.keys(G.type).filter(l=>G.type[l]==='jail'&&l!==p.loc);
    const o=cand.map(l=>({label:locName(l),loc:l,run:()=>{log(p.name+' телепортируется в тюрьму '+locName(l)+'.');arrive(p,l,{quiet:true})}}));
    o.push({label:'Отмена',run:()=>{G.ap+=1}});
    ask('pickloc',{who:p.i,title:'Ключ от Импел Даун',opts:o,pick:cand});
  }
}
function bfsNear(from,ok){
  const seen=new Set([from]);let fr=[from];
  while(fr.length){const nx=[];for(const a of fr)for(const b of (ADJ[a]||[])){if(seen.has(b))continue;seen.add(b);if(b!=='L'&&ok(b))return b;nx.push(b)}fr=nx}
  return null;
}
function ownFlagNum(p,loc){const n=numOf(loc);const c=Object.keys(G.flags).filter(l=>G.flags[l]===p.i&&numOf(l)===n).length;if(p.task&&p.task.def.k==='world'&&p.task.target===n)return c>=2;return c>0}
// ---------- action list ----------
function actions(){
  if(G.winner!=null)return[];
  if(G.pending)return optsOf().map(o=>Object.assign({g:'pending'},o));
  const p=P(),A=[],ap=G.ap;
  const add=(g,label,run,dis)=>A.push({g,label,run,dis:!!dis});
  // move
  for(const t of nbrsOf(p)){
    const cost=1;
    let dis=ap<cost;
    if(t!=='Z'&&t!=='L'&&isCombat(t)&&G.duels>=3)dis=true;
    if(t==='Z'&&!G.zun)continue;
    const lab=(t==='Z'?'Зунеша':locName(t))+(t!=='Z'&&t!=='L'&&G.type[t]?' · '+TYPES[G.type[t]].n:'');
    A.push({g:'move',label:lab,loc:t,dis,run:()=>{
      G.ap-=1;p.cnt.moves++;
      log(p.name+' идёт на '+locName(t)+'.');
      arrive(p,t,{},null);
    }});
  }
  // duel
  for(const q of G.players)if(q!==p&&q.loc===p.loc)add('duel','Вызвать на дуэль: '+pname(q)+(p.task&&p.task.def.k==='bribe'?' (отменит задание)':''),()=>{G.ap-=1;G.tm.pvp++;if(p.task&&p.task.def.k==='bribe')cancelTask(p,'дуэль с игроком');log(p.name+' вызывает '+q.name+' на дуэль.');startPvp(p.i,q.i)},ap<1||G.duels>=3);
  // flags
  const loc=p.loc;
  const here=loc!=='Z'&&loc!=='L';
  const lt=here?G.type[loc]:null;
  if(here&&lt&&!['jail','dozor','battle'].includes(lt)){
    const fo=G.flags[loc];
    const ownSame=ownFlagNum(p,loc)&&!(fo===p.i);
    if(fo==null)add('flag','Поставить флаг (2 ОД)',()=>{G.ap-=2;G.flags[loc]=p.i;p.fl--;log(p.name+' ставит флаг на '+locName(loc)+'.')},ap<2||p.fl<1||ownSame||lt==='start');
    else if(fo!==p.i)add('flag','Сжечь флаг '+G.players[fo].name+' и поставить свой (2 ОД)',()=>{const o=G.players[fo];G.ap-=2;o.fl++;G.flags[loc]=p.i;p.fl--;log(p.name+' сжигает флаг '+o.name+' и ставит свой.')},ap<2||p.fl<1||ownSame);
    if(fo===p.i)add('flag','Поднять свой флаг (бесплатно)',()=>{delete G.flags[loc];p.fl++;log(p.name+' поднимает свой флаг.')});
  }

    const def=G.decks.tpon.shift();
    p.task=giveTask(p,'pon',def,p.loc);G.ponAt[p.loc].owner=p.i;
    log(p.name+' читает роад-понеглиф: «'+def.t+'».');
  },ap<2||!!p.task);

    const dis=ap<2||p.pon.length<1;
    if(p.ch==='robin')add('task','Выбрать задание Лафтейла (2 ОД)',()=>{
      G.ap-=2;
      ask('pick',{who:p.i,title:'Нико Робин: задание Лафтейла',opts:G.decks.tlaf.map(def=>({label:def.t+' — '+def.d,run:()=>{G.decks.tlaf.splice(G.decks.tlaf.indexOf(def),1);p.ltask=giveTask(p,'laf',def);log(p.name+' выбирает задание Лафтейла «'+def.t+'».')}}))});
    },dis);
    else add('task','Карта Лафтейла (2 ОД)',()=>{G.ap-=2;const def=G.decks.tlaf.shift();p.ltask=giveTask(p,'laf',def);log(p.name+' тянет задание Лафтейла: «'+def.t+'».')},dis);
  }
  // draw cards
  add('cards','Взять карту атаки (3 ОД)',()=>{G.ap-=3;drawFor(p,'atk',c=>{if(c){p.atk.push(c);log(p.name+' берёт карту атаки.')}})},ap<3||p.atk.length>=10);
  add('cards','Взять пассивную способность (3 ОД)',()=>{G.ap-=3;drawFor(p,'pas',c=>{if(c){p.pas.push(c);log(p.name+' берёт пассивную способность.')}})},ap<3||p.pas.length>=10);

    if(['dandan','scav','key'].includes(c.key)&&activeC(c))add('tre','Сыграть: '+T.n+(T.ap?' ('+T.ap+' ОД)':''),()=>useTre(p,c),ap<(T.ap||0)||(c.key==='key'&&!Object.keys(G.type).some(l=>G.type[l]==='jail'&&l!==p.loc)));
    if(T.cond&&!c.active)add('tre','Сразиться за карту «'+T.n+'»: '+T.cond.n+' (А'+T.cond.a+' / У'+T.cond.u+')',()=>uniqueFight(p,c),G.duels>=3);
    if(c.key==='poseidon'&&!c.used&&c.active)add('tre','Сыграть: '+T.n+' (раз за игру)',()=>useTre(p,c));
    add('tre','Выбросить из руки: '+T.n+' (освободить слот)',()=>{discardTre(p,c,()=>{})});

        const step=n=>{if(n===0){lt2.done=true;return}

    if(kk==='zun'&&lt2.moved)add('task','Сбросить 1 куб понеглифа после перемещения («'+lt2.def.t+'»)',()=>{payCube();lt2.done=true},p.pon.length<1);
  }
  if(p.task&&p.task.def.k==='conquer'&&p.task.armed){
    const tk=p.task,tot=p.atk.reduce((a,c)=>a+c.v,0);
    add('task','Сбросить карты атаки суммой ≥10 («'+tk.def.t+'»)',()=>{
      const step=sum=>ask('pick',{who:p.i,title:'Кровь Завоевателя: сбросьте карты атаки (сброшено '+sum+' из 10)',opts:p.atk.map(c=>({label:'Атака '+c.v,run:()=>{p.atk.splice(p.atk.indexOf(c),1);G.discard.push(c);if(sum+c.v>=10)tk.done=true;else step(sum+c.v)}})).concat(sum===0?[{label:'Отмена',run:()=>{}}]:[])});

    if(kk==='contra'&&atMarket)for(const c of p.tre)add('task','Сбросить «'+TRE[c.key].n+'» («'+tk.def.t+'»)',()=>{discardCard(p,c);tk.done=true});
    if(kk==='rebuild'&&here&&lt==='base')add('task','Сбросить 3 карты атаки («'+tk.def.t+'»)',()=>{
      const step=n=>{if(n===0){tk.done=true;return}
        ask('pick',{who:p.i,title:'Перестройка арсенала: сбросьте карту атаки (осталось '+n+')',opts:p.atk.map(c=>({label:'Атака '+c.v,run:()=>{p.atk.splice(p.atk.indexOf(c),1);G.discard.push(c);step(n-1)}}))})};

    for(const q of G.players)if(q!==p&&q.sea===p.sea&&(q.atk.length+q.pas.length+q.tre.length))add('cards','Ло: украсть карту у '+q.name,()=>{
      G.stolen=true;
      const pool=[...q.atk.map(c=>c),...q.pas,...q.tre];

      if(p[k].length<(k==='tre'?3:10)){q[k].splice(q[k].indexOf(c),1);p[k].push(c);log(p.name+' крадёт карту у '+q.name+'.')}else log(p.name+' не смог унести карту: нет места.');
    });
  }
  add('end','Закончить ход',()=>{log(p.name+' завершает ход.');endTurn()});

function act(a){
  if(!a||a.dis||G.winner!=null)return;
  const wasPending=!!G.pending;
  if(wasPending){const pe=G.pending;G.pending=null;a.run();if(pe.type==='duelResult'&&!G.pending){}}
  else a.run();
  after();
}
function after(){
  let guard=0;
  while(guard++<5){
    checkTasks();
    if(G.winner!=null)break;
    if(!G.pending&&G.endAfter){G.endAfter=false;endTurn();continue}
    break;
  }
  if(!window.__nor)render();
}

function bind(){
  document.querySelectorAll('#modal [data-a],#side [data-a]').forEach(b=>b.onclick=()=>{const a=ACTS[+b.dataset.a];act(a)});
  document.querySelectorAll('[data-ui]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ui;
    if(k==='ready'){UI.viewer=+b.dataset.p;render()}
    else if(k==='rules'){UI.showRules=true;render()}
    else if(k==='close'){UI.showRules=false;render()}
    else if(k==='new'){G=null;UI.setup=null;render()}
  });
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;
    const a=ACTS.find(x=>x.loc===id&&!x.dis);
    if(a)act(a);
  });
  const pe=G&&G.pending;
  document.querySelectorAll('[data-dz]').forEach(b=>b.onclick=()=>{
    const Z=UI.dz;if(!Z||!pe)return;
    const n=pe.res.rounds.length;
    if(b.dataset.dz==='skip'){Z.shown=n;Z.spin=[false,false];Z.done=[false,false];render();return}
    const k=+b.dataset.k;
    const fast=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const fin=()=>{
      if(UI.dz!==Z||G.pending!==pe)return;
      Z.spin[k]=false;Z.done[k]=true;render();
      if(Z.done[0]&&Z.done[1])setTimeout(()=>{if(UI.dz===Z&&G.pending===pe){Z.shown++;Z.done=[false,false];render()}},900);
    };
    if(fast){fin();return}
    Z.spin[k]=true;render();
    const el=document.getElementById('d'+k);
    const hi=pe.res.st[k].keys.includes('jinwoo')?20:12;
    const tm=setInterval(()=>{if(el&&el.isConnected)el.textContent=1+Math.floor(Math.random()*hi)},60);
    setTimeout(()=>{clearInterval(tm);fin()},800);
  });
  if(pe&&pe.type==='prep'){
    const p=G.players[pe.who],S=UI.prep,per=p.ch==='zoro'?2:1;
    document.querySelectorAll('[data-pas]').forEach(b=>b.onclick=()=>{
      const id=+b.dataset.pas,i=S.pas.indexOf(id);
      if(i>=0)S.pas.splice(i,1);else{
        const c=p.pas.find(c=>c.cid===id)||p.tre.find(c=>c.cid===id);
        const reg=S.pas.filter(x=>p.pas.find(c=>c.cid===x)).length,tp=S.pas.length-reg;
        if(c.kind==='pas'&&reg<2)S.pas.push(id);else if(c.kind==='tre'&&tp<1)S.pas.push(id);
      }
      render();
    });
    document.querySelectorAll('[data-atk]').forEach(b=>b.onclick=()=>{
      const id=+b.dataset.atk;const sl=S.slots.find(s=>s.length<per);if(sl){sl.push(id);render()}
    });
    document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{S.slots[+b.dataset.slot].pop();render()});
    const ok=document.querySelector('[data-prepok]');
    if(ok)ok.onclick=()=>{
      const pr={slots:S.slots.map(s=>s.slice()),pas:S.pas.slice()};
      if(!validPrep(p,pr))return;
      UI.prep=null;
      const cb=pe.cb;G.pending=null;cb(pr);after();
    };
    const auto=document.querySelector('#modal [data-a]');
    if(auto)auto.onclick=()=>{UI.prep=null;act(ACTS[0])};
  }
}
// ---------- map ----------
function nodePos(id){
  if(id==='Z'){const c=MAPD.nodes[G.zun.cell];return[c[0]+34,c[1]-30]}
  if(id==='L')return[G.laftel.x,G.laftel.y];
  return MAPD.nodes[id];
}
function renderMap(){
  const R=33;
  let s='';
  s+='<defs><radialGradient id="gloss" cx="35%" cy="28%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".45" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></radialGradient>'
   +'<filter id="sh" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".55"/></filter>'
   +['N:#2fb3ad','W:#3fcf7c','E:#e0aa4a','S:#9a83e6'].map(x=>{const [k,c]=x.split(':');return '<linearGradient id="z'+k+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+c+'" stop-opacity=".30"/><stop offset="1" stop-color="'+c+'" stop-opacity=".08"/></linearGradient>'}).join('')+'</defs>';
  const Z={N:[14,120,780,500,'--sea'],W:[14,590,780,1000,'--sea2'],E:[808,120,1574,500,'--sea3'],S:[808,590,1574,1000,'--sea4']};
  for(const k in Z){const [x0,y0,x1,y1,c]=Z[k];s+='<rect x="'+x0+'" y="'+y0+'" width="'+(x1-x0)+'" height="'+(y1-y0)+'" rx="34" fill="url(#z'+k+')" stroke="rgba(255,255,255,.18)" stroke-width="2"/>'}
  s+='<rect x="14" y="508" width="1560" height="78" rx="20" fill="#0a2f2c" opacity=".55"/><text x="794" y="552" text-anchor="middle" font-size="22" fill="#9fd3c9" letter-spacing="6">ГРАНД ЛАЙН</text>';
  s+='<rect x="764" y="90" width="60" height="930" rx="26" fill="#e0533f" opacity=".28"/><text transform="translate(800,300) rotate(-90)" font-size="20" fill="#f3b3a8" letter-spacing="5">RED LINE</text>';
  const lab={N:[34,160],W:[34,970],E:[1554,160],S:[1554,970]};
  for(const k in lab)s+='<text x="'+lab[k][0]+'" y="'+lab[k][1]+'" font-size="28" fill="var(--ink)" text-anchor="'+(k==='E'||k==='S'?'end':'start')+'" font-weight="700">'+SEAS[k]+'</text>';
  for(const [a,b] of MAPD.edges){const p=MAPD.nodes[a],q=MAPD.nodes[b];s+='<line x1="'+p[0]+'" y1="'+p[1]+'" x2="'+q[0]+'" y2="'+q[1]+'" stroke="#e8efe9" stroke-opacity=".38" stroke-width="3" stroke-linecap="round"/>'}
  for(const r of REDL){const p=MAPD.nodes[r];s+='<line x1="'+p[0]+'" y1="'+p[1]+'" x2="'+MT[0]+'" y2="'+MT[1]+'" stroke="#c0392b" stroke-width="4" stroke-dasharray="10 7"/>'}
  s+='<circle cx="'+MT[0]+'" cy="'+MT[1]+'" r="26" fill="#8a6a3a" stroke="var(--ink)" stroke-width="3"/><text x="'+MT[0]+'" y="'+(MT[1]+60)+'" text-anchor="middle" font-size="16" fill="var(--ink)">Reverse Mountain</text>';
  if(G.laftel){for(const a of G.laftel.anch){const p=MAPD.nodes[a];s+='<line x1="'+p[0]+'" y1="'+p[1]+'" x2="'+G.laftel.x+'" y2="'+G.laftel.y+'" stroke="var(--gold)" stroke-width="3" stroke-dasharray="3 6"/>'}}
  const act=ACTS.filter(a=>a.loc&&!a.dis).map(a=>a.loc);
  const pickable=new Set([...act,...((G.pending&&G.pending.pick)||[])]);
  const ids=Object.keys(MAPD.nodes);
  for(const id of ids){
    const [x,y]=MAPD.nodes[id];
    const t=G.type[id];
    const fill=t?TYPES[t].c:'var(--node-hidden)';
    const dark=t==='market'||t==='jail'||t==='battle'||t==='dozor'||t==='start';
    const isRed=REDL.includes(id);
    s+='<g data-id="'+id+'" style="cursor:'+(pickable.has(id)?'pointer':'default')+'">';
    s+='<circle cx="'+x+'" cy="'+y+'" r="'+R+'" fill="'+fill+'" stroke="'+(isRed?'#ff6a5a':'rgba(0,0,0,.5)')+'" stroke-width="'+(isRed?5:2.5)+'" filter="url(#sh)"/>'
      +'<circle cx="'+x+'" cy="'+y+'" r="'+R+'" fill="url(#gloss)" pointer-events="none"/>'
      +'<circle cx="'+x+'" cy="'+y+'" r="'+(R-6)+'" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.5" stroke-dasharray="3 5" pointer-events="none"/>';
    s+='<text x="'+x+'" y="'+(y+9)+'" text-anchor="middle" font-size="26" font-weight="700" fill="'+(dark?'#fff':'#2a2118')+'">'+numOf(id)+'</text>';
    if(!t)s+='<text x="'+(x+R-6)+'" y="'+(y-R+12)+'" font-size="16" fill="var(--ink)">?</text>';
    if(pickable.has(id))s+='<circle class="ring" cx="'+x+'" cy="'+y+'" r="'+(R+8)+'" fill="none" stroke="var(--accent)" stroke-width="5"/>';
    if(G.flags[id]!=null){const c=G.players[G.flags[id]].color;s+='<line x1="'+(x-R+2)+'" y1="'+(y-R-16)+'" x2="'+(x-R+2)+'" y2="'+(y-R+8)+'" stroke="var(--ink)" stroke-width="3"/><polygon points="'+(x-R+2)+','+(y-R-16)+' '+(x-R+24)+','+(y-R-8)+' '+(x-R+2)+','+(y-R)+'" fill="'+c+'" stroke="var(--ink)" stroke-width="1.5"/>'}
    if(G.ponAt[id])s+='<rect x="'+(x+R-12)+'" y="'+(y-R-4)+'" width="22" height="22" transform="rotate(45 '+(x+R-1)+' '+(y-R+7)+')" fill="var(--gold)" stroke="var(--ink)" stroke-width="2"/><text x="'+(x+R-1)+'" y="'+(y-R+13)+'" text-anchor="middle" font-size="14" font-weight="700" fill="#2a2118">П</text>';
    s+='</g>';
  }
  // Laftel & Zunesha
  if(G.laftel){const {x,y}=G.laftel;const on=pickable.has('L');s+='<g data-id="L" style="cursor:pointer"><circle cx="'+x+'" cy="'+y+'" r="38" fill="var(--gold)" stroke="var(--ink)" stroke-width="4"/><text x="'+x+'" y="'+(y+6)+'" text-anchor="middle" font-size="16" font-weight="700" fill="#2a2118">Лафтейл</text>'+(on?'<circle class="ring" cx="'+x+'" cy="'+y+'" r="48" fill="none" stroke="var(--accent)" stroke-width="5"/>':'')+'</g>'}
  if(G.zun){const [x,y]=nodePos('Z');const on=pickable.has('Z');const c=MAPD.nodes[G.zun.cell];
    s+='<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+(R+6)+'" fill="none" stroke="#555" stroke-width="5" stroke-dasharray="6 4"/>';
    s+='<g data-id="Z" style="cursor:pointer"><ellipse cx="'+x+'" cy="'+y+'" rx="40" ry="24" fill="#8c8f96" stroke="var(--ink)" stroke-width="3"/><text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Зунеша</text>'+(G.ponAt.Z?'<rect x="'+(x+26)+'" y="'+(y-30)+'" width="18" height="18" fill="var(--gold)" stroke="var(--ink)" stroke-width="2"/>':'')+(on?'<ellipse class="ring" cx="'+x+'" cy="'+y+'" rx="50" ry="34" fill="none" stroke="var(--accent)" stroke-width="5"/>':'')+'</g>';}
  // players
  UI.np={};
  const byLoc={};
  for(const p of G.players)(byLoc[p.loc]=byLoc[p.loc]||[]).push(p);
  for(const loc in byLoc){
    const [x,y]=nodePos(loc);const arr=byLoc[loc];
    arr.forEach((p,i)=>{
      const ang=Math.PI*0.25+i*0.9;const px=x+Math.cos(ang)*(R+2),py=y+Math.sin(ang)*(R+2);
      UI.np=UI.np||{};UI.np[p.i]=[px,py];
      const op=(UI.pp||{})[p.i];const dx=op?op[0]-px:0,dy=op?op[1]-py:0;
      s+='<g class="pawn" data-dx="'+dx+'" data-dy="'+dy+'" pointer-events="none" filter="url(#sh)"><circle cx="'+px+'" cy="'+py+'" r="13" fill="'+p.color+'" stroke="'+(p===P()?'#fff':'rgba(255,255,255,.7)')+'" stroke-width="'+(p===P()?4:2)+'"/><circle cx="'+px+'" cy="'+py+'" r="13" fill="url(#gloss)"/><text x="'+px+'" y="'+(py+5)+'" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">'+esc(p.name[0]||'?')+'</text></g>';
    });
  }
  $('#map').innerHTML=s;
  const fast=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!fast)document.querySelectorAll('#map .pawn').forEach(g=>{
    const dx=+g.dataset.dx,dy=+g.dataset.dy;
    if(Math.abs(dx)+Math.abs(dy)<2)return;
    g.style.transform='translate('+dx+'px,'+dy+'px)';
    void g.getBoundingClientRect();
    requestAnimationFrame(()=>{g.style.transition='transform .6s cubic-bezier(.4,.1,.2,1)';g.style.transform='translate(0,0)'});
  });
  UI.pp=Object.assign({},UI.np);
}
// ---------- setup ----------
function renderSetup(){
  $('#top').innerHTML='<span class="title">Гранд Лайн</span><span class="sp"></span>';
  $('#side').innerHTML='';$('#map').innerHTML='';$('#legend').innerHTML='';
  if(!UI.setup)UI.setup={step:'count',n:2,names:['Игрок 1','Игрок 2','Игрок 3','Игрок 4'],order:[],picks:[],cur:0};
  const S=UI.setup;
  let h='<div class="ov solid"><div class="modal" style="max-width:900px">';
  if(S.step==='count'){
    h+='<h2>Гранд Лайн: новая партия</h2><div class="small">Один экран, ходите по очереди. Играют от 2 до 4 человек, по одному в каждом море.</div>';
    h+='<div class="row"><label>Игроков: <select id="cnt">'+[2,3,4].map(n=>'<option'+(S.n===n?' selected':'')+'>'+n+'</option>').join('')+'</select></label></div>';
    h+='<div class="row">'+[0,1,2,3].slice(0,S.n).map(i=>'<input id="nm'+i+'" value="'+esc(S.names[i])+'" maxlength="14" style="padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">').join('')+'</div>';
    h+='<button class="btn primary" id="go">Бросить кубики на очерёдность</button>';
  }else if(S.step==='roll'){
    h+='<h2>Очерёдность хода</h2><table class="t"><tr><th>Игрок</th><th>2d6</th></tr>'+S.order.map(o=>'<tr><td>'+esc(o.name)+'</td><td>'+o.r+'</td></tr>').join('')+'</table><div class="small">Больше сумма — раньше ход. Ничьи перебрасываются. Персонажей и море выбирают по порядку.</div><button class="btn primary" id="go2">Выбирать персонажей</button>';
  }else{
    const pl=S.order[S.cur];
    const taken=S.picks.map(p=>p.ch),seas=S.picks.map(p=>p.sea);
    h+='<h2>'+esc(pl.name)+', выберите персонажа и море ('+(S.cur+1)+'/'+S.order.length+')</h2>';
    h+='<div class="chars">'+Object.keys(CH).map(k=>'<button class="btn" data-ch="'+k+'"'+(taken.includes(k)?' disabled':'')+(S.selCh===k?' style="border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)"':'')+'><b>'+CH[k].n+'</b><span>атака '+CH[k].A+' · уклонение '+CH[k].U+'</span><span class="small">'+CH[k].d+'</span></button>').join('')+'</div>';
    h+='<div class="row">'+SEAK.map(s=>'<button class="btn" data-sea="'+s+'"'+(seas.includes(s)?' disabled':'')+(S.selSea===s?' style="border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)"':'')+'>'+SEAS[s]+'</button>').join('')+'</div>';
    h+='<button class="btn primary" id="pick"'+(S.selCh&&S.selSea?'':' disabled')+'>Подтвердить</button>';
  }
  h+='</div></div>';
  $('#modal').innerHTML=h;
  const g=id=>document.getElementById(id);
  if(S.step==='count'){
    g('cnt').onchange=e=>{S.n=+e.target.value;renderSetup()};
    g('go').onclick=()=>{
      S.names=S.names.map((x,i)=>{const el=g('nm'+i);return el?(el.value.trim()||x):x});
      let list=S.names.slice(0,S.n).map(n=>({name:n,r:0}));
      let ok=false,guard=0;
      while(!ok&&guard++<50){list.forEach(o=>o.r=d(6)+d(6));ok=new Set(list.map(o=>o.r)).size===list.length}
      list.sort((a,b)=>b.r-a.r);S.order=list;S.step='roll';renderSetup();
    };
  }else if(S.step==='roll'){g('go2').onclick=()=>{S.step='pick';renderSetup()}}
  else{
    document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{S.selCh=b.dataset.ch;renderSetup()});
    document.querySelectorAll('[data-sea]').forEach(b=>b.onclick=()=>{S.selSea=b.dataset.sea;renderSetup()});
    g('pick').onclick=()=>{
      S.picks.push({name:S.order[S.cur].name,ch:S.selCh,sea:S.selSea});S.selCh=null;S.selSea=null;S.cur++;
      if(S.cur>=S.order.length){const cfg={players:S.picks.slice()};UI.setup=null;newGame(cfg);render()}else renderSetup();
    };
  }
}
// ---------- test API ----------
window.__g={
  render:()=>render(),setViewer:v=>{UI.viewer=v},seed:n=>{seedv=n|0},noRender:v=>{window.__nor=v},
  start:(n,seed)=>{if(seed!=null)seedv=seed|0;const names=['A','B','C','D'].slice(0,n);const chs=shuffle(Object.keys(CH));const seas=shuffle(SEAK.slice());newGame({players:names.map((nm,i)=>({name:nm,ch:chs[i],sea:seas[i]}))});},
  get G(){return G},
  actions,act,after,
  step(){
    // выбор случайного действия бота; пока не завершён ход, предпочитает осмысленные
    const A=actions().filter(a=>!a.dis);
    if(!A.length)return false;
    let a;
    if(G.pending){
      if(G.pending.type==='prep'){const pe=G.pending;const p=G.players[pe.who];const pr=randomPrep(p);if(!validPrep(p,pr))throw new Error('bad random prep');G.pending=null;pe.cb(pr);after();return true}
      a=A[Math.floor(rnd()*A.length)];
    }else{
      const non=A.filter(x=>x.g!=='end');
      a=(non.length&&rnd()<.92)?non[Math.floor(rnd()*non.length)]:A.find(x=>x.g==='end');
    }
    act(a);return true;
  },
  check(){
    const err=[];
    const seen=new Set();
    for(const p of G.players){
      if(p.berries<0)err.push('berries<0 '+p.name);
      if(p.atk.length>10||p.pas.length>10||p.tre.length>3)err.push('limit '+p.name+' '+p.atk.length+' '+p.pas.length+' '+p.tre.length);
      if(p.fl<0||p.fl>4)err.push('fl '+p.fl);
      if(p.fl!==4-Object.keys(G.flags).filter(l=>G.flags[l]===p.i).length)err.push('flag count mismatch '+p.name);
      if(!p.loc||(p.loc!=='Z'&&p.loc!=='L'&&!MAPD.nodes[p.loc]))err.push('bad loc '+p.loc);
      if(p.loc==='Z'&&!G.zun)err.push('Z without zun');
      for(const c of [...p.atk,...p.pas,...p.tre]){if(seen.has(c.cid))err.push('dup card '+c.cid);seen.add(c.cid)}
      if(p.pon.length+Object.keys(G.ponAt).length>4+0&&false)err.push('pon');
    }
    for(const c of G.discard){if(seen.has(c.cid))err.push('dup discard '+c.cid);seen.add(c.cid)}
    const tot=G.players.reduce((a,p)=>a+p.pon.length,0)+Object.keys(G.ponAt).length;
    if(tot!==4)err.push('poneglyph total '+tot);
    if(G.ap<0)err.push('ap<0 '+G.ap);
    return err;
  }
};
render();
})();
