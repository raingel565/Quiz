<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Гранд Лайн: настольная игра</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="gl-manifest.json">
<meta name="theme-color" content="#0b100d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Гранд Лайн">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="gl-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"></noscript>
<link rel="preload" as="image" href="assets/hero.jpg">
<style>
/* Layout: карта слева на весь экран, панель игрока справа; на телефоне панель под картой. */
:root{
  --bg:#efe3c8; --panel:#f8f0dc; --ink:#2a2118; --muted:#7a6a52; --line:#c9b68e;
  --accent:#0f5c63; --accent-ink:#ffffff; --gold:#b98a2c; --danger:#a8321f; --good:#2d7a45;
  --sea:#bcd9d6; --sea2:#c9dcc0; --sea3:#e7d3a8; --sea4:#d6c8e0; --node-hidden:#d9bd82;
  --f-display:'Manrope',system-ui,sans-serif; --f-body:'Manrope',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1b24; --panel:#17262f; --ink:#ecdfc2; --muted:#9bab9f; --line:#30464f;
  --accent:#4fb3b8; --accent-ink:#06191c; --gold:#e0b552; --danger:#ef7a63; --good:#6cc287;
  --sea:#1d3b45; --sea2:#243d33; --sea3:#43391f; --sea4:#33284a; --node-hidden:#6f5d3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b24; --panel:#17262f; --ink:#ecdfc2; --muted:#9bab9f; --line:#30464f;
  --accent:#4fb3b8; --accent-ink:#06191c; --gold:#e0b552; --danger:#ef7a63; --good:#6cc287;
  --sea:#1d3b45; --sea2:#243d33; --sea3:#43391f; --sea4:#33284a; --node-hidden:#6f5d3a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:flex;flex-direction:column;gap:8px;min-height:100%}
#top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
#top .title{font-family:var(--f-display);font-weight:700;font-size:18px}
#top .sp{flex:1}
#now{display:flex;flex-wrap:wrap;gap:4px 18px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent,#1f7a8c);border-radius:10px;padding:7px 12px;font-size:13px;line-height:1.35}
#now b{font-weight:700}
#now .nx{color:var(--muted,#6b6354)}
#now:empty{display:none}
.pill{display:inline-flex;gap:6px;align-items:center;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-weight:600;white-space:nowrap}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid var(--ink)}
.dot.off{opacity:.2}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-weight:600;text-align:left}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{border-color:var(--danger);color:var(--danger)}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:8px;flex:1;min-height:0}
#mapwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:0}
#map{width:100%;height:auto;display:block;max-height:calc(100vh - 80px)}
#side{display:flex;flex-direction:column;gap:8px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.card h3{font-size:15px;margin-bottom:6px}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:3px 8px;background:var(--bg);font-size:12px}
.pchip.act{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.grp{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.grp>b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:5px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px;background:var(--bg)}
.small{font-size:12px;color:var(--muted)}
#log{max-height:200px;overflow:auto;font-size:12px;display:flex;flex-direction:column;gap:2px}
#log div{border-bottom:1px dashed var(--line);padding-bottom:2px}
.ov.pickov{background:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;pointer-events:none;align-items:flex-end;padding:0 8px calc(8px + env(safe-area-inset-bottom))}.pickbar{pointer-events:auto;max-width:520px;width:100%;background:var(--panel);color:var(--ink);border:2px solid #12a05a;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.35);padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px}.pickbar span{opacity:.85}.pickbar .grp{display:flex;flex-wrap:wrap;gap:6px}
.ov{position:fixed;inset:0;background:rgba(10,15,20,.6);display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}
.ov.solid{background:var(--bg)}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.modal h2{font-size:21px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t td,table.t th{border:1px solid var(--line);padding:3px 6px;text-align:center}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.chars .btn{display:flex;flex-direction:column;gap:2px}
.crd{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--bg);display:flex;gap:8px;align-items:center;justify-content:space-between}
.crd.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--bg))}
.slot{min-height:44px;border:2px dashed var(--line);border-radius:8px;padding:4px 8px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;flex:1;min-width:90px}
.num{font-family:var(--f-display);font-weight:700;font-size:18px}
.win{color:var(--good);font-weight:800}.lose{color:var(--danger);font-weight:800}
.ring{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
/* V14: интерактивный гайд */
#gd-catch{position:fixed;inset:0;z-index:200000;background:transparent}
#gd-hl{position:fixed;z-index:200001;border:3px solid #f2b01e;border-radius:14px;box-shadow:0 0 0 100vmax rgba(8,12,16,.68);pointer-events:none;transition:all .25s ease;display:none}
#gd-hl.full{inset:0!important;border:0;box-shadow:0 0 0 100vmax rgba(8,12,16,.72);left:50%!important;top:50%!important;width:0!important;height:0!important}
#gd-tip{position:fixed;z-index:200002;left:50%;transform:translateX(-50%);width:min(440px,calc(100vw - 20px));background:#fffdf7;color:#1c1f26;border:2px solid #5a3b1f;border-radius:16px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.5);font-size:15px;line-height:1.4}
#gd-tip h4{margin:0 0 6px;font-size:17px}
#gd-tip .gd-n{font-size:12px;color:#7a6a55;margin-bottom:4px;letter-spacing:.05em;text-transform:uppercase}
#gd-tip .gd-b{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#gd-tip .gd-b button{flex:1;min-width:90px;padding:9px 10px;border-radius:10px;border:1px solid #5a3b1f;background:#fff;color:#1c1f26;font-size:14px;font-weight:700;cursor:pointer}
#gd-tip .gd-b button.pr{background:#1c1f26;color:#fff}
#gd-tip .gd-sk{background:none!important;border:0!important;color:#7a6a55!important;font-weight:600!important;flex:none!important;text-decoration:underline}

#map .halo{animation:pulse 1.4s ease-in-out infinite}
#map .pawn image{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes bob{50%{transform:translateY(-3px) rotate(2deg)}}
/* V20 */

/* V21 */
.think i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:2px;animation:thk 1.2s infinite}
.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
@keyframes thk{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.turnme{background:var(--accent)!important;color:var(--accent-ink)!important;border-color:var(--accent)!important;animation:tme 1.6s ease-in-out infinite}
@keyframes tme{50%{box-shadow:0 0 0 5px rgba(79,179,184,.35)}}
#qoov{position:fixed;inset:0;z-index:9800;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(5,8,7,.62);backdrop-filter:blur(6px)}
#qoov .modal{max-width:560px;width:100%;max-height:calc(100vh - 24px);overflow:auto;display:flex;flex-direction:column;gap:10px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:16px}
#qoov h2{margin:0}
#qoov .tgrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px}
#qoov .seg{display:flex;gap:4px}
#qoov .seg .btn.on,#qoov .tg.on{background:var(--accent);color:var(--accent-ink)}
#qoov .rp{border-left:3px solid var(--line);padding:2px 0 2px 10px;font-size:13px}
#qoov .rph{margin-top:8px;font-weight:800;color:var(--accent)}
#qoov .ach{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:13px}
#qoov .ach.lock{opacity:.45}
.hintbar{flex-basis:100%;padding:6px 10px;border-radius:8px;background:rgba(79,179,184,.14);border:1px dashed var(--accent);font-size:13px}
#side .hl{animation:hlp 1.2s ease-in-out infinite;outline:2px solid var(--gold)}
@keyframes hlp{50%{box-shadow:0 0 0 6px rgba(224,181,82,.4)}}
.sttw{width:100%;align-self:stretch;overflow-x:auto}.stt{border-collapse:collapse;width:100%;font-size:13px}.stt th,.stt td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:center}.stt td:first-child,.stt th:first-child{text-align:left;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:520px){.stt{font-size:11.5px}.stt th,.stt td{padding:3px 3px}.stt td:first-child,.stt th:first-child{max-width:64px}}
.awd{font-size:13px;margin:2px 0}
/* V20: реакции */
#reactw{position:fixed;left:10px;bottom:10px;z-index:9000;display:none;font-family:inherit}
#reactw.on{display:block}
#reactb{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(28,31,38,.85);backdrop-filter:blur(10px);font-size:24px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#reactp{position:absolute;left:0;bottom:54px;display:none;flex-wrap:wrap;gap:4px;width:228px;padding:8px;border-radius:16px;background:rgba(28,31,38,.92);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);box-shadow:0 8px 24px rgba(0,0,0,.45)}
#reactp.open{display:flex}
#reactp button{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.08);font-size:22px;cursor:pointer}
#reactp button:active{transform:scale(.88)}
.rfloat{position:fixed;z-index:9500;pointer-events:none;text-align:center;animation:rfl 3s ease-out forwards}
.rfloat b{display:block;font-size:46px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.rfloat span{display:inline-block;margin-top:2px;padding:1px 8px;border-radius:9px;background:rgba(28,31,38,.85);color:#fff;font-size:12px;font-weight:700}
@keyframes rfl{0%{opacity:0;transform:translateY(20px) scale(.4)}12%{opacity:1;transform:translateY(0) scale(1.25)}25%{transform:scale(1)}100%{opacity:0;transform:translateY(-190px) scale(1)}}
/* V17: визуал — дуэль, карта, погода, баннеры */
.arena{display:flex;align-items:stretch;gap:6px;position:relative;flex-shrink:0;min-height:170px}.modal>*{flex-shrink:0}
.arena .dfc{flex:1;min-width:0;overflow:hidden;border:2px solid var(--pcol,#8a8f98);border-radius:18px;padding:10px 8px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.12))}
.arena .dfc h3{margin:6px 0 2px;font-size:16px}
.arena .por{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid var(--pcol,#8a8f98);box-shadow:0 0 18px var(--pcol,#8a8f98);display:block;margin:0 auto}
.arena .por.boss{display:flex;align-items:center;justify-content:center;font-size:38px;background:#2a1f1a;color:#f2b01e}
.arena .vs{align-self:center;font-weight:900;font-size:26px;color:#f2b01e;text-shadow:0 0 14px rgba(242,176,30,.8);animation:vsp 1.6s ease-in-out infinite}
.arena.shake{animation:shk .5s}
.pip{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin:0 3px;vertical-align:middle}
.pip.on{background:#f2b01e;border-color:#fff;box-shadow:0 0 12px #f2b01e}
.pip.pop{animation:pipp .7s}
.rbn{font-size:24px;font-weight:900;text-align:center;letter-spacing:.05em;text-transform:uppercase;color:#f2b01e;text-shadow:0 0 16px rgba(242,176,30,.7);animation:bnin .55s}
.rbn.draw{color:#aab3bd;text-shadow:none}
.fin{font-size:30px;font-weight:900;text-align:center;animation:finin .8s;text-shadow:0 0 22px rgba(242,176,30,.8)}
@keyframes ddrop{0%{transform:translateY(-120px) rotate(-360deg);opacity:0}60%{transform:translateY(8px) rotate(10deg);opacity:1}80%{transform:translateY(-6px)}100%{transform:none}}
@keyframes cfly{0%{transform:translateY(160px) scale(.3) rotate(25deg);opacity:0}100%{transform:none;opacity:1}}
.pd.drop{animation:ddrop .7s}.ccf{display:inline-block;animation:cfly .6s}
@keyframes vsp{50%{transform:scale(1.18)}}
@keyframes shk{10%,50%,90%{transform:translateX(-6px)}30%,70%{transform:translateX(6px)}}
@keyframes pipp{0%{transform:scale(0)}60%{transform:scale(1.7)}100%{transform:scale(1)}}
@keyframes bnin{0%{opacity:0;transform:scale(2.2)}100%{opacity:1;transform:scale(1)}}
@keyframes finin{0%{opacity:0;transform:scale(.4) rotate(-6deg)}70%{transform:scale(1.15)}100%{opacity:1;transform:none}}
/* карта */
#map .wv{animation:wvd 7s ease-in-out infinite alternate}
@keyframes wvd{from{transform:translateX(-6px)}to{transform:translateX(8px)}}
#map .rv{transform-box:fill-box;transform-origin:center;animation:rvf .75s ease}
@keyframes rvf{0%{transform:scaleX(0)}60%{transform:scaleX(1.18)}100%{transform:scaleX(1)}}
#map .ponglow{animation:pgl 1.8s ease-in-out infinite}
@keyframes pgl{50%{opacity:.78;filter:drop-shadow(0 0 7px #f2b01e)}}
#map .wake{fill:rgba(255,255,255,.75);stroke:rgba(90,150,170,.6);stroke-width:1.5;animation:wk 1s ease-out forwards;pointer-events:none}
@keyframes wk{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.2)}}
#map .mist{animation:mst 9s ease-in-out infinite alternate}
@keyframes mst{from{transform:translateX(-30px);opacity:.55}to{transform:translateX(30px);opacity:.9}}
/* погода и баннеры */
.wfx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.wfx i,.wfx svg{position:absolute;display:block}
.wfx-storm{background:rgba(15,25,45,.55)}
.wfx .rain{inset:-20% 0 0 0;background:repeating-linear-gradient(105deg,rgba(190,220,255,.55) 0 2px,transparent 2px 22px);animation:rainf .35s linear infinite;opacity:.8}
.wfx .rain.r2{background:repeating-linear-gradient(105deg,rgba(220,235,255,.35) 0 1px,transparent 1px 13px);animation-duration:.22s}
@keyframes rainf{from{transform:translate(0,-30px)}to{transform:translate(-20px,30px)}}
.wfx .flash{inset:0;background:#fff;opacity:0;animation:lfl 2.4s infinite}
@keyframes lfl{0%,12%,18%,100%{opacity:0}13%{opacity:.85}15%{opacity:.1}16%{opacity:.7}50%{opacity:0}52%{opacity:.6}54%{opacity:0}}
.wfx-buster{background:radial-gradient(circle at 50% 50%,rgba(255,200,90,.35),rgba(60,20,10,.6))}
.wfx .bflash{inset:0;background:#fff;animation:bfl 1.4s ease-out forwards}
@keyframes bfl{0%{opacity:.95}100%{opacity:0}}
.wfx .ring{left:50%;top:50%;width:40px;height:40px;margin:-20px;border:1px solid rgba(255,170,60,.9);border-radius:50%;animation:rng 1.6s ease-out infinite}
.wfx .ring.r2{animation-delay:.6s}
@keyframes rng{from{transform:scale(1);opacity:1}to{transform:scale(34);opacity:0}}
.wfx .smoke{left:0;right:0;bottom:-10%;height:55%;background:radial-gradient(ellipse at 50% 100%,rgba(70,60,60,.85),transparent 70%);animation:smk 3s ease-out infinite alternate}
@keyframes smk{from{transform:translateY(20px);opacity:.5}to{transform:translateY(-20px);opacity:1}}
.wfx-aqua{background:rgba(20,70,110,.35)}
.wfx .wave{left:0;bottom:0;width:200%;height:55%;animation:wvr 3s ease-in-out infinite alternate}
.wfx .wave.w2{height:42%;animation-duration:2.2s;opacity:.7}
@keyframes wvr{from{transform:translateX(0) translateY(40px)}to{transform:translateX(-25%) translateY(-10px)}}
.wfx-tarai{background:rgba(30,100,140,.3)}
.wfx .cur{left:-30%;width:60%;height:5px;border-radius:5px;background:linear-gradient(90deg,transparent,rgba(190,235,255,.9),transparent);animation:curm 1.6s linear infinite}
.wfx .cur:nth-child(1){top:30%}.wfx .cur.c2{top:48%;animation-delay:.5s}.wfx .cur.c3{top:66%;animation-delay:1s}
@keyframes curm{from{transform:translateX(0)}to{transform:translateX(260%)}}
.wfx-belt{background:rgba(200,215,225,.35)}
.wfx .mist{inset:20% -10%;background:radial-gradient(ellipse,rgba(255,255,255,.85),transparent 70%);filter:blur(14px);animation:mst 5s ease-in-out infinite alternate}
.wfx .mist.m2{inset:40% -20% -10% 10%;animation-duration:7s}
.wfx-zun{background:rgba(40,25,10,.5)}
.wfx .quake{inset:0;background:radial-gradient(circle at 50% 100%,rgba(120,80,30,.75),transparent 60%);animation:shk .6s infinite}
#evfx.wk-zun .evc{animation:shk .7s 2}
#evfx.bnrfx .evc{background:rgba(20,16,12,.9);border:2px solid #f2b01e;box-shadow:0 0 40px rgba(242,176,30,.45)}
#evfx.bnrfx .evi{font-size:64px;animation:finin .6s}
#evfx.bnrfx .evt{font-size:30px;font-weight:900;letter-spacing:.04em}
#evfx.bnrfx.bad .evc{border-color:#d9534f;box-shadow:0 0 40px rgba(217,83,79,.5)}
#evfx.bnrfx.good .evc{border-color:#3ddc84;box-shadow:0 0 40px rgba(61,220,132,.45)}

@media (prefers-reduced-motion:reduce){.ring{animation:none}}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)}#map{max-height:none}}
svg text{font-family:var(--f-display)}
/* ===== Soft dark theme: выпуклые панели, градиенты, мягкие тени ===== */
:root:root:root{
  --bg:#0b100d; --panel:#1f2529; --ink:#e8efe9; --muted:#8e9d95; --line:rgba(255,255,255,.08);
  --accent:#34c46d; --accent-ink:#04170c; --gold:#f2b84a; --danger:#ff7a4d; --good:#4fd48a;
  --sea:#1f6f6a; --sea2:#238a52; --sea3:#9a7430; --sea4:#6b57b8; --node-hidden:#7d8a80;
  --raise:linear-gradient(150deg,#2a3135 0%,#1b2023 100%);
  --sunk:#121619;
  --sh-out:6px 8px 18px rgba(0,0,0,.5),-3px -3px 10px rgba(255,255,255,.035),inset 0 1px 0 rgba(255,255,255,.07);
  --sh-in:inset 3px 4px 9px rgba(0,0,0,.65),inset -2px -2px 6px rgba(255,255,255,.04);
  color-scheme:dark}
html{background:#0b100d}

/* V21: светлая тема */
:root[data-theme="light"]:root:root{

/* ===== V44: графит + золото, интерфейс в стиле gaming-app ===== */
:root:not([data-theme="light"]):root:root:root{
  --bg:#0d1012; --panel:#23292d; --ink:#ece6d6; --muted:#98a0a0; --line:rgba(255,255,255,.08);
  --accent:#e9b94a; --accent-ink:#2f2204; --gold:#f2c14e; --danger:#ff7d5c; --good:#79cf90;
  --raise:linear-gradient(150deg,#2f373c 0%,#1e2428 100%); --sunk:#161a1d;
  --sh-out:7px 9px 20px rgba(0,0,0,.5),-3px -3px 10px rgba(255,255,255,.04),inset 0 1px 0 rgba(255,255,255,.08);
  --sh-in:inset 3px 4px 9px rgba(0,0,0,.6),inset -2px -2px 6px rgba(255,255,255,.04)}
:root[data-theme="light"]:root:root:root{--accent:#b9811a;--accent-ink:#ffffff;--gold:#a87310}
html:not([data-theme="light"]){background:#0d1012}
html:not([data-theme="light"]) body{background:radial-gradient(900px 600px at 12% 108%,rgba(233,185,74,.12),transparent 60%),radial-gradient(800px 500px at 100% -10%,rgba(233,185,74,.07),transparent 60%),#0d1012;background-attachment:fixed}
html:not([data-theme="light"]) #mapwrap{background:radial-gradient(120% 120% at 50% 40%,#3a3425 0%,#262218 60%,#1a1710 100%)}
.dot{box-shadow:0 0 8px rgba(233,185,74,.7)}
.btn:hover:not(:disabled){box-shadow:var(--sh-out),0 0 0 1px rgba(233,185,74,.5)}
.btn.primary,:root[data-theme="light"] .btn.primary{background:linear-gradient(180deg,#f7d06a,#c88f1c);color:#2f2204;box-shadow:0 8px 18px rgba(200,143,28,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.dgo{box-shadow:0 0 0 0 rgba(233,185,74,.6);animation:dpulse2 1.4s infinite}
@keyframes dpulse2{70%{box-shadow:0 0 0 14px rgba(233,185,74,0)}100%{box-shadow:0 0 0 0 rgba(233,185,74,0)}}
.turnme{animation:tme2 1.6s ease-in-out infinite}
@keyframes tme2{50%{box-shadow:0 0 0 5px rgba(233,185,74,.35)}}
.hintbar{background:rgba(233,185,74,.12)}
.crd.sel{background:linear-gradient(150deg,rgba(233,185,74,.28),rgba(233,185,74,.08));box-shadow:var(--sh-in),0 0 0 1px var(--accent)}
.pl.act{border-color:rgba(233,185,74,.7);box-shadow:0 0 0 1px rgba(233,185,74,.3),0 0 18px rgba(233,185,74,.15),inset 0 1px 0 rgba(255,255,255,.06)}
.pl.act .avw{box-shadow:0 0 0 2px var(--gold),0 0 10px rgba(233,185,74,.5)}

/* ===== V45: окно дуэли — ровная сетка ===== */

.arena .dfc h3{min-height:2.5em;display:flex;align-items:center;justify-content:center;line-height:1.25;text-wrap:balance;overflow-wrap:anywhere;hyphens:auto;margin:8px 0 4px;width:100%}

.arena .vs{justify-self:center}
.rt{display:block;text-align:center;margin-bottom:10px}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 14px;align-items:stretch}
.rbx{display:grid;grid-template-rows:auto auto 1fr;justify-items:center;text-align:center;gap:6px;min-width:0}

/* ===== V46: выбор персонажа и моря — шаги ===== */
.psteps{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:sticky;top:-2px;z-index:6;padding:4px 0 8px;background:linear-gradient(180deg,var(--panel) 75%,rgba(35,41,45,0))}

.seachk{position:absolute;right:10px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:13px}
.pickbar{position:sticky;bottom:-2px;z-index:5;display:flex;flex-direction:column;gap:6px;padding:10px 0 4px;margin-top:4px;background:linear-gradient(180deg,rgba(35,41,45,0),var(--panel) 30%)}
.pickbar .pbh{text-align:center}
.pickbar .btn{width:100%;min-height:50px}

/* ===== V47: счётчик «в игре сейчас» ===== */

/* ===== V48: зал славы ===== */

/* ===== V49: Эйс — огненная стена ===== */

.lbcard{background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 14px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1)}

.lbtools{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}

.lbtools button.net{border-color:rgba(79,179,184,.45);background:linear-gradient(160deg,rgba(79,179,184,.2),rgba(79,179,184,.05))}

    const list=[];for(let n=1;n<=12;n++){const id=sea+n;if(safe.has(id)||deadAt(id)||!ADJ[id])continue;if(['jail','start','base'].includes(G.type[id]))continue;list.push(id)}
    const c0=comps(null),b0=G.tb?big(null):0;let pick=null;
    while(list.length&&!pick){const i=d(list.length)-1;const id=list.splice(i,1)[0];if(comps(id)<=c0&&(!G.tb||big(id)===b0-1))pick=id}
    if(!pick)continue;
    G.dead[pick]=1;
    const h={name:locName(pick),jailed:[],flag:null};
    const ow=G.flags[pick];
    if(ow!=null){const o=G.players[ow];delete G.flags[pick];o.fl++;h.flag=o.name;log('Флаг '+o.name+' на '+locName(pick)+' сгорел в лаве.')}
    for(const q of G.players){
      if(q.loc!==pick)continue;
      const to=bfsNear(pick,l=>G.type[l]==='jail'&&!deadAt(l))||bfsNear(pick,l=>G.type[l]&&!deadAt(l));
      if(to){q.prev=q.loc;q.loc=to;q.sea=seaOf(to)}
      q.jail=3;q.hardJail=false;h.jailed.push(q.name);
      log(q.name+' накрыт градом лавы на '+locName(pick)+' и отправлен в тюрьму на 3 хода.');
    }
    hits.push(h);
  }
  log('Град лавы навсегда уничтожает: '+(hits.length?hits.map(h=>h.name).join(', '):'ничего')+'. Эти острова больше непроходимы.');
  return hits;
}
// Кизару: после появления по одной открытой локации в каждом море снова прячется под фишку
function kizaruBlind(){
  const out=[];
  for(const sea of SEAK){
    const list=[];
    for(let n=1;n<=12;n++){const id=sea+n;
      if(!ADJ[id]||deadAt(id)||!G.type[id]||['start','jail'].includes(G.type[id])||G.ponAt[id]||G.flags[id]!=null||G.players.some(q=>q.loc===id)||(G.akainu&&G.akainu.loc===id))continue;
      list.push(id)}
    if(!list.length)continue;
    const id=list[d(list.length)-1],t=G.type[id];
    delete G.type[id];G.boxes[sea].push(t);shuffle(G.boxes[sea]);
    out.push(locName(id));
  }
  log('Ослепление Кизару: снова скрыты под знаком вопроса '+(out.length?out.join(', '):'никакие локации')+'.');
  return out;
}
// Фуджитора: в каждом море одна локация гравитации, вошедший на неё пропускает следующий ход
function fujiMarks(){
  G.grav=G.grav||{};const out=[];
  for(const sea of SEAK){
    const list=[];
    for(let n=1;n<=12;n++){const id=sea+n;
      if(!ADJ[id]||deadAt(id)||G.grav[id]||['start','jail'].includes(G.type[id])||(G.zun&&G.zun.cell===id)||(G.akainu&&G.akainu.loc===id))continue;
      list.push(id)}
    if(!list.length)continue;
    const id=list[d(list.length)-1];G.grav[id]=1;out.push(locName(id));
  }
  log('Гравитация Фуджиторы давит на: '+(out.length?out.join(', '):'ничего')+'. Игрок, вошедший сюда, пропустит следующий ход.');
  return out;
}

function akainuPhase(cb){
  if(G.winner!=null)return cb();
  const AD=adm();
  if(!G.akainu){
    if(!G.laftel||G.mode==='easy')return cb(); // V142: в упрощённом режиме адмирала нет
    const loc=REDL[d(REDL.length)-1];
    G.akainu={loc,stun:0};
    log('☠ Лафтейл найден: на карту выходит адмирал '+AD.short+' (атака '+AD.a+', уклонение '+AD.u+') и появляется на '+locName(loc)+'!');
    let hits=[],lines=null;
    if(G.adm==='kizaru')lines=kizaruBlind();else if(G.adm==='fujitora')lines=fujiMarks();else hits=lavaRain();
    fxAkainu(locName(loc),hits,lines);
    return cb();
  }
  const A=G.akainu;
  if(A.stun>0){A.stun--;log(AD.short+' оглушён и пропускает движение.');return cb()}
  G.akPhase=true;
  const targets=G.players.filter(q=>q.jail<=0&&!q.imm&&q.loc!=='Z');
  const ok=l=>!deadAt(l)&&!(G.fire&&G.fire.loc===l);
  let best=null;
  for(const q of targets){const pa=akPath(A.loc,q.loc);if(pa&&(!best||pa.length<best.length))best=pa}
  let moved=false;
  if(G.adm==='fujitora'&&A.loc!=='L'&&A.loc!=='Z'){ // в пределах моря: на любую локацию с игроком
    const sea=seaOf(A.loc),c=targets.filter(q=>q.loc!=='L'&&seaOf(q.loc)===sea&&ok(q.loc));
    if(c.length){const q=c[0];A.loc=q.loc;moved=true;log('Фуджитора обрушивается гравитацией и мгновенно оказывается на '+locName(A.loc)+'.')}
  }
  if(!moved&&G.adm==='kizaru'&&A.loc!=='L'&&A.loc!=='Z'&&targets.length){ // телепорт в другое море на ту же локацию
    const dist=l=>{let m=1e9;for(const q of targets){if(q.loc===l){m=0;break}const pa=akPath(l,q.loc);if(pa&&pa.length<m)m=pa.length}return m};
    const walk=best?Math.max(0,best.length-2):1e9;
    let bc=null,bd=1e9;
    for(const sk of SEAK){if(sk===seaOf(A.loc))continue;const c=sk+numOf(A.loc);if(!ADJ[c]||!ok(c))continue;const dd=dist(c);if(dd<bd){bd=dd;bc=c}}
    if(bc&&bd<walk){A.loc=bc;moved=true;log('Кизару со скоростью света переносится на '+locName(bc)+'.')}
  }
  if(!moved){
    if(!best&&G.fire&&targets.length)log('Огненная стена Эйса не пропускает адмирала: он стоит на месте.');
    if(best&&best.length){const st=best.slice(0,2);A.loc=st[st.length-1];log(AD.short+' идёт к ближайшему игроку и выходит на '+locName(A.loc)+'.')}
  }
  const here=G.players.filter(q=>q.loc===A.loc&&q.jail<=0&&!q.imm);
  akainuDuels(here,()=>{G.akPhase=false;cb()});
}

const MODES={easy:{n:'Упрощённый',need:1,d:'Играем только в 2 морях и без адмирала. Достаточно найти 1 роад-понеглиф: Лафтейл появится рядом, и для победы на нём хватит 1 куба понеглифа.'},
  mid:{n:'Средний',need:2,d:'Нужно найти 2 роад-понеглифа и получить согласие их владельцев: Лафтейл появляется между двумя случайными локациями. Для победы нужны 2 куба.'},
  std:{n:'Стандартный',need:4,d:'Все 4 роад-понеглифа, поиск по броскам кубиков в каждом море. Для победы нужны 4 куба.'}};
const modeOf=()=>MODES[(typeof G!=='undefined'&&G&&G.mode)||'std']||MODES.std;
// сколько кубов понеглифа сбрасывают задания Лафтейла: упрощённый — 0, средний — 1 везде, стандартный — как на карте
function cubeCost(k){const m=(G&&G.mode)||'std';return m==='easy'?0:m==='mid'?1:(k==='heritage'?2:1)}
function lafDef(def){
  if(def.cat==='laf-x')return def;
  const m=(G&&G.mode)||'std';if(m==='std')return def;
  let d=def.d;
  if(m==='easy')d=d.replace('сбросьте 2 куба понеглифа и любые','сбросьте любые').replace('сбросьте 1 куб понеглифа и ','').replace(/\. После перемещения сбросьте 1 куб понеглифа/,'');
  else d=d.replace('сбросьте 2 куба понеглифа','сбросьте 1 куб понеглифа');
  return Object.assign({},def,{d,cat:'laf-x'});
}
// ---------- Laftel search ----------
function ownersKey(){return G.players.map(p=>p.pon.length).join(',')+'|'+G.players.map(p=>p.pon.join('+')).join(';')}
function searchStep(cb){
  const S=G.search;
  if(G.laftel){cb();return}
  const total=G.players.reduce((a,p)=>a+p.pon.length,0);
  if(S.phase==='idle'){
    const MD=modeOf();
    if(total<MD.need||S.veto===ownersKey()){cb();return}
    const owners=G.players.filter(p=>p.pon.length);
    const next=i=>{
      if(i>=owners.length){S.phase='rolling';log('Все владельцы понеглифов согласились. Начинается поиск Лафтейла.');doSearchRoll();cb();return}
      ask('consent',{who:owners[i].i,title:'Поиск Лафтейла',text:G.mode&&G.mode!=='std'?(MD.need===1?'Роад-понеглиф найден. Он указывает дорогу к Лафтейлу. Искать остров?':'Найдено '+MD.need+' роад-понеглифа. Они указывают дорогу к Лафтейлу. Искать остров? Любой владелец может отказаться.'):'Все 4 роад-понеглифа найдены. Согласны запустить вычисление координат? Любой владелец может отказаться.',
        opts:[{label:G.mode&&G.mode!=='std'?'Найти Лафтейл':'Согласен',run:()=>next(i+1)},{label:'Отказываюсь (вето)',run:()=>{S.veto=ownersKey();log(owners[i].name+' наложил вето на поиск Лафтейла.');cb()}}]});
    };
    next(0);
  }else if(S.phase==='rolling'){doSearchRoll();cb()}
  else cb();
}
function doSearchEasy(){
  const S=G.search,k=modeOf().need;
  const seas=shuffle((G.seas||SEAK).slice()).slice(0,k),ids=[];
  for(const sea of seas){let id,g=0;do{id=sea+d(12)}while(G.zun&&id===G.zun.cell&&g++<20);ids.push(id)}
  if(G.tut){const h=G.players.find(q=>!q.bot);if(h&&MAPD.nodes[h.loc])ids.splice(0,ids.length,h.loc)}
  fxRoll('Поиск Лафтейла',ids.map(x=>numOf(x)),12);
  S.rolls=ids;
  const pts=ids.map(x=>MAPD.nodes[x]);
  let x=pts.reduce((a,p)=>a+p[0],0)/pts.length;
  if(Math.abs(x-MT[0])<120)x=MT[0]+(x<MT[0]?-120:120);
  x=Math.max(70,Math.min(1518,x));
  G.laftel={x:Math.round(x),y:Math.round(MT[1]-20),anch:ids.slice()};
  for(const a of ids)link('L',a);
  log('Роад-понеглифы указали дорогу: Лафтейл появился возле '+ids.map(locName).join(' и ')+'!');
  S.phase='done';
}
function doSearchRoll(){
  if(G.mode&&G.mode!=='std'){if(!G.laftel)doSearchEasy();return}
  const S=G.search,order=['E','W','N','S'];
  if(S.rolls.length>=4)return;
  const sea=order[S.rolls.length];
  let sum=0;const fv=[];for(let i=0;i<4;i++){const q=Math.ceil(d(6)/2);fv.push(q);sum+=q}fxRoll('Поиск Лафтейла · '+SEAS[sea],fv,6);
  const id=sea+sum;S.rolls.push(id);
  log('Роад-понеглифы указывают на '+locName(id)+'.');
  if(S.rolls.length===4){
    const pt=s=>MAPD.nodes[s];
    const [E,W,N,Sx]=S.rolls.map(pt);
    function inter(a,b,c,dd){
      const x1=a[0],y1=a[1],x2=b[0],y2=b[1],x3=c[0],y3=c[1],x4=dd[0],y4=dd[1];
      const den=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
      if(Math.abs(den)<1e-6)return[(x1+x2+x3+x4)/4,(y1+y2+y3+y4)/4];
      const px=((x1*y2-y1*x2)*(x3-x4)-(x1-x2)*(x3*y4-y3*x4))/den,py=((x1*y2-y1*x2)*(y3-y4)-(y1-y2)*(x3*y4-y3*x4))/den;
      return[Math.max(60,Math.min(1528,px)),Math.max(60,Math.min(1063,py))];
    }
    const [x,y]=inter(E,W,N,Sx);
    G.laftel={x:Math.round(x),y:Math.round(y),anch:S.rolls.slice()};
    for(const a of S.rolls)link('L',a);
    log('Нитки пересеклись: появился остров Лафтейл!');
    S.phase='done';
  }
}

function checkLaftelArrival(p){

function giveTask(p,cat,def,loc){
  if(cat==='laf')def=lafDef(def);
  const t={cat,def,loc:loc||null,base:Object.assign({},p.cnt),seas:new Set([p.sea]),startSea:p.sea,target:null,done:false,takeAp:G.ap,turnNo:G.turnNo};
  if(def.k==='world'){do{t.target=d(12)}while(t.target===1);log(p.name+': выпало '+t.target+' — нужны 2 флага на локациях №'+t.target+' в двух морях и доход с них.')}
  if(cat==='laf'&&G.mode==='easy'&&(def.k==='duelP'||def.k==='lvl5'))t.paid=true;
  return t;
}
function taskDone(p,t){
  const f=t.def,c=p.cnt,b=t.base;
  switch(f.k){
    case'winAny':case'winP':case'winB':case'winD':case'moves':return c[f.k]-b[f.k]>=f.n;
    case'flags':return flagCount(p)>=f.n;
    case'hold_atk':return p.atk.length>=f.n;
    case'hold_tre':return p.tre.length>=f.n;
    case'othersea':return p.loc!=='Z'&&p.loc!=='L'&&seaOf(p.loc)!==t.startSea;
    case'visitLoc':return p.loc===f.loc;
    case'visitNum':return p.loc!=='Z'&&p.loc!=='L'&&numOf(p.loc)===t.target;
    case'visitLow':return p.loc!=='Z'&&p.loc!=='L'&&numOf(p.loc)<=3&&seaOf(p.loc)!==t.startSea;
    case'seas':return t.seas.size>=f.n;
  }
  return !!t.done;
}
function checkTasks(){
  for(const p of G.players){
    if(G.pending)return;
    if(G.tb&&p.mile===1){p.mile=2;log(pname(p)+' выполнил 5 ивентовых заданий: 2 очка к атаке и уклонению на выбор!');mileStep(p,2);return}
    if(G.laftel&&p.loc==='L'){checkLaftelArrival(p);if(G.winner!=null)return}
    if(p.task&&taskDone(p,p.task))completeTask(p,'task');
    if(G.winner!=null)return;
    if(p.ltask&&taskDone(p,p.ltask))completeTask(p,'ltask');
    if(G.winner!=null)return;
  }
}
function giveCards(p,kind,n){
  for(let i=0;i<n;i++)drawFor(p,kind,c=>{if(!c)return;if(p[kind].length<10){p[kind].push(c);fxCard(p,c);logP(p.i,p.name+' получает '+(kind==='atk'?'карту атаки '+c.v:'пассивку «'+PAS[c.key].n+'»')+'.',p.name+' получает '+(kind==='atk'?'карту атаки':'пассивную способность')+'.')}else{G.discard.push(c);log(p.name+': рука полна, карта ушла в сброс.')}});
}

function taskEvent(p,kind,info){
  const t=p.task;if(!t)return;

    if(f.lv&&!f.lv.includes(info.lv))return;

// ---------- duels ----------
function prepKey(side){return side.p?side.p.i:-1}
function validPrep(p,pr){
  if(!pr)return false;
  const ids=new Set();
  const per=p.ch==='zoro'?2:1;
  if(pr.slots.length>3)return false;
  for(const sl of pr.slots){if(sl.length>per)return false;for(const id of sl){if(ids.has(id))return false;ids.add(id);if(!p.atk.find(c=>c.cid===id))return false}}
  const pids=new Set();let reg=0,tp=0;
  for(const id of pr.pas){if(pids.has(id))return false;pids.add(id);const c=p.pas.find(c=>c.cid===id)||p.tre.find(c=>c.cid===id&&TRE[c.key].pas&&activeC(c));if(!c)return false;if(c.kind==='pas')reg++;else tp++}
  return reg<=2&&tp<=1;
}
function randomPrep(p){
  const hand=shuffle(p.atk.slice());
  const per=p.ch==='zoro'?2:1;
  const slots=[];
  for(let i=0;i<3;i++){const sl=[];for(let j=0;j<per;j++){if(hand.length&&rnd()<.9)sl.push(hand.pop().cid)}slots.push(sl)}
  const pas=shuffle(p.pas.slice()).slice(0,Math.floor(rnd()*3)).map(c=>c.cid);
  const tp=p.tre.filter(c=>TRE[c.key].pas&&activeC(c));
  if(tp.length&&rnd()<.5)pas.push(tp[0].cid);
  return{slots,pas};
}
function sideFromPrep(p,pr){
  const slots=pr.slots.map(sl=>sl.map(id=>p.atk.find(c=>c.cid===id)));
  const pas=pr.pas.map(id=>p.pas.find(c=>c.cid===id)||p.tre.find(c=>c.cid===id));
  const s=stats(p);
  return{p,A:s.A,U:s.U,slots,pas,ch:p.ch,name:p.name};
}
function runDuel(S1,S2,full){
  const S=[S1,S2];
  const st=S.map((s,i)=>{
    const opp=S[1-i];
    let keys=s.pas.map(c=>c.key);
    if(opp.ch==='hancock'&&s.p)keys=[];
    const has=k=>keys.includes(k);
    let tA=0,tU=0;for(const c of s.pas)if(TRE[c.key]&&TRE[c.key].pas&&keys.includes(c.key)){tA+=TRE[c.key].pas.a;tU+=TRE[c.key].pas.u}
    return{s,keys,has,tA,tU,carry:0,annul:false,marco:false,rumble:false,wins:0,placed:keys.slice()};
  });
  for(const x of st){if(x.has('rumble')&&x.s.p&&x.s.p.berries>=5){x.rumble=true}}
  const rounds=[],used=[[],[]];
  for(let r=0;r<3&&st[0].wins<2&&(full||st[1].wins<2);r++){
    const cur=st.map((x,i)=>{
      const opp=st[1-i];
      let cards=(x.s.slots[r]||[]).slice();
      let ann=false;
      if(cards.length&&opp.has('barto')&&!x.annul){x.annul=true;cards.shift();ann=true}
      used[i].push(...(x.s.slots[r]||[]));
      let val=0;
      for(const c of cards){val+=c.v;if(x.s.ch==='luffy')val+=3;if(x.has('mihawk')&&c.v>=7)val+=4}
      const nodice=x.s.ch==='sanji'&&GIRLS.includes(opp.s.ch);
      const roll=nodice?0:(x.keys.includes('jinwoo')?d(20):d(12));
      let pa=0;if(x.has('will'))pa+=2;if(x.rumble)pa+=3;
      const att=x.s.A+val+roll+pa+x.tA+x.carry;
      let ev=x.s.U+x.tU+(x.has('chopper')?2:0);
      if(x.keys.includes('fist')&&!opp.has('will'))ev+=10;
      return{val,roll,att,ev,ann,cs:(x.s.slots[r]||[]).map(c=>c.v),carry:x.carry,pa,nodice};
    });
    st.forEach(x=>x.carry=0);
    let sc=[cur[0].att-cur[1].ev,cur[1].att-cur[0].ev];
    for(let i=0;i<2;i++)if(st[1-i].s.ch==='roger'&&st[i].s.p&&sc[i]>0)sc[i]=Math.floor(sc[i]/2); // V137: хаки усиления Роджера
    for(let i=0;i<2;i++)if(cur[i].nodice){cur[i].cap=sc[i]>1;sc[i]=Math.min(sc[i],1)}
    const abs=[0,0];
    for(let i=0;i<2;i++){if(st[i].has('impact')){abs[i]=3;sc[1-i]-=3;}}
    for(let i=0;i<2;i++)if(abs[i])st[i].carry=abs[i];
    const nat=[false,false];
    for(let i=0;i<2;i++){if(st[i].keys.includes('natsu')&&!st[i].natsuUsed&&sc[i]<=sc[1-i]){st[i].natsuUsed=true;sc[i]+=20;nat[i]=true}}
    let out;
    if(sc[0]>sc[1])out=0;else if(sc[1]>sc[0])out=1;else{
      const m0=st[0].has('meito'),m1=st[1].has('meito');
      out=m0&&!m1?0:m1&&!m0?1:-1;
    }
    let marco=false;
    if(out>=0){const l=1-out;if(st[l].keys.includes('marco')&&!st[l].marco){st[l].marco=true;out=-1;marco=true}}
    if(out>=0)st[out].wins++;
    rounds.push({cur,sc,out,marco,abs,nat});
  }
  let winner=-1;if(st[0].wins>=2)winner=0;else if(st[1].wins>=2)winner=1;
  // V127: в новых партиях (tb≥2) после всех раундов побеждает тот, у кого больше побед; хранитель (full) — по-старому
  if(winner===-1&&!full&&G&&G.tb>=2){if(st[0].wins>st[1].wins)winner=0;else if(st[1].wins>st[0].wins)winner=1}
  return{rounds,winner,st,used,w:[st[0].wins,st[1].wins],draws:rounds.filter(x=>x.out===-1).length};
}
function applyDuelCards(res){
  // списать открытые карты атаки, Рамбл Болл, потерю карт-сокровищ при проигрыше
  [0,1].forEach(i=>{
    const x=res.st[i],p=x.s.p;if(!p)return;
    for(const c of res.used[i])discardCard(p,c);
    if(x.rumble){p.berries-=5}
    for(const c of x.s.pas.slice()){
      if(c.kind==='pas'){discardCard(p,c);continue}
      if(TRE[c.key].once){discardCard(p,c);continue}
    }
  });
}

function afterPvp(p,q,res){

  W.cnt.winP++;W.cnt.winAny++;
  taskEvent(W,'pvpWin',{});
  if(W.ltask&&W.ltask.def.k==='duelP'&&W.ltask.paid&&W.loc==='L')W.ltask.done=true;
  W.berries+=20;

  const finish=()=>{
    retreat(L,()=>{if(L===p&&p.i===G.cur)G.endAfter=true});
  };
  if(buggy){log('Клоун Багги: '+W.name+' получает только 20 Берри.');finish();return}
  const hasP=L.pon.length>0,hasT=L.tre.length>0;
  const takeRandom=()=>{
    const pool=[...L.atk.map(c=>['atk',c]),...L.pas.map(c=>['pas',c])];
    if(!pool.length){finish();return}
    const [k,c]=pool[d(pool.length)-1];
    L[k].splice(L[k].indexOf(c),1);
    if(W[k].length<10){W[k].push(c);fxCard(W,c);log(W.name+' вслепую забирает карту у '+L.name+'.')}else G.discard.push(c);
    finish();
  };
  const takeTre=()=>{
    const c=L.tre[d(L.tre.length)-1];L.tre.splice(L.tre.indexOf(c),1);
    if(W.tre.length<3){W.tre.push(c);fxCard(W,c);log(W.name+' забирает карту сокровищ у '+L.name+'.')}else{G.discard.push(c);log(W.name+' забирает карту сокровищ, но слотов нет: она в сбросе.')}
    finish();
  };
  const takePon=()=>{
    const x=L.pon.pop();W.pon.push(x);rogerGold(W);
    G.ponAt[x]=undefined;delete G.ponAt[x];
    log(W.name+' забирает роад-понеглиф у '+L.name+'.');finish();
  };
  if(hasP||hasT){
    const o=[];
    if(hasP)o.push({label:'Забрать роад-понеглиф',run:takePon});
    if(hasT)o.push({label:'Забрать случайную карту сокровищ',run:takeTre});
    ask('loot',{who:W.i,title:'Трофей победителя',text:'Выберите, что забрать у '+L.name+'.',opts:o});
  }else takeRandom();
}
// retreat: choose neighbour for player p
function retreat(p,cb){
  let cands=nbrsOf(p).filter(x=>x!=='L'||true);
  const bad=x=>x!=='Z'&&x!=='L'&&(G.type[x]==='dozor'||G.type[x]==='battle');
  let good=cands.filter(x=>!bad(x)&&x!=='L');
  if(!good.length){
    // ближайшая нейтральная
    const seen=new Set([p.loc]);let fr=[p.loc];
    for(let k=0;k<6&&!good.length;k++){
      const nx=[];
      for(const a of fr)for(const b of (ADJ[a]||[])){if(seen.has(b))continue;seen.add(b);nx.push(b);if(!bad(b)&&b!=='L'&&b!==(G.zun&&G.zun.cell))good.push(b)}
      fr=nx;
    }
  }
  if(!good.length){cb&&cb();return}
  const o=good.map(x=>({label:locName(x)+(G.type[x]?' ('+TYPES[G.type[x]].n+')':x==='Z'?'':' (неизвестно)'),loc:x,run:()=>{

  }}));
  ask('retreat',{who:p.i,title:'Отступление: '+p.name,text:'Выберите соседнюю локацию.',opts:o,pick:good});
}

function bfsNear(from,ok){

}

function dsMode(){let m=null;try{m=localStorage.getItem('gl_dscene')}catch(e){}if(m==='on'||m==='fast'||m==='off')return m;return 'on'}

    const R=res.rounds[r],c=R.cur;
    const part=(x,k)=>{
      const o=x.att-res.st[k].s.A-x.val-x.roll;
      return '<div class="small">атака '+res.st[k].s.A+' + карта '+x.val+(x.ann?' (аннулирована)':'')+(x.nodice?' + без кубика':' + кубик <b>'+x.roll+'</b>')+(o?' + эффекты '+(o>0?'+':'')+o:'')+' = <b>'+x.att+'</b>; уклонение соперника −'+c[1-k].ev+' → <span class="num">'+R.sc[k]+'</span>'+(x.nodice?' <span class="small">(Санджи не бьёт девушек: урон не больше 1)</span>':'')+'</div>';
    };
    const out=R.out===-1?'Ничья'+(R.marco?' (Феникс Марко)':''):'<span class="win">Раунд за '+esc(pe.names[R.out])+'</span>';
    return '<div class="card"><b class="rt">Раунд '+(r+1)+'</b><div class="rgrid"><div style="min-width:0">'+part(c[0],0)+'</div><div style="min-width:0">'+part(c[1],1)+'</div></div><div style="text-align:center">'+(R.nat&&(R.nat[0]||R.nat[1])?'Нацу даёт +20. ':'')+out+'</div></div>';
  };
  if(dsw)return dsCompactHtml(pe,Z,side,line,wins);
  for(let r=0;r<Z.shown;r++)h+=line(r);
  if(Z.shown>0&&Z.shown<n){const Rl=res.rounds[Z.shown-1];h+='<div class="rbn'+(Rl.out===-1?' draw':'')+'">'+(Rl.out===-1?'Ничья':'Раунд за '+esc(pe.names[Rl.out]))+'</div>'}
  if(Z.shown<n){
    const R=res.rounds[Z.shown],c=R.cur;
    c.forEach((x,k)=>{if(x.nodice)Z.done[k]=true});
    const box=k=>{
      const x=c[k],hi=res.st[k].keys.includes('jinwoo')?20:12;
      const cardTxt='Карта: '+(x.cs.length?x.cs.join(' + '):'нет')+(x.ann?' (аннулирована)':'');
      let mid;
      if(x.nodice)mid='<span class="small">🚬 не бросает кубик, урон ≤ 1</span>';
      else if(Z.done[k])mid='<span class="pd drop s'+hi+'"><b>'+x.roll+'</b></span>';
      else if(Z.spin[k])mid='<span class="pd s'+hi+'" id="d'+k+'"><b>?</b></span>';
      else mid='<button class="btn primary" data-dz="die" data-k="'+k+'">Бросить d'+hi+(res.st[k].s.p?'':' за босса')+'</button>';
      return '<div class="rbx"><b class="rn">'+esc(pe.names[k])+'</b><span class="small rc">'+cardTxt+'</span><div class="rm">'+mid+'</div></div>';
    };
    h+='<div class="card rcur"><b class="rt">Раунд '+(Z.shown+1)+'</b><div class="rgrid">'+box(0)+box(1)+'</div></div>';
    h+='<div class="row" style="justify-content:center"><button class="btn" data-dz="skip">'+(dsw?(Z.fast?'⏩ Ускорено':'⏩ Ускорить бой'):'Показать всё сразу')+'</button>'+(window.DuelScene?'<button class="btn" data-dz="mode" title="Анимация боя: показывать, ускоренно или выключить">🎬 Сцена: '+DS_MODE_N[dsMode()]+'</button>':'')+'</div>';
  }
  if(Z.shown>=n)h+='<div class="fin'+(res.winner===-1?'':' win')+'">'+(res.winner===-1?'Боевая ничья':'Победа: '+esc(pe.names[res.winner]))+' ('+res.w[0]+' : '+res.w[1]+')</div><button class="btn primary" data-a="0">Продолжить</button>';
  return h+'</div></div>';
}

const RULES_HTML="<h1>Правила игры — единая версия</h1><p> · </p><h2>1. Подготовка к игре</h2><p><b>Карта и фишки</b></p><ul><li>Соедините две части поля по линии Red Line.</li><li>Достаньте 4 коробки с фишками локаций, по одной на каждое море. Фишка выкладывается на локацию, когда игрок впервые туда приходит (см. «Исследование локаций» в разделе 4). В каждом море 11 локаций с номерами 2–12 и стартовая №1; стартовые остаются без фишек.</li><li><b>Случайная карта.</b> Карта каждой партии строится заново: у локаций (кроме красных проходов) случайные номера, положение и дороги, поэтому стартовая локация №1 и локация понеглифа в каждом море оказываются в разных местах. Красные проходы между морями (Норт Блю №10, Вест Блю №2, Ист Блю №4, Саус Блю №2) всегда стоят на одном и том же месте. В игре карту показывают до выбора персонажа, а места понеглифов скрыты.</li></ul><p><b>Роад-понеглифы</b></p><ul><li>В игре 4 роад-понеглифа. Для первых трёх бросьте 2d6 по одному разу, по порядку для Вест Блю, Норт Блю и Саус Блю. Положите фишку роад-понеглифа на локацию выпавшего номера в этом море рубашкой вверх и накройте её фишкой локации (на острове понеглифа всегда лежит обычная база). Игроки не должны знать, где лежат понеглифы: их предстоит найти.</li><li>Четвёртый находится на блуждающем острове Зоя (см. «Зунеша» в разделе 4).</li><li>Каждый понеглиф охраняет хранитель. Случайно, не глядя, раздайте четырёх хранителей (Большая Мамочка, Кайдо, Рыжеволосый Шанкс, Эдвард Ньюгейт Белоус) по четырём понеглифам, включая понеглиф на острове Зоя. Показатели у всех одинаковые: атака 9, уклонение 6. Хранителя кладут рубашкой вверх вместе с фишкой понеглифа.</li></ul><p><b>Колоды и компоненты</b></p><ul><li>Разложите 10 колод (см. раздел 2). Из колоды гостевых персонажей возьмите одну случайную карту, не глядя, и положите рубашкой вверх. Посмотреть её можно только после покупки.</li><li>Разложите карточки и фигурки 8 персонажей.</li><li>Подготовьте кубики: 2d6 для хода по карте, 1d12 для дуэлей и для выбора клетки Зунеши, 1d20 для дуэлей (только если его открывает карта гостевого персонажа).</li><li>Поставьте рядом банк с Берри.</li></ul><p><b>Очерёдность, персонаж и море</b></p><ul><li>Каждый игрок бросает 2d6. Чем больше сумма, тем раньше ходит игрок. При равенстве равные игроки перебрасывают.</li><li>В порядке очерёдности игроки выбирают персонажа и берут его фигурку. Играть им придётся до конца партии, поэтому изучите способности, в том числе ультимативную.</li><li>Карта партии видна всем ещё до выбора персонажа. В том же порядке игроки выбирают море, с которого начинают путешествие, поэтому где лежат понеглифы, никто не знает, поэтому море выбирают по расположению старта и дорог. Два игрока не могут начать из одного моря. Старт в каждом море это локация №1.</li></ul><p><b>Стартовые ресурсы</b> (каждому игроку)</p><ul><li>20 Берри;</li><li>3 карты атаки, одинаковый набор для всех: со значениями 3, 5 и 7;</li><li>2 карты пассивных способностей.</li></ul><h2>2. Игровой инвентарь</h2><p><b>Колоды</b> (всего 10)</p><ul><li><b>Атака</b>: карты со значением от 1 до 8, которое прибавляется к силе атаки в дуэли. Также используются при некоторых картах погоды.</li><li><b>Пассивные способности</b>: особые способности (например, Воля вооружения, Воля наблюдения) и вспомогательные персонажи. Дают дополнительную атаку или снижают урон от соперника в дуэли.</li><li><b>Погода</b>: сюжетная колода, события которой меняют расположение игроков и компонентов на карте.</li><li><b>Задания</b>: задания, которые берут на ивентовых локациях.</li><li><b>Сокровища</b>: особые способности для дуэли и хода по карте, часть из них работает против владельца. Покупаются на «Чёрном рынке» за 50 Берри, карта берётся вслепую с верха колоды.</li><li><b>Боссы</b>: на поле битвы игрок берёт верхнюю карту и сражается с этим персонажем.</li><li><b>Дозорные</b>: то же на Базе Дозора, а в Тюрьме только если игрок не откупается.</li><li><b>Гостевые персонажи</b>: в игру выкладывается одна случайная карта. Её можно купить на «Чёрном рынке» за 50 Берри. Гость может сильно изменить расклад сил, а может оказаться пустышкой.</li><li><b>Понеглифы</b>: задания, которые нужно выполнить, чтобы получить роад-понеглиф.</li><li><b>Лафтейл</b>: финальные задания. Чтобы победить, игрок, попавший на остров Лафтейл, должен выполнить одно из них.</li></ul><p><b>Роад-понеглифы.</b> В игре 4 понеглифа, это особые кубики со значениями 1–3 (каждое по два раза). С их помощью определяют координаты Лафтейла (см. раздел 6).</p><p><b>Фишки.</b> Цвет фишки определяет тип локации (см. «Типы локаций» в разделе 4). Всего:</p><ul><li>44 фишки локаций (4 моря × 11);</li><li>3 фишки роад-понеглифов (лежат под фишками локаций, четвёртый находится на острове Зоя);</li><li>4 карточки хранителей понеглифов (Большая Мамочка, Кайдо, Шанкс, Белоус), у каждого атака 9 и уклонение 6;</li><li>1 фишка Лафтейла, её выставляют, когда определены координаты.</li></ul><p><b>Флаги.</b> У каждого игрока 4 флага. Правила установки, сжигания и дохода описаны в разделе 4.</p><h2>3. Структура хода</h2><p><b>1. Доход (начало хода)</b></p><p>Игрок, чей ход, бросает 2d6, а доход получают все игроки. За каждую свою локацию с выпавшим номером (там стоит флаг игрока или он сам) выплачивается сумма по таблице «Доход» в разделе 4 (чем реже выпадает номер, тем больше платят), а если на ней есть и флаг, и игрок, то вдвое больше. Подробнее — «Доход» в разделе 4. Тюрьма, База Дозора и поле битвы доход не приносят.</p><p><b>2. Действия</b></p><p>У игрока 3 очка действия (ОД), они восстанавливаются в начале каждого хода. Тратить их можно в любом порядке до исчерпания:</p><table class=\"rt\"><tr><th>Действие</th><th>ОД</th></tr><tr><td>Перемещение на соседнюю локацию (фишка локации вскрывается сразу)</td><td>1</td></tr><tr><td>Вызов на дуэль игрока, который стоит на той же локации</td><td>1</td></tr><tr><td>Установка флага на текущей локации*</td><td>2</td></tr><tr><td>Сжигание вражеского флага с установкой своего*</td><td>2</td></tr><tr><td>Карта понеглифа</td><td>2</td></tr><tr><td>Карта Лафтейла</td><td>2</td></tr><tr><td>Применение карты сокровищ</td><td>указано на карте</td></tr></table><p>*Нельзя, если у вас уже есть флаг на локации с таким же номером в другом море, а также на Тюрьме, Базе Дозора, поле битвы и Зунеше.</p><p><b>Без ОД:</b> покупка карты атаки или пассивной способности (10 Берри, не более одной карты за ход), покупка карт на «Чёрном рынке» (только за Берри), взятие задания на ивентовой локации, сброс задания (штраф 10 Берри, для заданий понеглифа и Лафтейла 100 Берри), откуп из Тюрьмы, отступление после поражения, бой с боссом при входе на поле битвы, поднятие своего флага с локации. У некоторых персонажей есть одно бесплатное действие (см. карточки персонажей).</p><p>За ход можно вступить не более чем в 3 дуэли. Дуэли с игроками, боссами и дозорными считаются вместе (см. раздел 5).</p><p><b>Покупка карт атаки и пассивных способностей.</b> Карта атаки или пассивной способности покупается за 10 Берри без очков действия в любой момент своего хода. За ход можно купить только одну такую карту (атаку или пассивную вместе). Карта берётся с верха соответствующей колоды, лимит на руках прежний: не более 10 карт каждого типа.</p><p><b>3. Конец хода</b></p><p>Ход заканчивается сразу, если:</p><ol><li>Потрачены все 3 ОД (карту сокровищ без ОД можно сыграть и после этого).</li><li>Игрок проиграл дуэль, в которую сам бросил вызов: оставшиеся ОД сгорают, игрок отступает (см. раздел 5).</li><li>Игрок проиграл бой боссу: ОД сгорают, игрок отступает и его грабят (см. раздел 5).</li><li>Игрок проиграл бой Морскому Дозору на Базе Дозора: он отправляется в Тюрьму и пропускает 2 следующих хода.</li></ol><p>После победы игрок продолжает тратить ОД до конца. После ничьей в дуэли ход тоже продолжается (бросивший вызов уходит на соседнюю локацию без затрат ОД) и заканчивается, только когда кончились ОД.</p><p><b>Конец раунда</b></p><p>Когда все игроки сходили:</p><ol><li>Открывается верхняя карта погоды, её эффект действует на всех игроков на карте. Исключение составляют персонажи, у которых на карточке есть способность, отменяющая погоду.</li><li>Если идёт поиск Лафтейла, бросаются роад-понеглифы (см. раздел 6).</li></ol><h2>4. Механики</h2><h3>Исследование локаций</h3><ul><li>В начале игры все фишки локаций лежат в коробках по морям. Когда игрок впервые переходит на локацию в этом море, он достаёт фишку из коробки, не глядя, и выкладывает её открытой стороной. Так при каждой раскладке локации получают разные значения.</li><li>Игроки видят только расположение путей, тип локации известен только после вскрытия фишки.</li><li><b>Активация.</b> Сразу после вскрытия игрок обязан применить правила локации, если это Тюрьма, Поле битвы или База Дозора.</li><li><b>Постоянство.</b> Открытая локация остаётся открытой для всех до конца игры.</li></ul><h3>Проходы между морями</h3><ul><li><b>Красные кружки.</b> В каждом море есть один проход, он отмечен красным кружком: Норт Блю — №10, Вест Блю — №2, Ист Блю — №4, Саус Блю — №2. Через проходы моря соединены друг с другом (Reverse Mountain в центре карты). Красные проходы всегда на своих местах, остальные локации в каждой партии расположены по-разному.</li><li><b>Переход.</b> Перейти с красной локации одного моря на красную локацию другого моря стоит 1 ОД, как обычный шаг.</li><li><b>Обычная локация.</b> Во всём остальном красная локация такая же, как другие: у неё есть номер, при первом заходе на неё вскрывается фишка, на ней можно ставить флаг и получать доход. При отступлении красные локации считаются соседними так же, как обычные.</li><li><b>Особые фишки на проходе.</b> Если на красной локации вскрылась Тюрьма, База Дозора или поле битвы, там действуют правила этого типа. Поэтому переход в другое море через такой проход может потребовать боя.</li></ul><h3>Типы локаций</h3><table class=\"rt\"><tr><th>Тип</th><th>Фишка</th><th>В каждом море</th></tr><tr><td>Ивентовая</td><td>оранжевая</td><td>3</td></tr><tr><td>Базовая</td><td>белая</td><td>4</td></tr><tr><td>База Дозора</td><td>синяя</td><td>1</td></tr><tr><td>Поле битвы</td><td>красная</td><td>1</td></tr><tr><td>Тюрьма</td><td>серая</td><td>1</td></tr><tr><td>Чёрный рынок</td><td>чёрная</td><td>1</td></tr></table><ul><li><b>Ивентовая.</b> Всегда активна, не истощается, возвращаться на неё можно сколько угодно. Игрок может (по желанию) взять карту из колоды заданий, если у него нет другого невыполненного задания. Взятое задание обязательно выполнить или сбросить за штраф. <b>Веха заданий.</b> После 5 выполненных ивентовых заданий (сброшенные и отменённые не считаются, задания понеглифа и Лафтейла тоже) игрок один раз за игру получает 2 очка и распределяет их между атакой и уклонением как хочет (1+1, 2+0 или 0+2). Потолок: атака не выше 8, уклонение не выше 7 с учётом базовых значений персонажа и бонусов заданий; карты, пассивки и сокровища считаются сверху. Очко, для которого нет места, превращается в 15 Берри. Часть боевых заданий (Крупная дичь, Заказ Мирового Правительства, Испытание Воли, Сильнейший Йонко) даёт на выбор 1 карту сокровищ из общей колоды, если на руках есть место. <b>Перевооружение.</b> Задание «Перевооружение» (3 карты в колоде заданий) выполняется победой над Боссом 2-го, 3-го или 4-го уровня. Награда — особая карта сокровищ «Перевооружение» (не из общей колоды): пока она у вас на руке, за ход можно купить две карты вместо одной — две атаки, атаку и пассивку или две пассивки. Если слотов сокровищ нет, придётся сбросить одну карту.</li><li><b>База Дозора.</b> Игрок обязан сразиться с дозорным: берёт верхнюю карту колоды дозорных и вступает в дуэль (раздел 5).</li><li><b>Поле битвы.</b> Бой с боссом начинается автоматически, до любых других действий игрока, и не требует ОД.</li><li><b>Тюрьма.</b> Попав сюда, игрок может откупиться за 15 Берри и действовать как обычно или вступить в бой с дозорным. Победа даёт награду с карты и право бесплатно переместиться на соседнюю локацию. Если игрок не откупился и не победил, он пропускает 2 следующих хода, после чего бесплатно перемещается на любую соседнюю локацию.</li><li><b>Чёрный рынок.</b> По одному в каждом море. Покупка доступна только при нахождении на этой локации, без ОД и только за Берри: карта сокровищ стоит 50, берётся вслепую с верха колоды. Гостевой персонаж стоит 80. Лимита покупок за визит нет, но на руках может быть не более 3 карт сокровищ.</li><li><b>Лафтейл</b> (раздел 6) и <b>блуждающие локации</b> (Зунеша, ниже) фишек моря не имеют; блуждающие появляются только по картам погоды.</li></ul><h3>Флаги</h3><ul><li>У игрока 4 флага. Флаг ставится на локацию, где находится игрок (2 ОД).</li><li>Нельзя иметь два своих флага на локациях с одинаковым номером в разных морях. Флаги нельзя ставить на Тюрьму, Базу Дозора, поле битвы и Зунешу.</li><li><b>Перенос.</b> Чтобы перенести флаг, игрок лично возвращается на его локацию, забирает бесплатно и ставит заново на нужной локации за 2 ОД.</li><li><b>Сжигание.</b> На локации с чужим флагом игрок может за 2 ОД заменить его своим. Чужой флаг возвращается владельцу в запас. Правило об одинаковых номерах действует и здесь.</li></ul><h3>Доход</h3><ul><li><b>Бросок 2d6.</b> В начале хода бросает тот, чей ход, а доход получают все. Сумма определяет «активную локацию». Игрок, чей флаг или чья фишка стоит на локации с этим номером в любом из морей, получает выплату по таблице ниже за каждую такую локацию. Чем реже выпадает номер, тем больше платят.</li><li><b>Двойная плата.</b> Если на этой локации стоят и ваш флаг, и ваша фишка, вы получаете удвоенную выплату. Чужие флаги на вашу плату не влияют.</li><li><b>Исключения.</b> Тюрьма, База Дозора и поле битвы доход не приносят.</li><li><b>Другие источники.</b> Задания (сумма указана на карте), победа над игроком (20 Берри и трофей), победа над боссом или дозорным (награда по карте). Суммы — в приложении.</li></ul><table class=\"rt\"><tr><th>Выпавший номер (2d6)</th><th>2 и 12</th><th>3 и 11</th><th>4 и 10</th><th>5 и 9</th><th>6 и 8</th><th>7</th></tr><tr><td>Выплата за флаг или фишку</td><td>25</td><td>15</td><td>10</td><td>8</td><td>6</td><td>5</td></tr><tr><td>Флаг и фишка вместе</td><td>50</td><td>30</td><td>20</td><td>16</td><td>12</td><td>10</td></tr></table><p>Стартовые локации (номер 1) дохода не приносят, потому что 2d6 даёт минимум 2.</p><h3>Карты</h3><ul><li><b>Атака и пассивные способности:</b> не более 10 карт каждого типа на игрока. Применяются в дуэли или при определённых картах погоды.</li><li><b>Задания:</b> не более 1 активной карты (с ивентовой локации, понеглифа или Лафтейла). Пока она не выполнена, брать любые другие задания нельзя. Игрок активирует задание в свой ход, озвучивая его всем, без ОД, если иное не написано на карте. <b>Сброс:</b> задание можно сбросить в любой свой ход без ОД, заплатив в банк 10 Берри. Задание роад-понеглифа и задание Лафтейла просто так не сбросить: для этого нужно единовременно заплатить в банк 100 Берри. Задание Лафтейла можно сбросить только находясь на самом Лафтейле. Только после этого можно взять новое.</li><li><b>Сокровища:</b> не более 3 карт на руках. Если после покупки или награды их стало 4 и более, лишние немедленно уходят в сброс без возврата денег.</li><li><b>Открытый сброс.</b> Любую карту сокровищ при сбросе (переполнение, желание игрока, эффект другой карты) нужно показать всем. Тайный сброс запрещён.</li><li><b>Ловушки.</b> Если сброшенная карта имеет подтип «Ловушка», игрок обязан немедленно выполнить её штрафное условие (заплатить Берри, сбросить карты атаки и т. д.). С ловушкой можно сбросить другую негативную карту сокровищ.</li></ul><h3>Обмен</h3><p>Игроки могут обмениваться любыми предметами с рук, в том числе роад-понеглифами. Берри передавать просто так нельзя: деньги можно получить только в обмен на предмет (например, продать карту сокровищ). Цену игроки обсуждают сами.</p><h3>Задания и чтение роад-понеглифов</h3><ul><li><b>Поиск.</b> Острова с роад-понеглифами скрыты: понеглиф лежит под фишкой локации. Когда игрок открывает фишку на этом острове, понеглиф обнаруживается и с этого момента виден всем. Четвёртый понеглиф на острове Зоя виден, как только Зоя появилась. Чтобы найти все понеглифы, придётся открывать локации на всех картах.</li><li><b>Хранитель понеглифа: условия не такие строгие.</b> Хранители сильные (атака 9, уклонение 6), но побеждать их не обязательно.<ul><li>Вызов хранителя стоит 1 ОД и считается дуэлью (не больше 3 дуэлей за ход).</li><li>Дуэль с хранителем всегда идёт все 3 раунда, даже если хранитель выиграл первые два.</li><li>Чтобы получить право взять задание понеглифа, достаточно выиграть хотя бы один раунд или сыграть вничью хотя бы один раунд.</li><li>Если не вышло, ничего страшного: Берри и карты задания не теряются, понеглиф остаётся на месте, хранителя можно вызвать снова. Использованные в дуэли карты атаки уходят в сброс, как в любой дуэли.</li><li>Если выиграть 2 раунда из 3, понеглиф достаётся сразу, без задания, и в придачу 100 Берри.</li><li>Допуск запоминается: после него задание понеглифа берётся за 2 ОД в этот же или в любой следующий ход на этом острове.</li></ul></li><li><b>Прибытие.</b> Персонаж должен находиться на локации роад-понеглифа.</li><li><b>Получение задания (2 ОД).</b> Игрок вытаскивает одну карту из колоды понеглифов. На локации понеглифа можно взять только одно задание: как только оно взято, фишка понеглифа снимается с карты. Если игрок сбросит это задание за штраф, фишка возвращается на карту.</li><li><b>Выполнение.</b> Игрок обязан выполнить условия карты. Время на эти задания не ограничено, но пока испытание не выполнено, брать задания на ивентовых локациях и карты других понеглифов нельзя.</li><li><b>Захват.</b> Как только условия выполнены, игрок немедленно забирает роад-понеглиф в инвентарь.</li><li><b>Потеря.</b> Роад-понеглиф можно отнять: если владелец проигрывает дуэль другому игроку, победитель может забрать его, если проигравший не выставил карту пассивной способности, которая этому препятствует.</li></ul><h3>Зунеша (блуждающий остров Зоя)</h3><p>Зунеша — исполинский слон, на спине которого находится остров Зоя с четвёртым роад-понеглифом. У него нет фиксированных координат.</p><ul><li><b>Глобальное перемещение.</b> В колоде погоды 4 карты «Зунеша» (по одной на море). При её выходе Зунеша перемещается в указанное море, а клетка определяется броском 1d12.</li><li><b>Истощение.</b> Когда все 4 карты вышли, перемещения прекращаются. Слон остаётся на последней позиции, пока его не перенесут карты «Вивр-карта Зунеши» или «Древняя Вивр-карта Зунеши».</li><li><b>Пассажиры и груз.</b> Зунеша перемещается вместе со всеми игроками на его спине. Четвёртый понеглиф путешествует с ним, пока его не заберёт игрок.</li><li><b>Топот.</b> Зунеша перекрывает любую локацию, на которую прибывает: её свойства недоступны, закрытые карты смотреть нельзя. Игрок, оказавшийся на этой локации в момент прибытия, автоматически переносится на её спину.</li><li><b>Ручное управление (карты сокровищ).</b> «Вивр-карта Зунеши» (2 ОД) перемещает Зунешу на соседнюю локацию. «Древняя Вивр-карта Зунеши» (3 ОД) перемещает её в любое море на локацию с тем же номером. Обе карты может сыграть только игрок на спине Зунеши.</li></ul><h2>5. Дуэль</h2><h3>Общие правила</h3><ul><li><b>Лимит.</b> За один ход игрок может участвовать не более чем в 3 дуэлях. Дуэли с игроками, боссами и дозорными считаются вместе. После третьей дуэли в этом ходу нельзя вызывать игроков на дуэль и входить на поле битвы и Базу Дозора.</li><li><b>Вызов.</b> На дуэль можно вызвать только игрока, который стоит на той же локации (1 ОД).</li><li><b>Отступление без соседней нейтральной локации.</b> Если игрок проиграл и должен отступить, но все соседние локации тоже боевые, он перемещается на ближайшую нейтральную локацию, находящуюся в одном ходе от любой из окружающих его боевых локаций. Если подходит несколько, выбирает игрок.</li></ul><h3>Игрок против игрока</h3><p>Цель: одержать 2 победы в серии из максимум 3 раундов. Если после 3 раундов двух побед ни у кого нет, побеждает тот, у кого побед больше (например, 1:0 при двух ничьих).</p><p><b>Шаг 1. Подготовка.</b> Оба игрока могут выложить до 2 карт пассивных способностей лицевой стороной вниз. Их эффекты действуют всю дуэль.</p><p><b>Шаг 2. Закладка атак.</b> Игроки выкладывают до 3 карт атаки рубашкой вверх. Если карт не хватает (или игрок не хочет их тратить), он выкладывает пустые слоты: бонус карты в таком раунде равен нулю, и игрок полагается только на кости.</p><p><b>Шаг 3. Раунды</b> (до 3). В каждом раунде игроки действуют одновременно:</p><ol><li>Вскрывают обе карты пассивных способностей.</li><li>Вскрывают свою первую карту атаки (или объявляют о её отсутствии).</li><li>Оба бросают 1d12.</li><li>Считают силу атаки: Атака персонажа + значение карты + результат на кубике + эффекты пассивных способностей − Уклонение соперника.</li></ol><p>Игрок с большей суммой побеждает в раунде и наносит 1 ранение (очко победы). При равенстве раунд заканчивается вничью: никто не получает ранений, кости не перебрасываются.</p><p><b>Невыложенные карты атаки.</b> Карты, вскрытые в раундах, после дуэли уходят в открытый сброс (в том числе в раунде, закончившемся вничью). Карты, которые не дошли до вскрытия, потому что серия закончилась раньше, остаются в закрытую у игрока и возвращаются ему в руку.</p><p><b>Шаг 4. Итоги и награды.</b> Дуэль завершается сразу, когда:</p><ul><li><b>Чистая победа:</b> один из игроков первым набрал 2 победы. Победитель получает <b>20 Берри</b> из банка и может забрать у проигравшего одно на выбор: либо 1 роад-понеглиф, либо 1 карту сокровищ.</li><li><b>Тотальный грабёж:</b> если у проигравшего нет ни понеглифов, ни карт сокровищ, победитель вслепую вытягивает 1 случайную карту из руки проигравшего (атаки или пассивной способности). Если карт нет вообще, победитель остаётся без трофеев, кроме 20 Берри.</li><li><b>Поражение:</b> проигравший обязан переместиться на любую соседнюю локацию без затрат ОД. Если проиграл тот, кто бросил вызов, его ход заканчивается, оставшиеся ОД сгорают.</li><li><b>Боевая ничья:</b> после 3 раундов побед поровну (0:0 или 1:1). Вызванный игрок остаётся на локации, бросивший вызов переходит на любую соседнюю без затрат ОД и продолжает ход.</li></ul><h3>Игрок против босса или дозорного</h3><p>Бой идёт по тем же правилам (до 2 побед в раундах), но проще:</p><ul><li>Боссы и дозорные не используют карты атаки, пассивных способностей и сокровищ.</li><li>Вся мощь противника заложена в его карточку. Кубики за него бросает любой другой игрок за столом.</li><li>После боя карта босса или дозорного не уходит в сброс, а возвращается в самый низ колоды. В каждой колоде 10 карт: уровень 1 — 3 карты, уровни 2, 3 и 4 — по 2 карты, уровень 5 — 1 карта. Награды у боссов и дозорных одинаковы для каждого уровня. Побеждённый персонаж не появится снова, пока колода не пройдёт целиком.</li></ul><p><b>Победа игрока.</b> Игрок наносит 2 ранения и получает из банка Берри или карты, указанные на карточке поверженного.</p><p><b>Особые карты сокровищ.</b> Золотой Дэн-Дэн Муси существует в единственном экземпляре на всю игру и лежит отдельно от колоды сокровищ: его получает только первый игрок, победивший Адмирала дозора (4 уровень), сразу, если у него меньше 3 карт сокровищ. После использования карта уходит из игры, повторно её никто не получает. Золотые Дэн-Дэн Муси, входящие в колоду сокровищ, остаются в колоде и покупаются как обычные карты. Остальные особые карты (Ключ от Импел Даун, Ножницы Похитителя Теней, Огненный кулак, Феникс Марко, Древнее оружие Посейдон, Подпольный рынок) покупаются как обычные карты сокровищ, но не действуют, пока владелец не победит в дуэли уникального персонажа, напечатанного на самой карте (Магеллан, Гекко Мория, Эйс, Марко, Король Нептун, Дофламинго; его атака и уклонение указаны на карте). Дуэль за карту проводится из руки по обычным правилам дуэли, стоит 0 ОД и входит в лимит 3 дуэлей за ход. При проигрыше карты с соответствующей пометкой уходят в сброс.</p><p><b>Поражение от босса</b> (пираты, Шичибукаи и др.):</p><ul><li><b>Отступление:</b> игрок немедленно возвращается на локацию, с которой пришёл на поле босса, без затрат ОД.</li><li><b>Ограбление:</b> игрок теряет 10 Берри. Если у него меньше 10 Берри, он отдаёт одну карту атаки или пассивку на выбор. Если нет ни Берри (10), ни таких карт, он пропускает 2 следующих хода.</li></ul><p><b>Поражение от Морского Дозора</b> (на Базе Дозора):</p><ul><li><b>Арест:</b> игрок остаётся на Базе Дозора и отправляется в Тюрьму на 2 следующих хода.</li><li><b>Взятка:</b> сразу после проигрыша дозорному, до ареста, игрок может заплатить в банк 15 Берри (0 ОД). Тогда арест не применяется, игрок остаётся на Базе Дозора и продолжает ход как обычно. Если игрок принял арест, он может заплатить такую же взятку в начале любого из своих ходов в тюрьме, после чего свободен и действует как обычно.</li><li><b>Побег:</b> карта сокровищ «Побег из тюрьмы», сыгранная сразу после проигрыша, отменяет арест, и игрок уходит на любую соседнюю локацию.</li></ul><h2>6. Победа в игре</h2><h3>Покорение Лафтейла</h3><p>Один из способов выиграть партию — первым достичь скрытого острова Лафтейл и выполнить финальное задание. Ступив на локацию Лафтейла, игрок вытягивает одну карту из колоды заданий Лафтейла (2 ОД), озвучивает её вслух и обязан выполнить. Первый, кто закрыл задание, объявляется Королём Пиратов и победителем.</p><p>Карту Лафтейла можно взять, только если у игрока есть хотя бы один роад-понеглиф. Если его нет, сначала нужно отобрать понеглиф в дуэли у другого игрока.</p><h3>Поиск Лафтейла («концепция ниток»)</h3><p>Чтобы найти путь к Лафтейлу, нужно собрать 4 роад-понеглифа с разных островов. Все они не обязаны находиться у одного игрока.</p><ol><li><b>Условие запуска.</b> Поиск начинается, когда в игре найдены все 4 роад-понеглифа и все их владельцы дали согласие. Любой владелец может отказаться по любой причине (право вето). Тогда бросок не совершается, игра идёт как обычно. Чтобы сдвинуться с мертвой точки, остальным придётся договариваться с отказником или отбирать его понеглиф в дуэли.</li><li><b>Вычисление координат (4 раунда).</b> После согласия в конце каждого раунда (после карты погоды) 4 роад-понеглифа бросаются ровно один раз. Каждый бросок определяет одну опорную точку по порядку: в Ист Блю, затем в Вест Блю, Норт Блю и в Саус Блю.</li><li><b>Точка Х.</b> После 4-го броска между четырьмя опорными островами нитками проводятся линии крест-накрест. Клетка, где линии пересекаются, становится Лафтейлом, на неё выставляется фишка.</li><li><b>Вход.</b> На клетку Лафтейла можно попасть только с тех 4 локаций, которые были определены бросками, по образовавшимся «ниткам». Если Лафтейл выпал на уже существующую локацию, её обычные пути к другим островам игнорируются.</li></ol><h3>Адмирал на карте</h3><p>Когда Лафтейл найден, на карту выходит один из трёх адмиралов Дозора: Акаину, Кизару или Фуджитора. Какой именно, определяется случайно в начале партии. Он появляется на красной локации и в конце каждого раунда идёт к ближайшему игроку, проходя до двух островов (атака 8, уклонение 5). Игрок на его острове сражается с ним в обычной дуэли; победа даёт 50 Берри и оглушает адмирала.</p><ul><li><b>Акаину.</b> При появлении град лавы навсегда уничтожает по одной локации в каждом море. Проигрыш: Импел Даун на 3 хода без выкупа и побега.</li><li><b>Кизару.</b> Может за один ход переместиться в другое море на локацию с тем же номером. При появлении по одной открытой локации в каждом море снова скрывается под знаком вопроса. Проигрыш: отбирает половину Берри и сажает в Импел Даун на 2 хода без выкупа и побега (если Берри нет, просто тюрьма).</li><li><b>Фуджитора.</b> В пределах одного моря попадает на любую локацию с игроком. При появлении в каждом море отмечается одна локация гравитации: игрок, вошедший на неё, пропускает следующий ход. Проигрыш: пропуск двух следующих ходов.</li></ul><h3>Второй способ победы: Истинный Король Пиратов</h3><p>Если один персонаж получает в инвентарь все доступные роад-понеглифы, ему достаточно переместиться на локацию Лафтейл. Прибыв на место, он мгновенно объявляется победителем, а карты заданий Лафтейла игнорируются.</p><h2>Приложение. Таблица сумм</h2><p>Все суммы в Берри кратны 5, поэтому для расчётов хватает покерных фишек номиналом 5, 10, 25 и 100. Суммы на карточках должны совпадать с этой таблицей.</p><table class=\"rt\"><tr><th>Статья</th><th>Берри</th><th>Тип</th></tr><tr><td>Стартовый капитал</td><td>20</td><td>Доход (разовый)</td></tr><tr><td>Флаг или игрок на локации с выпавшим номером</td><td>5</td><td>Доход (за бросок)</td></tr><tr><td>Флаг и игрок на одной локации (двойная плата)</td><td>10</td><td>Доход (за бросок)</td></tr><tr><td>Победа над игроком в дуэли</td><td>20</td><td>Доход (за событие)</td></tr><tr><td>Босс, ур. 1 — Простой пират</td><td>5</td><td>Доход (за событие)</td></tr><tr><td>Босс, ур. 2 — Капитан пиратов</td><td>10</td><td>Доход (за событие)</td></tr><tr><td>Босс, ур. 3 — Шичибукай</td><td>15</td><td>Доход (за событие)</td></tr><tr><td>Босс, ур. 4 — Великий пират</td><td>25</td><td>Доход (за событие)</td></tr><tr><td>Босс, ур. 5 — Правитель морей</td><td>35</td><td>Доход (за событие)</td></tr><tr><td>Дозорный, ур. 1 — Солдат дозора</td><td>5</td><td>Доход (за событие)</td></tr><tr><td>Дозорный, ур. 2 — Капитан дозора</td><td>10</td><td>Доход (за событие)</td></tr><tr><td>Дозорный, ур. 3 — Вице-адмирал дозора</td><td>15</td><td>Доход (за событие)</td></tr><tr><td>Дозорный, ур. 4 — Адмирал дозора</td><td>25</td><td>Доход (за событие)</td></tr><tr><td>Дозорный, ур. 5 — Герой дозора</td><td>35</td><td>Доход (за событие)</td></tr><tr><td>Карта сокровищ на Чёрном рынке</td><td>50</td><td>Расход</td></tr><tr><td>Гостевой персонаж на Чёрном рынке</td><td>80</td><td>Расход</td></tr><tr><td>Штраф за сброс задания</td><td>10</td><td>Расход</td></tr><tr><td>Штраф за сброс задания понеглифа или Лафтейла</td><td>100</td><td>Расход</td></tr><tr><td>Откуп из Тюрьмы и взятка при аресте</td><td>15</td><td>Расход</td></tr><tr><td>«Плата за тайну» (карта понеглифа)</td><td>5</td><td>Расход</td></tr><tr><td>Карта «Ловушка» — выкуп при сбросе</td><td>15</td><td>Расход</td></tr><tr><td>Карта «Долговая расписка» — выкуп при сбросе</td><td>10</td><td>Расход</td></tr><tr><td>Карта «Подпольный рынок» — скидка на карту сокровищ</td><td>10</td><td>Скидка</td></tr><tr><td>Денежное задание (цель победы)</td><td>85</td><td>Расход (цель)</td></tr></table>";
let RSEC=0;
function rulesSecs(){
  const parts=RULES_HTML.split(/(?=<h2>)/).filter(s=>s.startsWith('<h2>'));
  return parts.map(s=>({t:s.slice(4,s.indexOf('</h2>')),h:s}));
}
function rulesRender(){
  const S=rulesSecs(),el=document.getElementById('rulesov');if(!el)return;
  RSEC=Math.max(0,Math.min(RSEC,S.length-1));
  el.innerHTML='<div class="rbox" role="dialog" aria-label="Правила игры"><div class="rhead"><h2>Правила игры</h2><button class="btn" data-rclose>Закрыть ✕</button></div>'
   +'<div class="rtabs">'+S.map((s,i)=>'<button data-rsec="'+i+'"'+(i===RSEC?' class="on"':'')+'>'+esc(s.t.replace(/^\d+\.\s*/,(m)=>m))+'</button>').join('')+'</div>'
   +'<div class="rbody" id="rbody">'+S[RSEC].h+'</div>'
   +'<div class="rfoot"><button class="btn" data-rnav="-1"'+(RSEC===0?' disabled':'')+'>← '+(RSEC>0?esc(S[RSEC-1].t):'')+'</button><button class="btn primary" data-rnav="1"'+(RSEC>=S.length-1?' disabled':'')+'>'+(RSEC<S.length-1?esc(S[RSEC+1].t):'')+' →</button></div></div>';
}
function rulesOpen(i){
  let el=document.getElementById('rulesov');
  if(!el){el=document.createElement('div');el.id='rulesov';document.body.appendChild(el)}
  if(i!=null)RSEC=i;
  rulesRender();el.classList.add('on');
}
function rulesClose(){const el=document.getElementById('rulesov');if(el)el.classList.remove('on')}
document.addEventListener('click',e=>{
  {const w=e.target.closest&&e.target.closest('[data-wroll]');if(w){const q=G&&G.players[+w.dataset.wroll];if(q&&q.task&&q.task.target){fxRoll('Кругосветная Экспедиция · '+q.name+' — выпало',[q.task.target],12);flushFx()}return}}
  if(e.target.closest&&e.target.closest('[data-pvz]')){UI.pvfit=!UI.pvfit;render();return}
  if(e.target.closest&&e.target.closest('[data-mapme]')){const pw=document.querySelector('#map .pawn .halo');const g=pw&&pw.parentNode;if(g)try{g.scrollIntoView({behavior:'smooth',block:'center',inline:'center'})}catch(_){g.scrollIntoView()}return}
  if(e.target.closest&&e.target.closest('[data-mapz]')){UI.mapfit=!UI.mapfit;UI.mapFor=null;render();return}
  const b=e.target.closest&&e.target.closest('[data-rules],[data-rclose],[data-rsec],[data-rnav]');
  if(!b){const ov=e.target.id==='rulesov'?e.target:null;if(ov)rulesClose();return}
  if(b.hasAttribute('data-rules'))rulesOpen();
  else if(b.hasAttribute('data-rclose'))rulesClose();
  else if(b.dataset.rsec!=null){RSEC=+b.dataset.rsec;rulesRender()}
  else if(b.dataset.rnav){RSEC+=+b.dataset.rnav;rulesRender()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')rulesClose()});
function helpHtml(){
  return '<div class="ov"><div class="modal"><h2>Справка и допущения</h2>'
  +'<div class="small">Правила взяты из вашего документа «Правила игры — единая версия». Там, где в правилах или на карточках чего-то не хватало, я выбрал простое решение. Всё это можно поменять.</div>'

function sha256hex(str){

  for(let i=0;i<b.length;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);
  w[l>>5]|=0x80<<(24-l%32);w[(((l+64)>>9)<<4)+15]=l;
  for(let i=0;i<w.length;i+=16){const a=w.slice(i,i+16);const t=H.slice();
    for(let j=0;j<64;j++){if(j>=16){const g0=rr(7,a[j-15])^rr(18,a[j-15])^(a[j-15]>>>3),g1=rr(17,a[j-2])^rr(19,a[j-2])^(a[j-2]>>>10);a[j]=(a[j-16]+g0+a[j-7]+g1)|0}
      const S1=rr(6,t[4])^rr(11,t[4])^rr(25,t[4]),ch=(t[4]&t[5])^(~t[4]&t[6]),t1=(t[7]+S1+ch+K[j]+a[j])|0;
      const S0=rr(2,t[0])^rr(13,t[0])^rr(22,t[0]),mj=(t[0]&t[1])^(t[0]&t[2])^(t[1]&t[2]),t2=(S0+mj)|0;
      t[7]=t[6];t[6]=t[5];t[5]=t[4];t[4]=(t[3]+t1)|0;t[3]=t[2];t[2]=t[1];t[1]=t[0];t[0]=(t1+t2)|0}
    for(let j=0;j<8;j++)H[j]=(H[j]+t[j])|0}
  return H.map(x=>('00000000'+(x>>>0).toString(16)).slice(-8)).join('');

function hintHtml(){
  if(!SET.hints||!G||G.winner!=null||G.pending)return '';

  if(NET.on?need!==NET.me:(UI.viewer!==need||G.players[need].bot))return '';

function bind(){
