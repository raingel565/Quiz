function renderMap(){
  const R=38;
  let s='';
  const BR='#5a3b1f';
  s+=mapBase();
  if(G.laftel){for(const a of G.laftel.anch){const p=MAPD.nodes[a];s+='<line x1="'+p[0]+'" y1="'+p[1]+'" x2="'+G.laftel.x+'" y2="'+G.laftel.y+'" stroke="#d9a21b" stroke-width="3" stroke-dasharray="3 6"/>'}}
  const act=ACTS.filter(a=>a.loc&&!a.dis).map(a=>a.loc);
  const pickable=new Set([...act,...((G.pending&&G.pending.pick)||[])]);
  const ids=Object.keys(MAPD.nodes);
  for(const id of ids){
    const [x,y]=MAPD.nodes[id];
    const t=G.type[id];
    const isRed=REDL.includes(id);
    const fill=t?TYPES[t].c:(isRed?'#f5b5ab':'#fff');
    s+='<g data-id="'+id+'" style="cursor:'+(pickable.has(id)?'pointer':'default')+'">';
    s+='<circle cx="'+x+'" cy="'+y+'" r="'+(R+3)+'" fill="none" stroke="'+BR+'" stroke-width="1" opacity=".5"/><circle cx="'+x+'" cy="'+y+'" r="'+R+'" fill="'+fill+'" stroke="'+(isRed?'#a63a28':BR)+'" stroke-width="3" filter="url(#sh)"/>';
    if(t&&t!=='base'){const ic={start:'⚑',event:'!',dozor:'⚓',battle:'⚔',jail:'▦',market:'$'}[t]||'';s+='<text x="'+x+'" y="'+(y+9)+'" text-anchor="middle" font-size="26" font-weight="800" fill="'+(t==='market'?'#fff':BR)+'" opacity=".85" pointer-events="none">'+ic+'</text>'}
    s+='<circle cx="'+(x+R*.86)+'" cy="'+(y-R*.86)+'" r="18" fill="#fff" stroke="'+BR+'" stroke-width="2"/><text x="'+(x+R*.86)+'" y="'+(y-R*.86+7.5)+'" text-anchor="middle" font-family="Cinzel,Georgia,serif" font-size="22" font-weight="800" fill="'+BR+'" pointer-events="none">'+numOf(id)+'</text>';
    if(!t)s+='<text x="'+x+'" y="'+(y+9)+'" text-anchor="middle" font-size="26" font-weight="700" fill="'+BR+'" opacity=".35" pointer-events="none">?</text>';
    if(pickable.has(id))s+='<circle class="ring" cx="'+x+'" cy="'+y+'" r="'+(R+8)+'" fill="none" stroke="#12a05a" stroke-width="6"/>';
    if(G.flags[id]!=null){const c=G.players[G.flags[id]].color;s+='<line x1="'+(x-R+2)+'" y1="'+(y-R-16)+'" x2="'+(x-R+2)+'" y2="'+(y-R+8)+'" stroke="#5a3b1f" stroke-width="3"/><polygon points="'+(x-R+2)+','+(y-R-16)+' '+(x-R+24)+','+(y-R-8)+' '+(x-R+2)+','+(y-R)+'" fill="'+c+'" stroke="#5a3b1f" stroke-width="1.5"/>'}
    if(G.ponAt[id]){const px=x+R-2,py=y-R+2;s+='<circle cx="'+x+'" cy="'+y+'" r="'+(R+6)+'" fill="none" stroke="#d9a21b" stroke-width="3" stroke-dasharray="5 4" pointer-events="none"/><g pointer-events="none"><circle class="ring" cx="'+px+'" cy="'+py+'" r="22" fill="none" stroke="#d9a21b" stroke-width="3"/><rect x="'+(px-15)+'" y="'+(py-15)+'" width="30" height="30" rx="4" transform="rotate(45 '+px+' '+py+')" fill="#d9a21b" stroke="#2a2118" stroke-width="2.5"/><text x="'+px+'" y="'+(py+7)+'" text-anchor="middle" font-size="20" font-weight="800" fill="#2a2118">П</text></g><text x="'+x+'" y="'+(y+R+22)+'" text-anchor="middle" font-size="19" font-weight="800" fill="#8a5a00" pointer-events="none" stroke="#fff" stroke-width="5" paint-order="stroke">Понеглиф'+(G.ponAt[id].owner!=null?' · '+esc(G.players[G.ponAt[id].owner].name):'')+'</text>'}
    s+='</g>';
  }
  // Laftel & Zunesha
  if(G.laftel){const {x,y}=G.laftel;const on=pickable.has('L');s+='<g data-id="L" style="cursor:pointer"><circle cx="'+x+'" cy="'+y+'" r="38" fill="#d9a21b" stroke="#5a3b1f" stroke-width="4"/><text x="'+x+'" y="'+(y+6)+'" text-anchor="middle" font-size="16" font-weight="700" fill="#2a2118">Лафтейл</text>'+(on?'<circle class="ring" cx="'+x+'" cy="'+y+'" r="48" fill="none" stroke="#12a05a" stroke-width="6"/>':'')+'</g>'}
  if(G.zun){const [x,y]=nodePos('Z');const on=pickable.has('Z');const c=MAPD.nodes[G.zun.cell];
    s+='<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+(R+6)+'" fill="none" stroke="#555" stroke-width="5" stroke-dasharray="6 4"/>';
    s+='<g data-id="Z" style="cursor:pointer"><ellipse cx="'+x+'" cy="'+y+'" rx="40" ry="24" fill="#8c8f96" stroke="#5a3b1f" stroke-width="3"/><text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Зунеша</text>'+(G.ponAt.Z?'<rect x="'+(x+26)+'" y="'+(y-30)+'" width="18" height="18" fill="#d9a21b" stroke="#5a3b1f" stroke-width="2"/>':'')+(on?'<ellipse class="ring" cx="'+x+'" cy="'+y+'" rx="50" ry="34" fill="none" stroke="#12a05a" stroke-width="6"/>':'')+'</g>';}
  // players
  UI.np={};
  const byLoc={};
  for(const p of G.players)(byLoc[p.loc]=byLoc[p.loc]||[]).push(p);
  for(const loc in byLoc){
    const [x,y]=nodePos(loc);const arr=byLoc[loc];
    arr.forEach((p,i)=>{
      const ang=Math.PI*0.25+i*0.9;const px=x+Math.cos(ang)*(R+2),py=y+Math.sin(ang)*(R+2);
      UI.np=UI.np||{};UI.np[p.i]=[px,py];
      const op=(UI.pp||{})[p.i];const dx=op?op[0]-px:0,dy=op?op[1]-py:0;
      s+='<g class="pawn" data-dx="'+dx+'" data-dy="'+dy+'" pointer-events="none" filter="url(#sh)"><circle cx="'+px+'" cy="'+py+'" r="13" fill="'+p.color+'" stroke="'+(p===P()?'#5a3b1f':'#fff')+'" stroke-width="'+(p===P()?4:2)+'"/><circle cx="'+px+'" cy="'+py+'" r="13" fill="url(#gloss)"/><text x="'+px+'" y="'+(py+5)+'" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">'+esc(p.name[0]||'?')+'</text></g>';
    });
  }
  $('#map').innerHTML=s;
  const fast=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!fast)document.querySelectorAll('#map .pawn').forEach(g=>{
    const dx=+g.dataset.dx,dy=+g.dataset.dy;
    if(Math.abs(dx)+Math.abs(dy)<2)return;
    g.style.transform='translate('+dx+'px,'+dy+'px)';SFX.play('move',250);
    void g.getBoundingClientRect();
    requestAnimationFrame(()=>{g.style.transition='transform .6s cubic-bezier(.4,.1,.2,1)';g.style.transform='translate(0,0)'});
  });
  UI.pp=Object.assign({},UI.np);
  const sc=document.getElementById('mapscroll'),mz=document.getElementById('mapz');
  if(sc){
    sc.classList.toggle('fit',!!UI.mapfit);
    if(mz)mz.textContent=UI.mapfit?'🔍 Крупнее':'🗺 Вся карта';
    const key=G.cur+'|'+G.round+'|'+!!UI.mapfit;
    if(!UI.mapfit&&sc.scrollWidth>sc.clientWidth+4&&UI.mapFor!==key){
      UI.mapFor=key;const pp=P(),np=nodePos(pp.loc)||[794,500];
      sc.scrollLeft=Math.max(0,np[0]/1588*sc.scrollWidth-sc.clientWidth/2);
    }
  }
}

}

const heroHtml=()=>'<div class="hero"><img src="'+HERO+'" alt="Команда Соломенной Шляпы на корабле"><div class="hero-t">Гранд Лайн</div></div>';
function renderSetup(){
  $('#top').innerHTML='<span class="title">Гранд Лайн</span><span class="sp"></span>';
  $('#side').innerHTML='';$('#map').innerHTML='';$('#legend').innerHTML='';
  if(!UI.setup)UI.setup={step:'count',n:2,names:['Игрок 1','Игрок 2','Игрок 3','Игрок 4'],bots:[false,false,false,false],order:[],picks:[],cur:0};
  const S=UI.setup;
  const WP=S.wseed!=null?worldFor(S.wseed):null;
  let h='<div class="ov solid"><div class="modal" style="max-width:900px">';
  if(S.step==='count'){
    h+=heroHtml()+'<h2>Гранд Лайн: новая партия</h2><div class="small">Один экран, ходите по очереди. Играют от 2 до 4 человек, по одному в каждом море.</div>';
    h+='<div class="row"><label>Игроков: <select id="cnt">'+[2,3,4].map(n=>'<option'+(S.n===n?' selected':'')+'>'+n+'</option>').join('')+'</select></label></div>';
    h+='<div class="grp">'+[0,1,2,3].slice(0,S.n).map(i=>'<div class="row"><input id="nm'+i+'" value="'+esc(S.names[i])+'" maxlength="14" style="padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"><label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="bt'+i+'"'+(S.bots[i]?' checked':'')+'> 🤖 бот</label></div>').join('')+'</div><div class="small">Бот играет сам: собирает понеглифы, выполняет задания и идёт на Лафтейл. Остальные ходят по очереди на этом экране.</div>';
    h+='<button class="btn primary" id="go">Бросить кубики на очерёдность</button>';
    h+='<button class="btn" data-ui="net">Играть по сети: каждый на своём устройстве</button><button class="btn" data-rules>📖 Правила игры</button>';
  }else if(S.step==='roll'){
    h+='<h2>Очерёдность хода</h2><table class="t"><tr><th>Игрок</th><th>2d6</th></tr>'+S.order.map(o=>'<tr><td>'+esc(o.name)+'</td><td>'+o.r+'</td></tr>').join('')+'</table><div class="small">Больше сумма — раньше ход. Ничьи перебрасываются. Персонажей и море выбирают по порядку, и карту вы увидите заранее.</div><button class="btn primary" id="go2">Выбирать персонажей</button>';
  }else{
    // боты выбирают сами: море с ближайшим понеглифом и сильнейший из свободных персонажей
    while(S.cur<S.order.length&&S.order[S.cur].bot){
      const tk=S.picks.map(p=>p.ch),ts=S.picks.map(p=>p.sea);
      const sea=SEAK.filter(s=>!ts.includes(s)).sort((a,b)=>(worldDist(WP,a)==null?99:worldDist(WP,a))-(worldDist(WP,b)==null?99:worldDist(WP,b)))[0];
      const ch=BCH_RANK.find(k=>!tk.includes(k));
      S.picks.push({name:S.order[S.cur].name,ch,sea,bot:true});S.cur++;
    }
    if(S.cur>=S.order.length){const cfg={players:S.picks.slice(),wseed:S.wseed};UI.setup=null;newGame(cfg);render();return}
    const pl=S.order[S.cur];
    const taken=S.picks.map(p=>p.ch),seas=S.picks.map(p=>p.sea);
    h+='<h2>'+esc(pl.name)+', выберите персонажа и море ('+(S.cur+1)+'/'+S.order.length+')</h2>';
    const tkn={};S.picks.forEach(p=>tkn[p.sea]=p.name);
    h+='<div class="small">Карта этой партии уже построена: каждый раз она разная. Смотрите, где стартовая локация моря и как близко понеглиф.</div>'+worldPreviewHtml(WP,{sel:S.selSea,taken:tkn});
    h+='<div class="chars">'+Object.keys(CH).map(k=>'<button class="btn" data-ch="'+k+'"'+(taken.includes(k)?' disabled':'')+(S.selCh===k?' style="border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)"':'')+'><span class="avw" style="--pc:var(--accent)">'+av(k)+'</span><b>'+CH[k].n+'</b><span>атака '+CH[k].A+' · уклонение '+CH[k].U+'</span><span class="small">'+CH[k].d+'</span></button>').join('')+'</div>';
    h+='<div class="row">'+SEAK.map(s=>'<button class="btn" data-sea="'+s+'"'+(seas.includes(s)?' disabled':'')+(S.selSea===s?' style="border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)"':'')+'>'+SEAS[s]+'<br><span class="small">'+seaInfo(WP,s)+'</span></button>').join('')+'</div>';
    h+='<button class="btn primary" id="pick"'+(S.selCh&&S.selSea?'':' disabled')+'>Подтвердить</button>';
  }
  h+='</div></div>';
  $('#modal').innerHTML=h;
  const g=id=>document.getElementById(id);
  const nb=document.querySelector('#modal [data-ui="net"]');if(nb)nb.onclick=()=>{NET.on=true;NET.stage='menu';NET.err='';render()};
  if(S.step==='count'){
    g('cnt').onchange=e=>{S.n=+e.target.value;renderSetup()};
    g('go').onclick=()=>{
      S.names=S.names.map((x,i)=>{const el=g('nm'+i);return el?(el.value.trim()||x):x});
      S.bots=S.bots.map((x,i)=>{const el=g('bt'+i);return el?el.checked:x});
      S.names=S.names.map((x,i)=>S.bots[i]&&/^Игрок \d$/.test(x)?'Бот '+(i+1):x);
      let list=S.names.slice(0,S.n).map((n,i)=>({name:n,r:0,bot:!!S.bots[i]}));
      let ok=false,guard=0;
      while(!ok&&guard++<50){list.forEach(o=>o.r=d(6)+d(6));ok=new Set(list.map(o=>o.r)).size===list.length}
      list.sort((a,b)=>b.r-a.r);S.order=list;S.step='roll';S.wseed=1+Math.floor(Math.random()*2e9);renderSetup();diceFx(list.map(o=>({label:o.name,vals:splitDice(o.r)})));
    };
  }else if(S.step==='roll'){g('go2').onclick=()=>{S.step='pick';renderSetup()}}
  else{
    document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{S.selCh=b.dataset.ch;renderSetup()});
    document.querySelectorAll('[data-sea]').forEach(b=>b.onclick=()=>{S.selSea=b.dataset.sea;renderSetup()});
    g('pick').onclick=()=>{
      S.picks.push({name:S.order[S.cur].name,ch:S.selCh,sea:S.selSea});S.selCh=null;S.selSea=null;S.cur++;
      if(S.cur>=S.order.length){const cfg={players:S.picks.slice(),wseed:S.wseed};UI.setup=null;newGame(cfg);render()}else renderSetup();
    };
  }
}
// ---------- online (каждый на своём устройстве) ----------
// Схема: у всех одинаковый seed и одинаковые стартовые данные; по сети ходят только решения игроков
// (индекс действия или выкладка карт перед дуэлью). Каждое устройство пересчитывает партию само.
const NET={on:false,stage:'menu',code:null,uid:null,me:-1,db:null,meta:null,seats:[],remote:{},log:[],started:false,wq:Promise.resolve(),desync:false,err:'',unsub:[],name:''};
const CHUNK=20,chunkId=i=>'c'+String(i).padStart(4,'0');
const safeId=x=>String(x).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_').slice(0,100);
const genCode=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)]).join('');
function hashState(){
  const s=[G.round,G.cur,G.ap,G.duels,G.winner,G.players.map(p=>[p.berries,p.loc,p.atk.length,p.pas.length,p.tre.length,p.pon.length,p.fl,p.jail,p.skip,p.bA,p.bU].join(',')).join(';'),G.decks.atk.length,G.decks.pas.length,G.decks.tre.length,G.discard.length,Object.keys(G.flags).length].join('|');
  let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
  return (h>>>0).toString(36);
}
const encMove=(m,h)=>(m.t==='a'?'a'+m.i:'p'+JSON.stringify(m.pr))+'~'+h;
function decMove(str){const k=str.lastIndexOf('~');const b=str.slice(0,k),h=str.slice(k+1);return b[0]==='a'?{m:{t:'a',i:+b.slice(1)},h}:{m:{t:'p',pr:JSON.parse(b.slice(1))},h}}
function doMove(m,strict){
  if(m.t==='a'){
    ACTS=actions();const a=ACTS[m.i];
    if(!a||a.dis){if(strict)throw new Error('недопустимое действие');return false}
    act(a);return true;
  }
  const pe=G.pending;
  if(!pe||pe.type!=='prep'||!validPrep(G.players[pe.who],m.pr)){if(strict)throw new Error('недопустимая расстановка');return false}
  UI.prep=null;const cb=pe.cb;G.pending=null;cb(m.pr);after();return true;
}
function submit(m){
  if(!NET.on||!G){doMove(m);return}
  if(G.winner!=null||NET.desync||NET.me<0||viewerNeeded()!==NET.me)return;
  if(!doMove(m))return;
  const s=encMove(m,hashState());NET.log.push(s);pushMove(NET.log.length-1);
}
function pushMove(k){
  const idx=Math.floor(k/CHUNK);
  NET.wq=NET.wq.then(async()=>{
    for(let t=0;t<4;t++){
      try{await NET.db.doc('games/'+NET.code+'/moves/'+chunkId(idx)).set({m:NET.log.slice(idx*CHUNK,(idx+1)*CHUNK)});return}
      catch(e){if(t===3){NET.err='Не удалось отправить ход: '+(e&&e.message||e)+'. Остальные игроки его не увидят.';render();return}await new Promise(r=>setTimeout(r,400+Math.random()*600))}
    }
  });
}
function onMoves(snap){
  snap.docs.forEach(d=>{const i=parseInt(d.id.slice(1),10);const v=d.data();if(v&&Array.isArray(v.m))NET.remote[i]=v.m});
  drain();
}
function drain(){
  if(!G||NET.desync)return;
  const prev=window.__nor;window.__nor=true;
  try{
    for(;;){
      const k=NET.log.length,arr=NET.remote[Math.floor(k/CHUNK)];
      if(!arr||arr[k%CHUNK]==null)break;

    const need=sub.length*pu;if(need>hand.length)continue;
    if(need===0){if(pu===1&&!seen.has('0')){seen.add('0');cands.push([[],[],[]])}continue}
    const offs=[0,Math.floor((hand.length-need)/2),hand.length-need];
    for(const off of offs)for(const rev of[false,true]){

      for(const si of sub)for(let j=0;j<pu;j++)slots[si].push(ord[k++].cid);
      const key=slots.map(s=>s.map(id=>p.atk.find(c=>c.cid===id).v).join('+')).join('|');
      if(seen.has(key))continue;seen.add(key);cands.push(slots);

  let best=null;

    const pr={slots,pas:[]};
    const wp=bSimWin(p,pr,spec,N,o.flawless);
    const cost=slots.flat().reduce((a,id)=>a+bCardCost(p.atk.find(c=>c.cid===id)),0);

    if(pe&&pe.type==='prep'){const p=G.players[pe.who];const sv=seedv;const pr=randomPrep(p);seedv=sv;submit({t:'p',pr});return true}
    const ok=A.map((a,i)=>[a,i]).filter(([a])=>!a.dis);if(!ok.length)return false;
    let pick;if(pe)pick=ok[Math.floor(Math.random()*ok.length)];else{const non=ok.filter(([a])=>a.g!=='end');pick=(non.length&&Math.random()<.92)?non[Math.floor(Math.random()*non.length)]:ok.find(([a])=>a.g==='end')||ok[0]}
    submit({t:'a',i:pick[1]});return true;
  },
  actions,act,after,
  step(){
    // выбор случайного действия бота; пока не завершён ход, предпочитает осмысленные
    const A=actions().filter(a=>!a.dis);
    if(!A.length)return false;
    let a;
    if(G.pending){
      if(G.pending.type==='prep'){const pe=G.pending;const p=G.players[pe.who];const pr=randomPrep(p);if(!validPrep(p,pr))throw new Error('bad random prep');G.pending=null;pe.cb(pr);after();return true}
      a=A[Math.floor(rnd()*A.length)];
    }else{
      const non=A.filter(x=>x.g!=='end');
      a=(non.length&&rnd()<.92)?non[Math.floor(rnd()*non.length)]:A.find(x=>x.g==='end');
    }
    act(a);return true;
  },
  check(){
    const err=[];
    const seen=new Set();
    for(const p of G.players){
      if(p.berries<0)err.push('berries<0 '+p.name);
      if(p.atk.length>10||p.pas.length>10||p.tre.length>3)err.push('limit '+p.name+' '+p.atk.length+' '+p.pas.length+' '+p.tre.length);
      if(p.fl<0||p.fl>4)err.push('fl '+p.fl);
      if(p.fl!==4-Object.keys(G.flags).filter(l=>G.flags[l]===p.i).length)err.push('flag count mismatch '+p.name);
      if(!p.loc||(p.loc!=='Z'&&p.loc!=='L'&&!MAPD.nodes[p.loc]))err.push('bad loc '+p.loc);
      if(p.loc==='Z'&&!G.zun)err.push('Z without zun');
      for(const c of [...p.atk,...p.pas,...p.tre]){if(seen.has(c.cid))err.push('dup card '+c.cid);seen.add(c.cid)}
      if(p.pon.length+Object.keys(G.ponAt).length>4+0&&false)err.push('pon');
    }
    for(const c of G.discard){if(seen.has(c.cid))err.push('dup discard '+c.cid);seen.add(c.cid)}
    const tot=G.players.reduce((a,p)=>a+p.pon.length,0)+Object.keys(G.ponAt).length;
    if(tot!==4)err.push('poneglyph total '+tot);
    if(G.ap<0)err.push('ap<0 '+G.ap);
    return err;
  }
};
render();
})();
</script>
