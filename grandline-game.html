    const k=b.dataset.ui;
    if(k==='ready'){UI.viewer=+b.dataset.p;render()}
    else if(k==='rules'){UI.showRules=true;render()}
    else if(k==='picklist'){UI.pickList=G&&G.pending;render()}
    else if(k==='pickmap'){UI.pickList=null;render()}
    else if(k==='close'){UI.showRules=false;render()}
    else if(k==='new'){if(NET.on){netLeave()}else{saveClear();G=null;UI.setup=null}render()}
    else if(k==='resync'){netRebuild()}
    else if(k==='net'){NET.on=true;NET.stage='menu';NET.err='';render()}
  });
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;
    const i=ACTS.findIndex(x=>x.loc===id&&!x.dis);
    if(i>=0)submit({t:'a',i});
  });
  const pe=G&&G.pending;
  document.querySelectorAll('[data-dz]').forEach(b=>b.onclick=()=>{
    const Z=UI.dz;if(!Z||!pe)return;
    const n=pe.res.rounds.length,act=b.dataset.dz;

      if(Z.sc||dsWanted(pe)){Z.fast=true;if(Z.sc)Z.sc.fast(true);clearTimeout(Z.at);Z.at=0;dzRoll(pe,[0,1]);render();return}
      Z.shown=n;Z.spin=[false,false];Z.done=[false,false];render();return}

  });

    const p=G.players[pe.who],S=UI.prep,per=p.ch==='zoro'?2:1;

    });

    if(auto)auto.onclick=()=>{UI.prep=null;submit({t:'a',i:0})};

  if(G.winner!=null||NET.desync||NET.me<0||viewerNeeded()!==NET.me)return;
  if(!doMove(m))return;
  const s=encMove(m,hashState());NET.log.push(s);pushMove(NET.log.length-1);
}
function pushMove(k){
  const idx=Math.floor(k/CHUNK);
  NET.wq=NET.wq.then(async()=>{
    for(let t=0;t<4;t++){
      try{await NET.db.doc('games/'+NET.code+'/moves/'+chunkId(idx)).set({m:NET.log.slice(idx*CHUNK,(idx+1)*CHUNK)});return}
      catch(e){if(t===3){NET.err='Не удалось отправить ход: '+(e&&e.message||e)+'. Остальные игроки его не увидят.';render();return}await new Promise(r=>setTimeout(r,400+Math.random()*600))}
    }
  });
}
function onMoves(snap){
  snap.docs.forEach(d=>{const i=parseInt(d.id.slice(1),10);const v=d.data();if(v&&Array.isArray(v.m))NET.remote[i]=v.m});
  drain();
}
function drain(){
  if(!G||NET.desync)return;
  const prev=window.__nor;
  // V7: чужие ходы раньше применялись полностью без анимаций (__nor), поэтому игрок, чей ход наступал после чужого «закончить ход»,
  // не видел окна броска кубиков / карты погоды — только запись в журнале. Теперь, если пришли 1–3 новых хода (живая игра), анимации показываются;
  // при догрузке длинной истории (вход в комнату, восстановление) они по-прежнему отключены.
  let avail=0;for(let k=NET.log.length;avail<6;k++){const arr=NET.remote[Math.floor(k/CHUNK)];if(!arr||arr[k%CHUNK]==null)break;avail++}
  window.__nor=!(avail>0&&avail<=3&&(G.turnNo||0)>0&&!prev);
  try{
    for(;;){
      const k=NET.log.length,arr=NET.remote[Math.floor(k/CHUNK)];
      if(!arr||arr[k%CHUNK]==null)break;
      const str=arr[k%CHUNK],{m,h}=decMove(str);
      doMove(m,true);NET.log.push(str);
      if(hashState()!==h){NET.desync=true;break}
    }
    for(let k=0;k<NET.log.length&&!NET.desync;k++){const arr=NET.remote[Math.floor(k/CHUNK)];const e=arr&&arr[k%CHUNK];if(e!=null&&e!==NET.log[k])NET.desync=true}
  }catch(e){NET.desync=true;NET.err='Ошибка при применении хода: '+(e&&e.message||e)}
  window.__nor=prev;
  render();
}
function netRebuild(){
  const all=[];for(let i=0;NET.remote[i];i++)all.push(...NET.remote[i]);
  NET.desync=false;NET.err='';NET.log=[];
  window.__nor=true;seedv=NET.meta.seed|0;
  newGame({players:NET.meta.players.map(p=>({name:p.name,ch:p.ch,sea:p.sea})),wseed:NET.meta.wseed,mode:NET.meta.mode,tb:NET.meta.tb});
  UI.viewer=NET.me;
  try{for(const str of all){const {m,h}=decMove(str);doMove(m,true);NET.log.push(str);if(hashState()!==h){NET.desync=true;break}}}
  catch(e){NET.desync=true;NET.err='Не удалось пересчитать: '+(e&&e.message||e)}
  window.__nor=false;render();
}
function startOnline(meta){
  NET.log=[];NET.remote={};NET.desync=false;NET.err='';
  NET.me=meta.players.findIndex(p=>p.uid===NET.uid);
  window.__nor=true;seedv=meta.seed|0;
  newGame({players:meta.players.map(p=>({name:p.name,ch:p.ch,sea:p.sea})),wseed:meta.wseed,mode:meta.mode,tb:meta.tb});
  window.__nor=false;UI.viewer=STREAM.on?0:NET.me;
  NET.unsub.push(NET.db.collection('games/'+NET.code+'/moves').onSnapshot(onMoves,e=>{NET.err='Связь с партией потеряна: '+(e&&e.message||e);render()}));
  render();
}

async function fbLoad(){

function fbDb(rdb){
  const P=p=>p.split('/').length===2?p+'/meta':p;
  const clean=d=>JSON.parse(JSON.stringify(d));
  const dsnap=sn=>{const v=sn.val();return{exists:v!==null&&v!==undefined,data:()=>v}};
  const doc=path=>({
    async get(){return dsnap(await rdb.ref(P(path)).once('value'))},
    async set(d){await rdb.ref(P(path)).set(clean(d))},
    async update(d){await rdb.ref(P(path)).update(clean(d))},
    onSnapshot(cb,err){const r=rdb.ref(P(path));const h=r.on('value',s=>cb(dsnap(s)),e=>err&&err(e));return()=>r.off('value',h)}
  });
  const collection=path=>({onSnapshot(cb,err){const r=rdb.ref(path);const h=r.on('value',s=>{const docs=[];s.forEach(c=>{docs.push({id:c.key,data:()=>c.val()})});cb({docs})},e=>err&&err(e));return()=>r.off('value',h)}});
  return{doc,collection};
}

function bWithRng(fn){const sv=seedv;BSEED=(Math.imul(BSEED,1103515245)+12345)&0x7fffffff;seedv=BSEED^0x2545F491;try{return fn()}finally{seedv=sv}}
function bOppSide(spec){
  if(spec.npc)return{p:null,A:spec.A,U:spec.U,slots:[],pas:[],ch:'npc',name:'npc'};
  const q=spec.q,s=stats(q),per=q.ch==='zoro'?2:1;
  const vals=[];for(let i=0;i<q.atk.length;i++){const r=rnd()*74;vals.push(r<16?1:r<32?3:r<48?5:r<62?7:8)}
  vals.sort((a,b)=>b-a);
  const slots=[[],[],[]];let k=0;
  const ord=shuffle([0,1,2]);
  for(let j=0;j<per;j++)for(const si of ord){if(k<vals.length)slots[si].push({v:vals[k++],cid:-1})}
  const keys=['will','chopper','rumble','impact','buggy','barto','meito','mihawk'],w=[3,3,3,4,2,4,4,2];
  const pas=[];const n=Math.min(2,q.pas.length);
  for(let i=0;i<n;i++){let r=rnd()*w.reduce((a,b)=>a+b,0),j=0;while(r>=w[j]){r-=w[j];j++}pas.push({key:keys[j],kind:'pas'})}
  return{p:{berries:q.berries},A:s.A,U:s.U,slots,pas,ch:q.ch,name:q.name};
}
function bSimWin(p,pr,spec,N,flawless){
  return bWithRng(()=>{
    const mine=sideFromPrep(p,pr);let w=0;
    for(let i=0;i<N;i++){
      const r=runDuel(mine,bOppSide(spec),!!spec.guard);
      if(spec.guard){if(r.w[0]>=1||r.draws>=1)w++;continue} // хранитель: считаем шанс допуска (раунд или ничья)
      if(r.winner===0&&(!flawless||r.w[1]===0))w++;

    return w/N;
  });
}
const bCardCost=c=>6+c.v;
const bPasCost=c=>c.kind==='pas'?14:(TRE[c.key].once?25:0);
function bPrep(p,spec,stake,o){
  o=o||{};const N=o.N||36;
  const per=p.ch==='zoro'?2:1;
  const hand=p.atk.slice().sort((a,b)=>b.v-a.v);
  const cands=[],seen=new Set();
  const subs=[[],[0],[1],[2],[0,1],[0,2],[1,2],[0,1,2]];
  for(const sub of subs)for(const pu of(per===2?[1,2]:[1])){
    const need=sub.length*pu;if(need>hand.length)continue;
    if(need===0){if(pu===1&&!seen.has('0')){seen.add('0');cands.push([[],[],[]])}continue}
    const offs=[0,Math.floor((hand.length-need)/2),hand.length-need];
    for(const off of offs)for(const rev of[false,true]){
      const cs=hand.slice(off,off+need),ord=rev?cs.slice().reverse():cs;
      const slots=[[],[],[]];let k=0;
      for(const si of sub)for(let j=0;j<pu;j++)slots[si].push(ord[k++].cid);
      const key=slots.map(s=>s.map(id=>p.atk.find(c=>c.cid===id).v).join('+')).join('|');
      if(seen.has(key))continue;seen.add(key);cands.push(slots);
    }
  }
  let best=null;
  for(const slots of cands){
    const pr={slots,pas:[]};
    const wp=bSimWin(p,pr,spec,N,o.flawless);
    const cost=slots.flat().reduce((a,id)=>a+bCardCost(p.atk.find(c=>c.cid===id)),0);
    const val=wp*stake-cost;
    if(!best||val>best.val)best={pr,wp,val,cost};
  }
  if(!o.noPas){
    const pool=p.pas.concat(p.tre.filter(c=>TRE[c.key].pas&&activeC(c)));
    for(let it=0;it<3;it++){
      let bc=null;
      for(const c of pool){
        if(best.pr.pas.includes(c.cid))continue;
        const reg=best.pr.pas.filter(id=>p.pas.find(x=>x.cid===id)).length,tp=best.pr.pas.length-reg;
        if(c.kind==='pas'&&reg>=2)continue;if(c.kind!=='pas'&&tp>=1)continue;
        const pr2={slots:best.pr.slots,pas:best.pr.pas.concat([c.cid])};
        const wp2=bSimWin(p,pr2,spec,N,o.flawless);
        const g=(wp2-best.wp)*stake-bPasCost(c);
        if(g>0&&(!bc||g>bc.g))bc={pr:pr2,wp:wp2,g,c};
      }
      if(!bc)break;
      best={pr:bc.pr,wp:bc.wp,val:best.val+bc.g,cost:best.cost+bPasCost(bc.c)};
    }
  }
  return best;
}
function bPrepCtx(p,pe){
  const t=pe.title||'',o=pe.opp||{};
  let stake=45,spec,noPas=false,flawless=false;
  if(o.npc){
    spec={npc:true,A:o.A,U:o.U,guard:/Хранитель понеглифа/.test(t)};
    const m=/ур\. (\d)/.exec(t);const lv=m?+m[1]:0;
    const pirate=bPirateNames().some(n=>t.includes(n));
    if(/Дуэль за карту/.test(t))stake=75;
    else if(/Хранитель понеглифа/.test(t))stake=420;

        const f=tk.def;
        if(f.k==='npcNoPas'){stake+=220;noPas=true}
        else if(f.k==='bossWin'&&pirate&&(!f.lv||f.lv.includes(lv))){stake+=95;if(f.noPas)noPas=true;if(f.flawless)flawless=true}
      }
      if(p.ltask&&p.ltask.def.k==='lvl5'&&p.ltask.paid&&lv===5)stake=4000;
    }
  }else{
    spec={q:o};
    const att=/ваша расстановка/.test(t);
    stake=60+(att?o.pon.length*260:p.pon.length*260)+(att?0:30);
    if(att&&p.task&&p.task.def.k==='conquer')stake+=180;
    if(att&&p.task&&p.task.def.k==='pvpInit')stake+=40;
    if(p.ltask&&p.ltask.def.k==='duelP'&&p.ltask.paid)stake=4000;
  }
  return{spec,stake,noPas,flawless};
}
function bPrepFor(p,pe){

function bNb(x){
  let base=x==='Z'?(ADJ[G.zun.cell]||[]).slice():(ADJ[x]||[]).slice();
  if(x!=='Z'&&G.zun)base=base.map(y=>y===G.zun.cell?'Z':y);
  return base.filter((y,i)=>base.indexOf(y)===i&&y!==x);
}
function bMap(p,opt){
  opt=opt||{};
  const cost=x=>{
    if(x==='Z'||x==='L')return 1;
    const t=G.type[x];
    if(!t)return 1.4;
    if(t==='jail')return hasTre(p,'key')?1:(p.berries>=15?4:8);
    if(t==='dozor'||t==='battle')return opt.combat?1.1:(opt.fear||4.5);
    return 1;
  };
  const dist={[p.loc]:0},par={},pq=[[0,p.loc]],done=new Set();
  while(pq.length){
    pq.sort((a,b)=>a[0]-b[0]);const [dc,x]=pq.shift();
    if(done.has(x))continue;done.add(x);
    for(const y of bNb(x)){
      const nd=dc+cost(y);
      if(dist[y]==null||nd<dist[y]){dist[y]=nd;par[y]=x;pq.push([nd,y])}
    }
  }
  return{dist,par};
}
function bStepToward(p,goals,opt){
  const M=bMap(p,opt);let bg=null,bd=1e9;
  for(const g of goals){if(g===p.loc)continue;const d=M.dist[g];if(d!=null&&d<bd){bd=d;bg=g}}
  if(bg==null)return null;
  let x=bg,guard=0;while(M.par[x]!==p.loc){x=M.par[x];if(x==null||guard++>80)return null}
  return{step:x,goal:bg,d:bd};
}

function bFromNode(a,b){ // число шагов между узлами (без весов)

}

function resumeCardHtml(){
  const R=resumeInfo();if(!R.loc&&!R.room)return '';
  let h='<div class="lbcard rsmcard"><div class="lbh"><span class="num">▶</span><b>Незавершённая партия</b></div>';
  if(R.loc)h+='<div class="small" style="margin:4px 0 10px">'+R.loc.cfg.players.map(p=>esc(p.name)).join(', ')+' · ходов: '+R.loc.log.length+'</div><button class="lbgo" data-resume="local" style="margin:0 0 8px"><span class="dice">▶</span>Продолжить партию</button>';
  if(R.room)h+='<button class="lbgo" data-resume="net" style="margin:0 0 8px"><span class="dice">🌐</span>Вернуться в комнату '+esc(R.room)+'</button>';
  return h+'<button class="btn" data-resume="drop" style="width:100%">Забыть эту партию</button></div>';
}
function resumeLocal(){const R=resumeInfo();if(!R.loc)return;SAVE=R.loc;if(!saveRestore())alert('Не удалось восстановить партию, начните новую.')}
function resumeNet(){let code='';try{code=localStorage.getItem('gl_resume_room')||'';localStorage.removeItem('gl_resume_room');NET.name=NET.name||localStorage.getItem('gl_name')||'Игрок'}catch(e){}if(!code)return;NET.on=true;NET.stage='menu';netJoin(code,false)}
function exitGame(keep){
  window.__mnu=false;qoClose&&qoClose();FXQ.length=0;FXBUSY=false;['dicefx','cardfx','evfx','akfx','akvid','fxbd'].forEach(i=>{const e=document.getElementById(i);if(e)e.remove()});document.body.classList.remove('fxchain');
  if(UI.dz){clearTimeout(UI.dz.at);if(UI.dz.sc)UI.dz.sc.close();UI.dz=null}
  if(NET.on){const code=NET.code;netLeave();try{if(keep&&code)localStorage.setItem('gl_resume_room',code);else localStorage.removeItem('gl_resume_room')}catch(e){}NET.on=false;NET.stage='menu'}
  else{if(keep){if(SAVE)saveWrite()}else saveClear()}
  G=null;UI.setup=null;render();try{window.scrollTo(0,0)}catch(e){}
}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-exit]');if(!b||!G)return;e.preventDefault();e.stopPropagation();
  const keep=b.dataset.exit==='save';
  if(!keep&&!confirm(NET.on?'Выйти из игры? Вы покинете комнату.':'Выйти из игры? Партия не сохранится.'))return;
  exitGame(keep)},true);
function saveRestore(){
  const S0=SAVE;if(!S0)return false;
  let ok=false;window.__rep=true;window.__nor=true;
  try{
    seedv=S0.sd|0;newGame(S0.cfg);
    for(const str of S0.log){const {m,h}=decMove(str);doMove(m,true);if(hashState()!==h)throw new Error('desync')}
    ok=true;
  }catch(e){ok=false}
  window.__nor=false;window.__rep=false;
  if(!ok){saveClear();G=null;UI.setup=null;render();return false}
  SAVE=S0;render();return true;
}
(function(){
  try{
    if(/[?&](stream|nosave)/.test(location.search))return;
    const raw=localStorage.getItem(SAVEKEY);if(!raw)return;
    const S0=JSON.parse(raw);if(!S0||S0.v!==1||!Array.isArray(S0.log)||!S0.cfg||!S0.cfg.players)return;
    SAVE=S0;
    const ago=Math.max(1,Math.round((Date.now()-(S0.ts||0))/60000));
    const agoT=ago<60?ago+' мин назад':ago<1440?Math.round(ago/60)+' ч назад':Math.round(ago/1440)+' дн назад';
    const o=document.createElement('div');o.id='resumeask';
    o.style.cssText='position:fixed;inset:0;z-index:300000;display:flex;align-items:center;justify-content:center;background:rgba(6,9,12,.82);padding:16px';
    o.innerHTML='<div style="max-width:380px;width:100%;background:#fffdf7;color:#1c1f26;border:2px solid #5a3b1f;border-radius:16px;padding:18px;text-align:center;font-family:inherit">'
     +'<h3 style="margin:0 0 6px;font-size:19px">Незавершённая партия</h3>'
     +'<div style="font-size:14px;opacity:.8;margin-bottom:14px">'+S0.cfg.players.map(p=>esc(p.name)).join(', ')+'<br>ходов сделано: '+S0.log.length+' · '+agoT+'</div>'
     +'<button id="rs-go" style="width:100%;padding:12px;border-radius:12px;border:0;background:#1c1f26;color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:8px">Продолжить партию</button>'
     +'<button id="rs-new" style="width:100%;padding:10px;border-radius:12px;border:1px solid #5a3b1f;background:#fff;color:#1c1f26;font-size:14px;font-weight:600;cursor:pointer">Начать новую</button></div>';
    document.body.appendChild(o);
    o.querySelector('#rs-go').onclick=()=>{const sp=document.getElementById('splash');if(sp)sp.remove();o.remove();if(!saveRestore())alert('Не удалось восстановить партию, начните новую.')};
    o.querySelector('#rs-new').onclick=()=>{saveClear();o.remove()};
  }catch(e){}
})();
render();
try{const sm=/[?&]stream=([A-Za-z0-9]{4,6})/.exec(location.search);if(sm){NET.on=true;NET.stage='stream';netWatch(sm[1])}}catch(e){}
setTimeout(presInit,1200);
})();
</script>
