/* Layout: карта слева на весь экран, панель игрока справа; на телефоне панель под картой. */
:root{

  --accent:#0f5c63; --accent-ink:#ffffff; --gold:#b98a2c; --danger:#a8321f; --good:#2d7a45;
  --sea:#bcd9d6; --sea2:#c9dcc0; --sea3:#e7d3a8; --sea4:#d6c8e0; --node-hidden:#d9bd82;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1b24; --panel:#17262f; --ink:#ecdfc2; --muted:#9bab9f; --line:#30464f;
  --accent:#4fb3b8; --accent-ink:#06191c; --gold:#e0b552; --danger:#ef7a63; --good:#6cc287;
  --sea:#1d3b45; --sea2:#243d33; --sea3:#43391f; --sea4:#33284a; --node-hidden:#6f5d3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b24; --panel:#17262f; --ink:#ecdfc2; --muted:#9bab9f; --line:#30464f;
  --accent:#4fb3b8; --accent-ink:#06191c; --gold:#e0b552; --danger:#ef7a63; --good:#6cc287;
  --sea:#1d3b45; --sea2:#243d33; --sea3:#43391f; --sea4:#33284a; --node-hidden:#6f5d3a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:flex;flex-direction:column;gap:8px;min-height:100%}
#top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}

#now b{font-weight:700}
#now .nx{color:var(--muted,#6b6354)}
#now:empty{display:none}
.pill{display:inline-flex;gap:6px;align-items:center;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-weight:600;white-space:nowrap}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid var(--ink)}
.dot.off{opacity:.2}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-weight:600;text-align:left}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{border-color:var(--danger);color:var(--danger)}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:8px;flex:1;min-height:0}

#map{width:100%;height:auto;display:block;max-height:calc(100vh - 80px)}
#side{display:flex;flex-direction:column;gap:8px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.card h3{font-size:15px;margin-bottom:6px}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:3px 8px;background:var(--bg);font-size:12px}

.grp{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}

.row{display:flex;flex-wrap:wrap;gap:5px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px;background:var(--bg)}

#log div{border-bottom:1px dashed var(--line);padding-bottom:2px}
.ov{position:fixed;inset:0;background:rgba(10,15,20,.6);display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}
.ov.solid{background:var(--bg)}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.modal h2{font-size:21px}

.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}

.crd.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--bg))}
.slot{min-height:44px;border:2px dashed var(--line);border-radius:8px;padding:4px 8px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;flex:1;min-width:90px}
.num{font-family:var(--f-display);font-weight:700;font-size:18px}
.win{color:var(--good);font-weight:800}.lose{color:var(--danger);font-weight:800}
.ring{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)}#map{max-height:none}}

/* ===== Soft dark theme: выпуклые панели, градиенты, мягкие тени ===== */

const PAYT={2:50,12:50,3:30,11:30,4:20,10:20,5:15,9:15,6:12,8:12,7:10};
function incomeRoll(){

  log(pname(P())+' бросает 2d6: '+a+'+'+b+' = '+n+'.');

    }

// ---------- Laftel search ----------
function ownersKey(){return G.players.map(p=>p.pon.length).join(',')+'|'+G.players.map(p=>p.pon.join('+')).join(';')}
function searchStep(cb){
  const S=G.search;
  if(G.laftel){cb();return}
  const total=G.players.reduce((a,p)=>a+p.pon.length,0);
  if(S.phase==='idle'){
    if(total<4||S.veto===ownersKey()){cb();return}
    const owners=G.players.filter(p=>p.pon.length);
    const next=i=>{
      if(i>=owners.length){S.phase='rolling';log('Все владельцы понеглифов согласились. Начинается поиск Лафтейла.');doSearchRoll();cb();return}
      ask('consent',{who:owners[i].i,title:'Поиск Лафтейла',text:'Все 4 роад-понеглифа найдены. Согласны запустить вычисление координат? Любой владелец может отказаться.',
        opts:[{label:'Согласен',run:()=>next(i+1)},{label:'Отказываюсь (вето)',run:()=>{S.veto=ownersKey();log(owners[i].name+' наложил вето на поиск Лафтейла.');cb()}}]});
    };
    next(0);
  }else if(S.phase==='rolling'){doSearchRoll();cb()}
  else cb();
}
function doSearchRoll(){
  const S=G.search,order=['E','W','N','S'];
  if(S.rolls.length>=4)return;
  const sea=order[S.rolls.length];
  let sum=0;const fv=[];for(let i=0;i<4;i++){const q=Math.ceil(d(6)/2);fv.push(q);sum+=q}fxRoll('Поиск Лафтейла · '+SEAS[sea],fv,6);
  const id=sea+sum;S.rolls.push(id);
  log('Роад-понеглифы указывают на '+locName(id)+'.');
  if(S.rolls.length===4){
    const pt=s=>MAPD.nodes[s];
    const [E,W,N,Sx]=S.rolls.map(pt);
    function inter(a,b,c,dd){
      const x1=a[0],y1=a[1],x2=b[0],y2=b[1],x3=c[0],y3=c[1],x4=dd[0],y4=dd[1];
      const den=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
      if(Math.abs(den)<1e-6)return[(x1+x2+x3+x4)/4,(y1+y2+y3+y4)/4];
      const px=((x1*y2-y1*x2)*(x3-x4)-(x1-x2)*(x3*y4-y3*x4))/den,py=((x1*y2-y1*x2)*(y3-y4)-(y1-y2)*(x3*y4-y3*x4))/den;
      return[Math.max(60,Math.min(1528,px)),Math.max(60,Math.min(1063,py))];
    }
    const [x,y]=inter(E,W,N,Sx);
    G.laftel={x:Math.round(x),y:Math.round(y),anch:S.rolls.slice()};
    for(const a of S.rolls)link('L',a);
    log('Нитки пересеклись: появился остров Лафтейл!');
    S.phase='done';
  }
}

// ---------- tasks ----------
function giveTask(p,cat,def,loc){
  const t={cat,def,loc:loc||null,base:Object.assign({},p.cnt),seas:new Set([p.sea]),startSea:p.sea,target:null,done:false,takeAp:G.ap,turnNo:G.turnNo};
  if(def.k==='world'){do{t.target=d(12)}while(t.target===1);fxRoll('Задание · '+p.name,[t.target],12);log(p.name+': выпало '+t.target+' — нужны 2 флага на локациях №'+t.target+' в двух морях и доход с них.')}
  return t;
}
function taskDone(p,t){
  const f=t.def,c=p.cnt,b=t.base;
  switch(f.k){
    case'winAny':case'winP':case'winB':case'winD':case'moves':return c[f.k]-b[f.k]>=f.n;
    case'flags':return flagCount(p)>=f.n;
    case'hold_atk':return p.atk.length>=f.n;
    case'hold_tre':return p.tre.length>=f.n;
    case'othersea':return p.loc!=='Z'&&p.loc!=='L'&&seaOf(p.loc)!==t.startSea;
    case'visitLoc':return p.loc===f.loc;
    case'visitNum':return p.loc!=='Z'&&p.loc!=='L'&&numOf(p.loc)===t.target;
    case'visitLow':return p.loc!=='Z'&&p.loc!=='L'&&numOf(p.loc)<=3&&seaOf(p.loc)!==t.startSea;
    case'seas':return t.seas.size>=f.n;
  }
  return !!t.done;
}
function checkTasks(){
  for(const p of G.players){
    if(G.pending)return;
    if(p.task&&taskDone(p,p.task))completeTask(p,'task');
    if(G.winner!=null)return;
    if(p.ltask&&taskDone(p,p.ltask))completeTask(p,'ltask');
    if(G.winner!=null)return;
  }
}
function giveCards(p,kind,n){

}
function applyOpt(p,o,def){

function taskReward(p,def){

function cancelTask(p,why){

function taskEvent(p,kind,info){
  const t=p.task;if(!t)return;

function marchCheck(p){

  if(t.turnNo===G.turnNo&&t.takeAp===G.apMax&&G.ap===0&&G.tm.buy===0&&G.tm.pvp===0&&p.cnt.moves-G.tm.mv0===G.apMax){t.done=true;completeTask(p,'task')}
}
function completeTask(p,slot){

// ---------- duels ----------
function prepKey(side){return side.p?side.p.i:-1}
function validPrep(p,pr){
  if(!pr)return false;
  const ids=new Set();
  const per=p.ch==='zoro'?2:1;
  if(pr.slots.length>3)return false;
  for(const sl of pr.slots){if(sl.length>per)return false;for(const id of sl){if(ids.has(id))return false;ids.add(id);if(!p.atk.find(c=>c.cid===id))return false}}
  const pids=new Set();let reg=0,tp=0;
  for(const id of pr.pas){if(pids.has(id))return false;pids.add(id);const c=p.pas.find(c=>c.cid===id)||p.tre.find(c=>c.cid===id&&TRE[c.key].pas&&activeC(c));if(!c)return false;if(c.kind==='pas')reg++;else tp++}
  return reg<=2&&tp<=1;
}
function randomPrep(p){
  const hand=shuffle(p.atk.slice());
  const per=p.ch==='zoro'?2:1;
  const slots=[];
  for(let i=0;i<3;i++){const sl=[];for(let j=0;j<per;j++){if(hand.length&&rnd()<.9)sl.push(hand.pop().cid)}slots.push(sl)}
  const pas=shuffle(p.pas.slice()).slice(0,Math.floor(rnd()*3)).map(c=>c.cid);
  const tp=p.tre.filter(c=>TRE[c.key].pas&&activeC(c));
  if(tp.length&&rnd()<.5)pas.push(tp[0].cid);
  return{slots,pas};
}
function sideFromPrep(p,pr){
  const slots=pr.slots.map(sl=>sl.map(id=>p.atk.find(c=>c.cid===id)));
  const pas=pr.pas.map(id=>p.pas.find(c=>c.cid===id)||p.tre.find(c=>c.cid===id));
  const s=stats(p);
  return{p,A:s.A,U:s.U,slots,pas,ch:p.ch,name:p.name};
}
function runDuel(S1,S2){
  const S=[S1,S2];
  const st=S.map((s,i)=>{
    const opp=S[1-i];
    let keys=s.pas.map(c=>c.key);
    if(opp.ch==='hancock'&&s.p)keys=[];
    const has=k=>keys.includes(k);
    let tA=0,tU=0;for(const c of s.pas)if(TRE[c.key]&&TRE[c.key].pas&&keys.includes(c.key)){tA+=TRE[c.key].pas.a;tU+=TRE[c.key].pas.u}
    return{s,keys,has,tA,tU,carry:0,annul:false,marco:false,rumble:false,wins:0,placed:keys.slice()};
  });
  for(const x of st){if(x.has('rumble')&&x.s.p&&x.s.p.berries>=5){x.rumble=true}}
  const rounds=[],used=[[],[]];
  for(let r=0;r<3&&st[0].wins<2&&st[1].wins<2;r++){
    const cur=st.map((x,i)=>{
      const opp=st[1-i];
      let cards=(x.s.slots[r]||[]).slice();
      let ann=false;
      if(cards.length&&opp.has('barto')&&!x.annul){x.annul=true;cards.shift();ann=true}
      used[i].push(...(x.s.slots[r]||[]));
      let val=0;
      for(const c of cards){val+=c.v;if(x.s.ch==='luffy')val+=3;if(x.has('mihawk')&&c.v>=7)val+=4}
      const roll=x.keys.includes('jinwoo')?d(20):d(12);
      let pa=0;if(x.has('will'))pa+=2;if(x.rumble)pa+=3;
      const att=x.s.A+val+roll+pa+x.tA+x.carry;
      let ev=x.s.U+x.tU+(x.has('chopper')?2:0);
      if(x.keys.includes('fist')&&!opp.has('will'))ev+=10;
      return{val,roll,att,ev,ann,cs:(x.s.slots[r]||[]).map(c=>c.v),carry:x.carry,pa};
    });
    st.forEach(x=>x.carry=0);
    let sc=[cur[0].att-cur[1].ev,cur[1].att-cur[0].ev];
    const abs=[0,0];
    for(let i=0;i<2;i++){if(st[i].has('impact')){abs[i]=3;sc[1-i]-=3;}}
    for(let i=0;i<2;i++)if(abs[i])st[i].carry=abs[i];
    const nat=[false,false];
    for(let i=0;i<2;i++){if(st[i].keys.includes('natsu')&&!st[i].natsuUsed&&sc[i]<=sc[1-i]){st[i].natsuUsed=true;sc[i]+=20;nat[i]=true}}
    let out;
    if(sc[0]>sc[1])out=0;else if(sc[1]>sc[0])out=1;else{
      const m0=st[0].has('meito'),m1=st[1].has('meito');
      out=m0&&!m1?0:m1&&!m0?1:-1;
    }
    let marco=false;
    if(out>=0){const l=1-out;if(st[l].keys.includes('marco')&&!st[l].marco){st[l].marco=true;out=-1;marco=true}}
    if(out>=0)st[out].wins++;
    rounds.push({cur,sc,out,marco,abs,nat});
  }
  let winner=-1;if(st[0].wins>=2)winner=0;else if(st[1].wins>=2)winner=1;
  return{rounds,winner,st,used,w:[st[0].wins,st[1].wins]};
}
function applyDuelCards(res){
  // списать открытые карты атаки, Рамбл Болл, потерю карт-сокровищ при проигрыше
  [0,1].forEach(i=>{
    const x=res.st[i],p=x.s.p;if(!p)return;
    for(const c of res.used[i])discardCard(p,c);
    if(x.rumble){p.berries-=5}
    for(const c of x.s.pas.slice()){
      if(c.kind==='pas'){discardCard(p,c);continue}
      if(TRE[c.key].once){discardCard(p,c);continue}
    }
  });
}

function afterPvp(p,q,res){
  const w=res.winner;
  taskEvent(p,'pvpInit',{rounds:res.w[0]});
  if(w===-1){
    log('Ничья: '+p.name+' уходит на соседнюю локацию.');
    retreat(p,()=>{});return;
  }
  const W=w===0?p:q,L=w===0?q:p;
  W.cnt.winP++;W.cnt.winAny++;
  taskEvent(W,'pvpWin',{});
  if(W.ltask&&W.ltask.def.k==='duelP'&&W.ltask.paid&&W.loc==='L')W.ltask.done=true;
  W.berries+=20;
  const buggy=res.st[w===0?1:0].keys.includes('buggy');
  const finish=()=>{
    retreat(L,()=>{if(L===p)G.endAfter=true});
  };
  if(buggy){log('Клоун Багги: '+W.name+' получает только 20 Берри.');finish();return}
  const hasP=L.pon.length>0,hasT=L.tre.length>0;
  const takeRandom=()=>{
    const pool=[...L.atk.map(c=>['atk',c]),...L.pas.map(c=>['pas',c])];
    if(!pool.length){finish();return}
    const [k,c]=pool[d(pool.length)-1];
    L[k].splice(L[k].indexOf(c),1);
    if(W[k].length<10){W[k].push(c);log(W.name+' вслепую забирает карту у '+L.name+'.')}else G.discard.push(c);
    finish();
  };
  const takeTre=()=>{
    const c=L.tre[d(L.tre.length)-1];L.tre.splice(L.tre.indexOf(c),1);
    if(W.tre.length<3){W.tre.push(c);log(W.name+' забирает карту сокровищ у '+L.name+'.')}else{G.discard.push(c);log(W.name+' забирает карту сокровищ, но слотов нет: она в сбросе.')}
    finish();
  };
  const takePon=()=>{
    const x=L.pon.pop();W.pon.push(x);
    G.ponAt[x]=undefined;delete G.ponAt[x];
    log(W.name+' забирает роад-понеглиф у '+L.name+'.');finish();
  };
  if(hasP||hasT){
    const o=[];
    if(hasP)o.push({label:'Забрать роад-понеглиф',run:takePon});
    if(hasT)o.push({label:'Забрать случайную карту сокровищ',run:takeTre});
    ask('loot',{who:W.i,title:'Трофей победителя',text:'Выберите, что забрать у '+L.name+'.',opts:o});
  }else takeRandom();
}

function retreat(p,cb){
  let cands=nbrsOf(p).filter(x=>x!=='L'||true);
  const bad=x=>x!=='Z'&&x!=='L'&&(G.type[x]==='dozor'||G.type[x]==='battle');
  let good=cands.filter(x=>!bad(x)&&x!=='L');
  if(!good.length){
    // ближайшая нейтральная
    const seen=new Set([p.loc]);let fr=[p.loc];
    for(let k=0;k<6&&!good.length;k++){
      const nx=[];
      for(const a of fr)for(const b of (ADJ[a]||[])){if(seen.has(b))continue;seen.add(b);nx.push(b);if(!bad(b)&&b!=='L'&&b!==(G.zun&&G.zun.cell))good.push(b)}
      fr=nx;
    }
  }
  if(!good.length){cb&&cb();return}
  const o=good.map(x=>({label:locName(x)+(G.type[x]?' ('+TYPES[G.type[x]].n+')':x==='Z'?'':' (неизвестно)'),loc:x,run:()=>{
    log(p.name+' отступает на '+locName(x)+'.');
    arrive(p,x,{quiet:true},cb);
  }}));
  ask('retreat',{who:p.i,title:'Отступление: '+p.name,text:'Выберите соседнюю локацию.',opts:o,pick:good});
}

  if(here&&lt&&!['jail','dozor','battle'].includes(lt)){

    if(fo===p.i)add('flag','Поднять свой флаг (бесплатно)',()=>{delete G.flags[loc];p.fl++;log(p.name+' поднимает свой флаг.')});

  if(p.loc==='L'&&!p.ltask){

    drawFor(p,'tev',def=>{p.task=giveTask(p,'ev',def);log(p.name+' берёт задание «'+def.t+'».')});

      if(p[k].length<(k==='tre'?3:10)){q[k].splice(q[k].indexOf(c),1);p[k].push(c);log(p.name+' крадёт карту у '+q.name+'.')}else log(p.name+' не смог унести карту: нет места.');

function act(a){

function flushFx(){

function diceFx(rows,done){
  const fast=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(window.__nor||fast||!document.body||!Element.prototype.animate){done&&done();return}
  const old=document.getElementById('dicefx');if(old)old.remove();
  const o=document.createElement('div');o.id='dicefx';
  const face=n=>'<div class="fc f'+n+'">'+Array.from({length:9},(_,i)=>'<i'+(DPIPS[n].includes(i)?' class="on"':'')+'></i>').join('')+'</div>';
  const die=(r)=>(r.sides||6)===6?'<div class="dscene"><div class="dwrap"><div class="cube">'+[1,2,3,4,5,6].map(face).join('')+'</div></div></div>':'<div class="dscene"><div class="dwrap"><div class="pd s'+r.sides+'"><b>?</b></div></div></div>';

  o.innerHTML=rows.map(r=>'<div class="drow"><div class="dl">'+esc(r.label)+'</div>'+r.vals.map(()=>die(r)).join('')+'<div class="dsum">'+(r.vals.length>1?'= ':'')+r.vals.reduce((a,b)=>a+b,0)+'</div></div>').join('')+(gated?'<button class="btn primary dgo">Бросить кубики</button>':'<div class="dhint">нажмите, чтобы пропустить</div>');
  document.body.appendChild(o);
  let fin=false,started=false;
  const end=()=>{if(fin)return;fin=true;o.classList.add('out');setTimeout(()=>{o.remove();done&&done()},300)};
  const flat=[];rows.forEach(r=>r.vals.forEach(v=>flat.push({v,s:r.sides||6})));
  const cubes=o.querySelectorAll('.dwrap>.cube,.dwrap>.pd'),wraps=o.querySelectorAll('.dwrap');
  const go=()=>{
    if(started)return;started=true;
    const b=o.querySelector('.dgo');if(b)b.replaceWith(Object.assign(document.createElement('div'),{className:'dhint',textContent:'нажмите, чтобы пропустить'}));
    let maxT=0;

      const {v,s}=flat[i],dur=950+Math.random()*350+i*60;maxT=Math.max(maxT,dur);
      if(s===6){

        c.animate([{transform:'rotateX(-40deg) rotateY(-60deg) rotateZ(0deg)'},{transform:'rotateX('+(rx+a)+'deg) rotateY('+(ry-b2)+'deg) rotateZ(0deg)'}],{duration:dur,easing:'cubic-bezier(.12,.55,.2,1)',fill:'forwards'});
      }else{
        c.animate([{transform:'rotateY(0deg)'},{transform:'rotateY('+(1080+Math.round(Math.random()*2)*360)+'deg)'}],{duration:dur,easing:'cubic-bezier(.12,.55,.2,1)',fill:'forwards'});
        const bt=c.querySelector('b');let k=0;const iv=setInterval(()=>{k++;bt.textContent=1+Math.floor(Math.random()*s)},70);

    });
    setTimeout(()=>{o.querySelectorAll('.drow').forEach(r=>r.classList.add('show'))},maxT+80);
    setTimeout(end,maxT+1500);
  };
  o.onclick=e=>{if(!started){if(e.target.closest('.dgo')||!gated)go();if(!gated)return}else end()};
  if(!gated)go();
}

function resultHtml(pe){
  const res=pe.res;

  const Z=UI.dz,n=res.rounds.length;
  const wins=[0,0];
  for(let r=0;r<Z.shown;r++){const o=res.rounds[r].out;if(o>=0)wins[o]++}
  const side=i=>{
    const x=res.st[i],s0=x.s;
    const pas=s0.pas.map(c=>c.kind==='pas'?PAS[c.key].n:TRE[c.key].n);
    const blocked=s0.pas.length&&!x.keys.length;
    return '<div class="card" style="flex:1;min-width:150px"><h3>'+esc(pe.names[i])+'</h3><div class="small">'+(s0.p?esc(CH[s0.ch].n)+' · ':'')+'атака '+s0.A+' / уклонение '+s0.U+'</div>'
      +'<div class="small">Пассивные: '+(pas.length?esc(pas.join(', ')):'нет')+(blocked?' (отключены Хенкок)':'')+'</div>'
      +'<div style="font-size:22px;margin-top:4px">'+[0,1].map(k=>'<span style="color:'+(k<wins[i]?'var(--danger)':'var(--line)')+'">●</span>').join(' ')+'</div></div>';
  };
  let h='<div class="ov"><div class="modal"><h2>'+esc(pe.title)+'</h2><div class="row" style="flex-wrap:nowrap">'+side(0)+side(1)+'</div>';
  const line=(r)=>{
    const R=res.rounds[r],c=R.cur;
    const part=(x,k)=>{
      const o=x.att-res.st[k].s.A-x.val-x.roll;
      return '<div class="small">атака '+res.st[k].s.A+' + карта '+x.val+(x.ann?' (аннулирована)':'')+' + кубик <b>'+x.roll+'</b>'+(o?' + эффекты '+(o>0?'+':'')+o:'')+' = <b>'+x.att+'</b>; уклонение соперника −'+c[1-k].ev+' → <span class="num">'+R.sc[k]+'</span></div>';
    };

    return '<div class="card"><b>Раунд '+(r+1)+'</b><div class="row" style="flex-wrap:nowrap"><div style="flex:1;min-width:0">'+part(c[0],0)+'</div><div style="flex:1;min-width:0">'+part(c[1],1)+'</div></div><div>'+(R.nat&&(R.nat[0]||R.nat[1])?'Нацу даёт +20. ':'')+out+'</div></div>';
  };
  for(let r=0;r<Z.shown;r++)h+=line(r);
  if(Z.shown<n){
    const R=res.rounds[Z.shown],c=R.cur;
    const box=k=>{
      const x=c[k],hi=res.st[k].keys.includes('jinwoo')?20:12;
      const cardTxt='Карта: '+(x.cs.length?x.cs.join(' + '):'нет')+(x.ann?' (аннулирована)':'');
      let mid;
      if(Z.done[k])mid='<span class="pd s'+hi+'"><b>'+x.roll+'</b></span>';
      else if(Z.spin[k])mid='<span class="pd s'+hi+'" id="d'+k+'"><b>?</b></span>';
      else mid='<button class="btn primary" data-dz="die" data-k="'+k+'">Бросить d'+hi+(res.st[k].s.p?'':' за босса')+'</button>';
      return '<div style="flex:1;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center"><b>'+esc(pe.names[k])+'</b><span class="small">'+cardTxt+'</span>'+mid+'</div>';
    };
    h+='<div class="card"><b>Раунд '+(Z.shown+1)+'</b><div class="row" style="flex-wrap:nowrap;justify-content:space-around">'+box(0)+box(1)+'</div></div>';
    h+='<div class="row"><button class="btn" data-dz="skip">Показать всё сразу</button></div>';
  }
  if(Z.shown>=n)h+='<div class="'+(res.winner===-1?'':'win')+'" style="font-size:18px">'+(res.winner===-1?'Боевая ничья':'Победа: '+esc(pe.names[res.winner]))+' ('+res.w[0]+' : '+res.w[1]+')</div><button class="btn primary" data-a="0">Продолжить</button>';
  return h+'</div></div>';
}

function bind(){
  document.querySelectorAll('#modal [data-a],#side [data-a]').forEach(b=>b.onclick=()=>{submit({t:'a',i:+b.dataset.a})});
  document.querySelectorAll('[data-ui]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ui;
    if(k==='ready'){UI.viewer=+b.dataset.p;render()}
    else if(k==='rules'){UI.showRules=true;render()}
    else if(k==='close'){UI.showRules=false;render()}
    else if(k==='new'){if(NET.on){netLeave()}else{G=null;UI.setup=null}render()}
    else if(k==='resync'){netRebuild()}
    else if(k==='net'){NET.on=true;NET.stage='menu';NET.err='';render()}
  });
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;
    const i=ACTS.findIndex(x=>x.loc===id&&!x.dis);
    if(i>=0)submit({t:'a',i});
  });
  const pe=G&&G.pending;
  document.querySelectorAll('[data-dz]').forEach(b=>b.onclick=()=>{
    const Z=UI.dz;if(!Z||!pe)return;
    const n=pe.res.rounds.length;
    if(b.dataset.dz==='skip'){Z.shown=n;Z.spin=[false,false];Z.done=[false,false];render();return}
    const k=+b.dataset.k;
    const fast=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const fin=()=>{
      if(UI.dz!==Z||G.pending!==pe)return;
      Z.spin[k]=false;Z.done[k]=true;render();
      if(Z.done[0]&&Z.done[1])setTimeout(()=>{if(UI.dz===Z&&G.pending===pe){Z.shown++;Z.done=[false,false];render()}},900);
    };
    if(fast){fin();return}
    Z.spin[k]=true;render();
    const el=document.getElementById('d'+k);
    const hi=pe.res.st[k].keys.includes('jinwoo')?20:12;
    if(el)el.animate([{transform:'rotateY(0deg) translateY(-30px)'},{transform:'rotateY(900deg) translateY(0)'}],{duration:800,easing:'cubic-bezier(.2,.6,.2,1)'});
    const eb=el&&el.querySelector('b');const tm=setInterval(()=>{if(eb&&eb.isConnected)eb.textContent=1+Math.floor(Math.random()*hi)},60);
    setTimeout(()=>{clearInterval(tm);fin()},800);
  });
  if(pe&&pe.type==='prep'){
    const p=G.players[pe.who],S=UI.prep,per=p.ch==='zoro'?2:1;
    document.querySelectorAll('[data-pas]').forEach(b=>b.onclick=()=>{
      const id=+b.dataset.pas,i=S.pas.indexOf(id);
      if(i>=0)S.pas.splice(i,1);else{
        const c=p.pas.find(c=>c.cid===id)||p.tre.find(c=>c.cid===id);
        const reg=S.pas.filter(x=>p.pas.find(c=>c.cid===x)).length,tp=S.pas.length-reg;
        if(c.kind==='pas'&&reg<2)S.pas.push(id);else if(c.kind==='tre'&&tp<1)S.pas.push(id);
      }
      render();
    });
    document.querySelectorAll('[data-atk]').forEach(b=>b.onclick=()=>{
      const id=+b.dataset.atk;const sl=S.slots.find(s=>s.length<per);if(sl){sl.push(id);render()}
    });
    document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{S.slots[+b.dataset.slot].pop();render()});
    const ok=document.querySelector('[data-prepok]');
    if(ok)ok.onclick=()=>{
      const pr={slots:S.slots.map(s=>s.slice()),pas:S.pas.slice()};
      if(!validPrep(p,pr))return;
      submit({t:'p',pr});
    };
    const auto=document.querySelector('#modal [data-a]');
    if(auto)auto.onclick=()=>{UI.prep=null;submit({t:'a',i:0})};
  }
  if(NET.on&&G&&viewerNeeded()!==NET.me)document.querySelectorAll('#modal [data-a]').forEach(b=>{b.disabled=true});
}

// ---------- online (каждый на своём устройстве) ----------
// Схема: у всех одинаковый seed и одинаковые стартовые данные; по сети ходят только решения игроков
// (индекс действия или выкладка карт перед дуэлью). Каждое устройство пересчитывает партию само.
const NET={on:false,stage:'menu',code:null,uid:null,me:-1,db:null,meta:null,seats:[],remote:{},log:[],started:false,wq:Promise.resolve(),desync:false,err:'',unsub:[],name:''};
const CHUNK=20,chunkId=i=>'c'+String(i).padStart(4,'0');
const safeId=x=>String(x).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_').slice(0,100);
const genCode=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)]).join('');
function hashState(){
  const s=[G.round,G.cur,G.ap,G.duels,G.winner,G.players.map(p=>[p.berries,p.loc,p.atk.length,p.pas.length,p.tre.length,p.pon.length,p.fl,p.jail,p.skip,p.bA,p.bU].join(',')).join(';'),G.decks.atk.length,G.decks.pas.length,G.decks.tre.length,G.discard.length,Object.keys(G.flags).length].join('|');
  let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
  return (h>>>0).toString(36);
}
const encMove=(m,h)=>(m.t==='a'?'a'+m.i:'p'+JSON.stringify(m.pr))+'~'+h;
function decMove(str){const k=str.lastIndexOf('~');const b=str.slice(0,k),h=str.slice(k+1);return b[0]==='a'?{m:{t:'a',i:+b.slice(1)},h}:{m:{t:'p',pr:JSON.parse(b.slice(1))},h}}
function doMove(m,strict){
  if(m.t==='a'){
    ACTS=actions();const a=ACTS[m.i];
    if(!a||a.dis){if(strict)throw new Error('недопустимое действие');return false}
    act(a);return true;
  }
  const pe=G.pending;
  if(!pe||pe.type!=='prep'||!validPrep(G.players[pe.who],m.pr)){if(strict)throw new Error('недопустимая расстановка');return false}
  UI.prep=null;const cb=pe.cb;G.pending=null;cb(m.pr);after();return true;
}
function submit(m){
  if(!NET.on||!G){doMove(m);return}
  if(G.winner!=null||NET.desync||NET.me<0||viewerNeeded()!==NET.me)return;
  if(!doMove(m))return;
  const s=encMove(m,hashState());NET.log.push(s);pushMove(NET.log.length-1);
}
function pushMove(k){
  const idx=Math.floor(k/CHUNK);
  NET.wq=NET.wq.then(async()=>{
    for(let t=0;t<4;t++){
      try{await NET.db.doc('games/'+NET.code+'/moves/'+chunkId(idx)).set({m:NET.log.slice(idx*CHUNK,(idx+1)*CHUNK)});return}
      catch(e){if(t===3){NET.err='Не удалось отправить ход: '+(e&&e.message||e)+'. Остальные игроки его не увидят.';render();return}await new Promise(r=>setTimeout(r,400+Math.random()*600))}
    }
  });
}
function onMoves(snap){
  snap.docs.forEach(d=>{const i=parseInt(d.id.slice(1),10);const v=d.data();if(v&&Array.isArray(v.m))NET.remote[i]=v.m});
  drain();
}
function drain(){
  if(!G||NET.desync)return;
  const prev=window.__nor;window.__nor=true;
  try{
    for(;;){
      const k=NET.log.length,arr=NET.remote[Math.floor(k/CHUNK)];
      if(!arr||arr[k%CHUNK]==null)break;
      const str=arr[k%CHUNK],{m,h}=decMove(str);
      doMove(m,true);NET.log.push(str);
      if(hashState()!==h){NET.desync=true;break}
    }
    for(let k=0;k<NET.log.length&&!NET.desync;k++){const arr=NET.remote[Math.floor(k/CHUNK)];const e=arr&&arr[k%CHUNK];if(e!=null&&e!==NET.log[k])NET.desync=true}
  }catch(e){NET.desync=true;NET.err='Ошибка при применении хода: '+(e&&e.message||e)}
  window.__nor=prev;
  render();
}
function netRebuild(){
  const all=[];for(let i=0;NET.remote[i];i++)all.push(...NET.remote[i]);
  NET.desync=false;NET.err='';NET.log=[];
  window.__nor=true;seedv=NET.meta.seed|0;
  newGame({players:NET.meta.players.map(p=>({name:p.name,ch:p.ch,sea:p.sea}))});
  UI.viewer=NET.me;
  try{for(const str of all){const {m,h}=decMove(str);doMove(m,true);NET.log.push(str);if(hashState()!==h){NET.desync=true;break}}}
  catch(e){NET.desync=true;NET.err='Не удалось пересчитать: '+(e&&e.message||e)}
  window.__nor=false;render();
}
function startOnline(meta){
  NET.log=[];NET.remote={};NET.desync=false;NET.err='';
  NET.me=meta.players.findIndex(p=>p.uid===NET.uid);
  window.__nor=true;seedv=meta.seed|0;
  newGame({players:meta.players.map(p=>({name:p.name,ch:p.ch,sea:p.sea}))});
  window.__nor=false;UI.viewer=NET.me;
  NET.unsub.push(NET.db.collection('games/'+NET.code+'/moves').onSnapshot(onMoves,e=>{NET.err='Связь с партией потеряна: '+(e&&e.message||e);render()}));
  render();
}
function netErr(e,pref){NET.err=(pref||'Ошибка')+(e&&e.message?': '+e.message:'');render()}
async function netInit(){
  if(NET.db)return true;
  try{
    if(!window.claude||!claude.use)throw new Error('сетевой режим работает только на опубликованной странице в Claude');
    const db=await claude.use('db'),user=await claude.use('user');
    if(!db||!user)throw new Error('нет доступа к общему хранилищу: войдите в аккаунт, владелец должен выдать вам доступ Contributor');
    const id=await user.id();if(!id)throw new Error('не удалось определить пользователя');
    NET.db=db;NET.uid=safeId(id);return true;
  }catch(e){NET.err=e.message||String(e);return false}
}
async function netJoin(code,create){
  NET.err='';NET.busy=true;render();
  if(!await netInit()){NET.busy=false;render();return}
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
  if(code.length<4){NET.err='Введите код комнаты (4 символа)';NET.busy=false;render();return}
  try{
    const mref=NET.db.doc('games/'+code);
    const snap=await mref.get();
    if(create){
      if(snap.exists){NET.busy=false;return netJoin(genCode(),true)}
      await mref.set({host:NET.uid,status:'lobby',ts:Date.now()});
    }else if(!snap.exists){NET.err='Комната «'+code+'» не найдена';NET.busy=false;render();return}
    NET.code=code;NET.stage='room';NET.started=false;
    try{localStorage.setItem('gl_room',code);localStorage.setItem('gl_name',NET.name)}catch(e){}
    const sref=NET.db.doc('games/'+code+'/seats/'+NET.uid);
    const ss=await sref.get(),gm=(await mref.get()).data()||{};
    if(!ss.exists&&gm.status==='lobby')await sref.set({uid:NET.uid,name:NET.name||'Игрок',ch:null,sea:null,ts:Date.now()});
    NET.unsub.push(mref.onSnapshot(sn=>{
      NET.meta=sn.exists?sn.data():null;
      if(NET.meta&&NET.meta.status==='playing'&&!NET.started){NET.started=true;startOnline(NET.meta)}else render();
    },e=>netErr(e,'Связь с комнатой')));
    NET.unsub.push(NET.db.collection('games/'+code+'/seats').onSnapshot(sn=>{
      NET.seats=sn.docs.map(d=>d.data()).sort((a,b)=>a.ts-b.ts);if(!G)render();
    },e=>netErr(e,'Список игроков')));
  }catch(e){NET.err='Не удалось войти: '+(e&&e.message||e)}
  NET.busy=false;render();
}
async function setSeat(patch){
  const me=NET.seats.find(x=>x.uid===NET.uid);if(!me)return;
  try{await NET.db.doc('games/'+NET.code+'/seats/'+NET.uid).set(Object.assign({},me,patch))}catch(e){netErr(e,'Не удалось выбрать')}
}
async function netStart(){
  const S=NET.seats.slice(0,4);

  const order=S.slice();for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  const seed=1+Math.floor(Math.random()*2e9);
  try{await NET.db.doc('games/'+NET.code).update({status:'playing',seed,players:order.map(x=>({uid:x.uid,name:x.name,ch:x.ch,sea:x.sea}))})}
  catch(e){netErr(e,'Не удалось начать')}
}
function netLeave(){
  for(const u of NET.unsub){try{u()}catch(e){}}
  NET.unsub=[];NET.on=false;NET.stage='menu';NET.code=null;NET.meta=null;NET.seats=[];NET.started=false;NET.me=-1;NET.log=[];NET.remote={};NET.desync=false;NET.err='';
  try{localStorage.removeItem('gl_room')}catch(e){}
  G=null;UI.setup=null;
}
function netBanner(){

  if(NET.err)h+='<div class="ov" style="background:none;pointer-events:none;align-items:flex-end;justify-content:center"><div class="modal" style="max-width:640px;pointer-events:auto;border:1px solid var(--danger);padding:10px 14px;flex-direction:row;align-items:center;gap:10px;max-height:none"><span style="flex:1">'+esc(NET.err)+'</span>'+(NET.desync?'<button class="btn primary" data-ui="resync">Пересчитать партию</button>':'')+'</div></div>';
  return h;
}
function renderLobby(){
  $('#top').innerHTML='<span class="title">Гранд Лайн</span><span class="sp"></span>';
  $('#now').innerHTML='';$('#side').innerHTML='';$('#map').innerHTML='';$('#legend').innerHTML='';
  let name='';try{name=NET.name||localStorage.getItem('gl_name')||''}catch(e){}
  let last='';try{last=localStorage.getItem('gl_room')||''}catch(e){}
  let h='<div class="ov solid"><div class="modal" style="max-width:820px">';
  if(NET.stage==='menu'){
    h+='<h2>Игра по сети</h2><div class="small">Каждый открывает эту страницу на своём устройстве. Для записи ходов нужен доступ Contributor (владелец выдаёт его в меню «Поделиться»).</div>';
    h+='<div class="row"><label>Ваше имя: <input id="nname" value="'+esc(name)+'" maxlength="14" placeholder="Имя"></label></div>';
    h+='<div class="row"><button class="btn primary" id="ncreate"'+(NET.busy?' disabled':'')+'>Создать комнату</button></div>';
    h+='<div class="row"><label>Код комнаты: <input id="ncode" maxlength="6" style="width:90px;text-transform:uppercase" value="'+esc(last)+'"></label><button class="btn" id="njoin"'+(NET.busy?' disabled':'')+'>Войти</button></div>';
    h+='<div class="row"><button class="btn" id="nback">← Играть на одном экране</button></div>';
  }else{
    const mine=NET.seats.find(x=>x.uid===NET.uid);
    const isHost=NET.meta&&NET.meta.host===NET.uid;
    h+='<h2>Комната <span class="num" style="letter-spacing:.2em">'+esc(NET.code)+'</span></h2><div class="small">Сообщите код друзьям. Игроков от 2 до 4: у каждого свой персонаж и своё море.</div>';
    h+='<table class="t"><tr><th>Игрок</th><th>Персонаж</th><th>Море</th></tr>'+NET.seats.slice(0,4).map(x=>'<tr><td>'+esc(x.name)+(x.uid===NET.uid?' (вы)':'')+(NET.meta&&NET.meta.host===x.uid?' ★':'')+'</td><td>'+(x.ch?'<span class="avw sm" style="--pc:var(--accent)">'+av(x.ch)+'</span> '+esc(CH[x.ch].n):'—')+'</td><td>'+(x.sea?esc(SEAS[x.sea]):'—')+'</td></tr>').join('')+'</table>';
    if(mine){
      const tk=NET.seats.filter(x=>x.uid!==NET.uid).map(x=>x.ch),ts=NET.seats.filter(x=>x.uid!==NET.uid).map(x=>x.sea);
      h+='<div class="grp"><b>Ваш персонаж</b></div><div class="chars">'+Object.keys(CH).map(k=>'<button class="btn" data-nch="'+k+'"'+(tk.includes(k)?' disabled':'')+(mine.ch===k?' style="box-shadow:0 0 0 2px var(--accent)"':'')+'><span class="avw" style="--pc:var(--accent)">'+av(k)+'</span><b>'+CH[k].n+'</b><span>атака '+CH[k].A+' / уклонение '+CH[k].U+'</span><span class="small">'+esc(CH[k].d)+'</span></button>').join('')+'</div>';
      h+='<div class="grp"><b>Ваше море</b></div><div class="row">'+SEAK.map(k=>'<button class="btn" data-nsea="'+k+'"'+(ts.includes(k)?' disabled':'')+(mine.sea===k?' style="box-shadow:0 0 0 2px var(--accent)"':'')+'>'+SEAS[k]+'</button>').join('')+'</div>';
    }else h+='<div class="small">Игра уже идёт или мест нет: вы будете наблюдателем.</div>';
    h+='<div class="row">'+(isHost?'<button class="btn primary" id="nstart">Начать игру</button>':'<span class="small">Ждём, пока создатель комнаты начнёт игру…</span>')+'<button class="btn" id="nleave">Выйти</button></div>';
  }
  if(NET.err)h+='<div class="lose">'+esc(NET.err)+'</div>';
  h+='</div></div>';
  $('#modal').innerHTML=h;
  const g=id=>document.getElementById(id);
  const nm=()=>{const v=(g('nname')&&g('nname').value.trim())||'Игрок';NET.name=v;return v};
  if(g('ncreate'))g('ncreate').onclick=()=>{nm();netJoin(genCode(),true)};
  if(g('njoin'))g('njoin').onclick=()=>{nm();netJoin(g('ncode').value,false)};
  if(g('nback'))g('nback').onclick=()=>{NET.on=false;render()};
  document.querySelectorAll('[data-nch]').forEach(b=>b.onclick=()=>setSeat({ch:b.dataset.nch}));
  document.querySelectorAll('[data-nsea]').forEach(b=>b.onclick=()=>setSeat({sea:b.dataset.nsea}));
  if(g('nstart'))g('nstart').onclick=netStart;
  if(g('nleave'))g('nleave').onclick=()=>{netLeave();render()};
}
// ---------- test API ----------
window.__g={
  render:()=>render(),setViewer:v=>{UI.viewer=v},seed:n=>{seedv=n|0},noRender:v=>{window.__nor=v},
  start:(n,seed)=>{if(seed!=null)seedv=seed|0;const names=['A','B','C','D'].slice(0,n);const chs=shuffle(Object.keys(CH));const seas=shuffle(SEAK.slice());newGame({players:names.map((nm,i)=>({name:nm,ch:chs[i],sea:seas[i]}))});},
  get G(){return G},get NET(){return NET},submit,
  netStep(){
    if(!NET.on||!G||G.winner!=null||NET.desync||viewerNeeded()!==NET.me)return false;
    const A=actions();const pe=G.pending;
    if(pe&&pe.type==='prep'){const p=G.players[pe.who];const sv=seedv;const pr=randomPrep(p);seedv=sv;submit({t:'p',pr});return true}
    const ok=A.map((a,i)=>[a,i]).filter(([a])=>!a.dis);if(!ok.length)return false;
    let pick;if(pe)pick=ok[Math.floor(Math.random()*ok.length)];else{const non=ok.filter(([a])=>a.g!=='end');pick=(non.length&&Math.random()<.92)?non[Math.floor(Math.random()*non.length)]:ok.find(([a])=>a.g==='end')||ok[0]}
    submit({t:'a',i:pick[1]});return true;
  },
  actions,act,after,
  step(){
    // выбор случайного действия бота; пока не завершён ход, предпочитает осмысленные
    const A=actions().filter(a=>!a.dis);
    if(!A.length)return false;
    let a;
    if(G.pending){
      if(G.pending.type==='prep'){const pe=G.pending;const p=G.players[pe.who];const pr=randomPrep(p);if(!validPrep(p,pr))throw new Error('bad random prep');G.pending=null;pe.cb(pr);after();return true}
      a=A[Math.floor(rnd()*A.length)];
    }else{
      const non=A.filter(x=>x.g!=='end');
      a=(non.length&&rnd()<.92)?non[Math.floor(rnd()*non.length)]:A.find(x=>x.g==='end');
    }
    act(a);return true;
  },
  check(){
    const err=[];
    const seen=new Set();
    for(const p of G.players){
      if(p.berries<0)err.push('berries<0 '+p.name);
      if(p.atk.length>10||p.pas.length>10||p.tre.length>3)err.push('limit '+p.name+' '+p.atk.length+' '+p.pas.length+' '+p.tre.length);
      if(p.fl<0||p.fl>4)err.push('fl '+p.fl);
      if(p.fl!==4-Object.keys(G.flags).filter(l=>G.flags[l]===p.i).length)err.push('flag count mismatch '+p.name);
      if(!p.loc||(p.loc!=='Z'&&p.loc!=='L'&&!MAPD.nodes[p.loc]))err.push('bad loc '+p.loc);
      if(p.loc==='Z'&&!G.zun)err.push('Z without zun');
      for(const c of [...p.atk,...p.pas,...p.tre]){if(seen.has(c.cid))err.push('dup card '+c.cid);seen.add(c.cid)}
      if(p.pon.length+Object.keys(G.ponAt).length>4+0&&false)err.push('pon');
    }
    for(const c of G.discard){if(seen.has(c.cid))err.push('dup discard '+c.cid);seen.add(c.cid)}
    const tot=G.players.reduce((a,p)=>a+p.pon.length,0)+Object.keys(G.ponAt).length;
    if(tot!==4)err.push('poneglyph total '+tot);
    if(G.ap<0)err.push('ap<0 '+G.ap);
    return err;
  }
};
render();
})();
